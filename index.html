\"title\": \"第一条\", \"role\": \"記録を正としてノートを直す。読み合わせと改訂報告の始まり\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"l3\"], \"plants\": [\"y3\"], \"pays\": [], \"chars\": \"真柴、葉山\", \"note\": \"\", \"cards\": [\"p6\", \"p4\", \"i15\", \"w1\", \"i12\", \"pl5\"], \"pageData\": [], \"text\": \"次の朝、葉山は一枚の起案書を書き上げた。\\n\\n記録取扱規程　第一条\\n一、財団の記録とSCP-TTTT-JPの記述が食い違うときは、記録を正とし、SCP-TTTT-JPを訂正する。\\n二、記録どうしが食い違うときは、より上位の記録を正とする。上位が等しいときは、より古い記録を正とする。\\n三、職員は、記録を分担して読み合わせる。食い違いを見つけた者は、改訂報告を提出する。\\n四、人がいるか、いないかの根拠とする記録は、職員名簿と人事記録に限る。物の記録は、人がいるか、いないかの根拠としない。\\n\\n「四は、何のためですか」と真柴は聞いた。\\n「物の記録まで人の根拠にすると、落とし物の荷札一枚で、人が増えたり消えたりしてしまうから」と葉山は言った。「人のことは、人の記録で決める」\\n\\n「それに、みんなで読むんですか」と真柴は聞いた。\\n「一人で読むと、一人ぶん書き換えられたら終わりです」と葉山は言った。「十人で読んで、十人の記録を突き合わせれば、どこが本当か分かる。食い違いを見つけたら、報告を出してもらう。私が、その報告を見て、ノートを直す」\\n\\n所長は、その日のうちに起案書に署名した。確認者の欄に、真柴が名前を書いた。\\nその日の午後、記録管理課で、初めての読み合わせが行われた。十二人が、手分けして書類を声に出して読んだ。読み終えるたびに、名前と時刻を書いた。食い違いが見つかるたびに、改訂報告が一枚ずつ、葉山の机に積まれていった。\\n\\nノートは、低温収容棟の第3収容室で保管されることになった。見つかった場所に戻せば、おかしな行の増え方が少し遅くなる。葉山は、そのことにも気づいていた。\\n「今夜から、ノートの訂正は、あの部屋でやります」と葉山は言った。「入室の二人目を、お願いできますか」\\nその日から、第3収容室の入室は二名で、という決まりができた。\", \"ty\": \"1978\", \"tm\": \"2\", \"td\": \"20\", \"tt\": \"09:00\", \"tl\": \"四十九年前\"}, {\"id\": \"l5\", \"title\": \"破れたページ\", \"role\": \"「葉山という職員はいない」という行を消そうとして、紙が破れる\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"l4\"], \"plants\": [], \"pays\": [], \"chars\": \"真柴、葉山\", \"note\": \"\", \"cards\": [\"p6\", \"p4\", \"i16\", \"pl5\"], \"pageData\": [], \"text\": \"二月二十日、夜十一時。第3収容室。\\n\\n葉山は、部屋の奥の机でノートを開き、積まれた改訂報告を一枚ずつ見ながら、おかしな行を直していった。真柴は、扉の内側に立っていた。部屋の中では、話さない。ただ、鉛筆の音だけが響いていた。\\n\\n午前二時。葉山の手が止まった。\\n真柴は、葉山の肩ごしにノートをのぞきこんだ。そのページの、いちばん下。インクの色が新しい、一行。\\n\\n記録管理課に、葉山という職員はいない。\\n\\nそのすぐ上の行は、古い筆跡のままだった。\\n記録管理課　葉山。\\n\\nノートは、直している人間そのものを、消そうとしていた。\\n次の日の出までにこの行を直さなければ、葉山は、最初からいなかったことになる。\\n\\n葉山は、鉛筆で線を引こうとした。けれど、新しい行のインクは、鉛筆をはじいた。何度引いても、線が乗らない。\\n葉山は、消しゴムを取りだした。新しい行を、強くこすった。\\n\\n紙が、破れた。\\n\\n新しい行と一緒に、その上の古い行までが、ちぎれて机の上に落ちた。記録管理課に、葉山という職員はいない。記録管理課、葉山。\\n二つの行は、霜の床に落ちて、そのまま白く凍った。\\n\\nノートのそのページには、もう、葉山について書かれた行は、一つもなかった。いる、とも、いない、とも。\", \"ty\": \"1978\", \"tm\": \"2\", \"td\": \"20\", \"tt\": \"23:00\", \"tl\": \"四十九年前\"}, {\"id\": \"l6\", \"title\": \"夜明けの任命\", \"role\": \"いるとも、いないとも書かれない人。古い字で「整合官補に任ず」\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"l5\"], \"plants\": [], \"pays\": [\"y2\"], \"chars\": \"真柴、葉山\", \"note\": \"\", \"cards\": [\"p6\", \"p4\", \"pl5\", \"i16\"], \"pageData\": [], \"text\": \"二月二十一日、午前六時二十分。日の出。\\n\\n真柴は、扉の内側で、一晩じゅう葉山を見ていた。葉山は、破れたページを見つめたまま、机の前から動かなかった。それから、また鉛筆を取って、残りの改訂報告の分を、一枚ずつ直しはじめた。\\n\\n日の出の光が、どこからか部屋に差したような気がした。地下二階に、光が差すはずはない。\\n部屋の奥の壁の、誰も読めない古い霜が、動いた。その下に、ノートの古い筆跡と同じ字で、一行が走った。\\n\\n〈整合官補に任ず〉\\n\\n真柴は、葉山を見た。机の前に、葉山がいた。いるはずだった。\\nけれど、その顔が、うまく見えなかった。見えているのに、目を離すと、どんな顔だったか分からなくなる。\\n\\n「は」\\n名前を呼ぼうとして、口が止まった。名前が、舌の上からすべり落ちていった。\\n誰を見ていたのか、分からなくなった。\\n\\n気がつくと、部屋の奥の机には、ノートが一冊、閉じて置いてあるだけだった。\\n真柴は、理由の分からない涙を流しながら、廊下に出た。\\n\\n棚は灰色だった。廊下の数も、食堂の場所も、元どおりだった。誰も、それを不思議に思わなかった。\", \"ty\": \"1978\", \"tm\": \"2\", \"td\": \"21\", \"tt\": \"06:20\", \"tl\": \"四十九年前\"}, {\"id\": \"l7\", \"title\": \"机の上の紙\", \"role\": \"欠番だけがノートを直せる。読まれない記録は嘘になる。言葉の始まり\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"l6\"], \"plants\": [], \"pays\": [\"y1\"], \"chars\": \"真柴\", \"note\": \"\", \"cards\": [\"p6\", \"p4\", \"i2\", \"w7\", \"w13\", \"p9\", \"pl2\"], \"pageData\": [], \"text\": \"その日の昼、真柴は北の壁沿いの机に、小さな紙が一枚置いてあるのを見つけた。\\n\\n誰の机なのか、思い出せなかった。けれど、机の上には、几帳面な字で番号を振った改訂報告の束が、きちんと積まれていた。紙は、そのいちばん上にあった。\\n\\n〈ノートのページが破れて、私は、ノートのどこにも書かれていない人間になりました。いる、とも、いない、とも。\\nそういう人間は、ノートに書き換えられません。そのかわり、ノートを直すことができます。\\nだから、これからは、私が夜のうちに直します。\\n\\n皆さんは、読み合わせを続けてください。記録とノートが食い違っているのを見つけたら、改訂報告を出してください。それを見て、私が直します。\\n\\n一つだけ、気をつけてください。\\n誰にも読まれない記録は、ノートのおかしな行に引きずられて、少しずつ別の言葉になっていきます。そして、間違った記録を見本にして直せば、ノートも間違ったほうへ直ってしまう。\\n財団の書類は、誰かが読み返さなければ、少しずつ嘘になっていきます。だから、読んでください。毎日。誰かが〉\\n\\n真柴は、名簿を開いた。いちばん最初のページに、見覚えのない行が一つ増えていた。\\n\\n整合官補　葉山。\\n\\n番号の欄は、空いていた。職員番号の制度ができたのは、その年の四月のことだ。その前にどこにも書かれなくなった人に、番号は振られなかった。\\n\\nその日から、真柴は毎朝、書類を読み返すようになった。北の壁沿いの机で。\\n読み合わせは、それから何年かのあいだ、課の全員で続けられた。けれど、書き換えが起きない年が続くと、少しずつ人が減り、いつのまにか規程の上だけのものになった。毎朝本当に読んでいたのは、北の壁沿いの机の一人だけだった。\\n何年もあとで、真柴はその役目を一人の新人に教えることになる。右へ少し傾いた字を書く、鳴瀬という新人に。\", \"ty\": \"1978\", \"tm\": \"2\", \"td\": \"21\", \"tt\": \"12:00\", \"tl\": \"四十九年前\"}, {\"id\": \"l8\", \"title\": \"毎日、誰かが\", \"role\": \"四十九年後、小池が葉山のメモを霜に残す。窓の外の大きな机\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"l7\", \"l1\"], \"plants\": [], \"pays\": [\"y3\"], \"chars\": \"小池、沖田、三輪\", \"note\": \"\", \"cards\": [\"p7\", \"p3\", \"p1\", \"pl5\", \"i15\", \"p4\", \"pl2\"], \"pageData\": [], \"text\": \"二〇二七年四月一日、夜。原本室の扉の前に、小池と沖田が立っていた。\\n\\n「読み合わせをして、食い違いを見つけたら改訂報告を出す。それを見て、整合官が夜のうちに直す」と小池は言った。「全部、ここから始まってたんですね」\\n「欠番も」と沖田は言った。「どこにも書かれていない人だけが、ノートを直せる。だから、欠番になった人は、整合官補になる」\\n沖田は、少し黙ってから続けた。\\n「財団の書類は、誰かが読み返さなければ、少しずつ嘘になっていく。真柴課長から鳴瀬さん、鳴瀬さんから私、私から三輪さん。最初は、葉山さんだった」\\n\\n二人は中に入った。佐伯の言葉の前を通り、白い沈黙の前を通り、三輪の名前の前を通り、いちばん奥の壁の前に立つ。\\n床に近いところに、二本の短い霜の線が、凍ったまま残っていた。四十九年前に、ノートから破れて落ちた二つの行だ。\\n記録管理課に、葉山という職員はいない。記録管理課、葉山。\\n\\n小池は、葉山のメモを広げて、声に出して読んだ。\\n「だから、読んでください。毎日。誰かが」\\n霜が、小池の字で壁に走った。\\n\\n二人は黙って外に出た。小池が時計を見た。五十秒。\\n\\n次の朝、北の壁沿いの机には、小池の新しい花が一輪増えていた。その横に、丸い鉛筆の字のメモがあった。\\n\\n〈窓の外の白い雨の向こうに、ときどき、大きな机が見えます。誰かがそこで、一晩じゅう、古いノートに鉛筆を走らせています。\\n顔は、見えません。でも、とても几帳面な字を書く人です。\\n鳴瀬さんに聞きました。ノートを直すのは、あの机の人の仕事です。補の仕事は、見ることと、印をつけて知らせること。四十九年前は、補も整合官も、あの人一人きりだったから、自分で直すしかなかったそうです〉\\n\\n名簿のいちばん最初のページでは、統括整合官の葉山の行が、いつもどおり、番号の欄だけを空けて、静かにそこにあった。\", \"ty\": \"2027\", \"tm\": \"4\", \"td\": \"1\", \"tt\": \"22:00\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"y1\", \"name\": \"葉山の机の小さな紙\"}, {\"id\": \"y2\", \"name\": \"緑色の棚\"}, {\"id\": \"y3\", \"name\": \"あの部屋で直す\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc   else if(!pl.length)add('err','伏線',`伏線「${f.name}」は張られていないのに回収されています。`,py[0].id);
  else if(!py.length)add('warn','伏線',`伏線「${f.name}」が回収されていません。`,pl[0].id);
  else{const fp=Math.min(...pl.map(s=>idx(s.id))),fy=Math.min(...py.map(s=>idx(s.id)));
   if(fy<fp)add('err','伏線',`伏線「${f.name}」が張られる前に回収されています。`,S.scenes[fy].id);
   else if(fy===fp)add('info','伏線',`伏線「${f.name}」は同じシーンで張って回収しています。効果が弱くならないか確認してください。`,S.scenes[fy].id);}
 });
 S.scenes.forEach(s=>{s.cards=(s.cards||[]).filter(card);});
 S.cards.filter(c=>c.type==='person'&&(c.status==='dead'||c.status==='gone')&&c.statusScene&&sc(c.statusScene)).forEach(p=>{const i0=idx(p.statusScene);
  S.scenes.forEach((s,i)=>{if(i<=i0)return;const inC=(s.cards||[]).includes(p.id),inN=tagList(s.chars).some(n=>norm(n)===norm(p.title));if(inC||inN)add(p.status==='dead'?'err':'warn','人物',`${p.status==='dead'?'死亡':'退場'}した「${p.title}」（#${num(p.statusScene)}）が、その後のシーン「${s.title}」に登場しています。${p.status==='dead'?'回想や幽霊でなければ見直してください。':'再登場なら問題ありません。'}`,s.id);});});
 S.cards.filter(c=>c.type==='episode'&&!usedIn(c.id).length&&!stUsage(c.id).length).forEach(c=>out.push({lvl:'info',cat:'カード',msg:`エピソード「${c.title||'無題'}」はまだ物語に使われていません。`,cid:c.id}));
 const unusedSet=S.cards.filter(c=>c.type!=='episode'&&c.type!=='memo'&&!usedIn(c.id).length&&!stUsage(c.id).length);
 if(unusedSet.length)add('info','カード',`どのシーンにも付いていない設定カードが${unusedSet.length}枚あります（${unusedSet.map(c=>c.title).join('、')}）。`);
  S.scenes.forEach(s=>{const k=tlKey(s);if(k==null)return;(s.causes||[]).forEach(cid=>{const c=sc(cid);const kc=c&&tlKey(c);if(kc!=null&&kc>k)add('warn','因果',`#${num(c.id)}「${c.title}」は「${s.title}」の原因なのに、年表では後に起きています（${tlText(c)} ＞ ${tlText(s)}）`,s.id);});});
 return out;
}

/* reverse tree */
function treeNode(id,seen,depth,L){
 const s=sc(id);if(!s)return '';const i=idx(id);
 if(seen.has(id))return `<li><div class="ref">↺ ${esc(s.title)}（上で表示済み）</div></li>`;
 seen.add(id);
 const opts=S.scenes.filter(x=>x.id!==id&&!s.causes.includes(x.id)).map(x=>`<option value="${x.id}">${String(idx(x.id)+1).padStart(2,'0')} ${esc(x.title)}</option>`).join('');
 const kids=s.causes.map(c=>treeNode(c,seen,depth+1,L)).join('');
 const isEnd=depth===0;
 return `<li><div class="node ${UI.sel===id?'sel':''} ${isEnd?'end':''}" data-act="sel" data-id="${id}">
  ${isEnd?'<div class="kicker">結末</div>':''}
  <div class="node-top"><span class="mono muted">#${String(i+1).padStart(2,'0')}</span><b>${esc(s.title)||'（無題）'}</b></div>
  <div class="role">${s.role?esc(s.role):'役割が未記入です'}</div>
  ${(s.cards||[]).length?`<div class="node-cards">${s.cards.map(card).filter(Boolean).map(c=>`<span class="t-${c.type}">${esc(c.title)}</span>`).join('')}</div>`:''}
  <div class="node-acts"><button class="btn sm" data-act="addCause" data-id="${id}">＋このシーンの原因を作る</button>
   ${opts?`<select id="lc-${id}" data-act="linkCause" data-id="${id}" aria-label="既存シーンを原因にする"><option value="">既存シーンを原因にする…</option>${opts}</select>`:''}</div>
 </div>${kids?`<ul>${kids}</ul>`:'<div class="root-tag">● 起点（物語の発端）</div>'}</li>`;
}
function fwdNode(id,seen,depth,L,endId){
 const s=sc(id);if(!s)return '';const i=idx(id);
 if(seen.has(id))return `<li><div class="ref">↺ ${esc(s.title)}（上で表示済み）</div></li>`;
 seen.add(id);
 const kidsIds=S.scenes.filter(x=>x.causes.includes(id)).map(x=>x.id);
 const opts=S.scenes.filter(x=>x.id!==id&&!x.causes.includes(id)).map(x=>`<option value="${x.id}">${String(idx(x.id)+1).padStart(2,'0')} ${esc(x.title)}</option>`).join('');
 const kids=kidsIds.map(c=>fwdNode(c,seen,depth+1,L,endId)).join('');
 const isEnd=id===endId,isRoot=depth===0;
 return `<li><div class="node ${UI.sel===id?'sel':''} ${isEnd?'end':''}" data-act="sel" data-id="${id}">
  ${isRoot?'<div class="kicker" style="color:var(--ok)">起点</div>':''}${isEnd?'<div class="kicker">結末</div>':''}
  <div class="node-top"><span class="mono muted">#${String(i+1).padStart(2,'0')}</span><b>${esc(s.title)||'（無題）'}</b></div>
  <div class="role">${s.role?esc(s.role):'役割が未記入です'}</div>
  ${(s.cards||[]).length?`<div class="node-cards">${s.cards.map(card).filter(Boolean).map(c=>`<span class="t-${c.type}">${esc(c.title)}</span>`).join('')}</div>`:''}
  <div class="node-acts"><button class="btn sm" data-act="addEffect" data-id="${id}">＋このシーンの結果を作る</button>
   ${opts?`<select id="le-${id}" data-act="linkEffect" data-id="${id}" aria-label="既存シーンを結果にする"><option value="">既存シーンを結果にする…</option>${opts}</select>`:''}</div>
 </div>${kids?`<ul>${kids}</ul>`:(isEnd?'<div class="root-tag" style="color:var(--ink)">■ 物語の終わり</div>':'<div class="dead-tag">▲ ここで途切れています（結末につながっていません）</div>')}</li>`;
}
function reverseTab(){
 const end=sc(S.story.endingSceneId),L=layout();
 const sw=`<div class="treedir" role="group" aria-label="ツリーの向き"><button aria-pressed="${UI.treeDir==='back'}" data-act="treeDir" data-v="back">後ろから（結末 → 原因）</button><button aria-pressed="${UI.treeDir==='forward'}" data-act="treeDir" data-v="forward">前から（起点 → 結末）</button></div>`;
 const orph=end?S.scenes.filter(s=>!reach(end.id).has(s.id)):[];
 const orphHtml=orph.length?`<div class="orphans"><b>結末につながっていないシーン</b><p class="lead" style="margin:4px 0 8px">どこかのシーンの原因として結ぶか、不要なら削除します。</p>${orph.map(s=>`<button class="btn sm" data-act="sel" data-id="${s.id}" style="margin:0 6px 6px 0">${String(idx(s.id)+1).padStart(2,'0')} ${esc(s.title)}</button>`).join('')}</div>`:'';
 if(UI.treeDir==='forward'){
  let roots=S.scenes.filter(s=>!s.causes.length).map(s=>s.id);if(!roots.length&&S.scenes.length)roots=[S.scenes[0].id];
  const seen=new Set();let tree=roots.map(r=>fwdNode(r,seen,0,L,end&&end.id)).join('');
  const rest=S.scenes.filter(s=>!seen.has(s.id));rest.forEach(s=>{if(!seen.has(s.id))tree+=fwdNode(s.id,seen,0,L,end&&end.id);});
  return `<div class="sec"><h2>ツリー</h2>${sw}
  <p class="lead">一番上が物語の起点（原因のないシーン）です。「このシーンの結果を作る」で、その出来事から起きる次のシーンを後ろに追加していきます。結末にたどり着かない枝は「途切れています」と表示されます。</p>
  ${end?'':'<p class="lead" style="color:var(--warn)">結末シーンがまだ決まっていません。シーンを選び、編集欄の「結末に設定」を押してください。</p>'}
  <ul class="tree">${tree}</ul>${orphHtml}</div>`;
 }
 if(!end)return `<div class="sec"><h2>ツリー</h2>${sw}<p class="lead">結末シーンが決まっていません。左の一覧からシーンを選び、編集欄の「結末に設定」を押してください。「前から」に切り替えると、起点から組み立てることもできます。</p></div>`;
 const seen=new Set();const tree=treeNode(end.id,seen,0,L);
 return `<div class="sec"><h2>ツリー</h2>${sw}
 <p class="lead">一番上が結末です。「このシーンの原因を作る」で、その出来事が起きるために必要なシーンを手前に追加していきます。原因のないシーンは物語の起点になります。</p>
 <ul class="tree">${tree}</ul>
 ${orphHtml}
 </div>`;
}

const AFF_PRESET=[['火','草',1],['草','水',1],['水','火',1],['雷','水',1],['土','雷',1],['光','闇',1],['闇','光',1],['水','水辺',1],['火','雨',-1],['氷','雪',1]];
function allAttrs(){const s=new Set();S.cards.forEach(c=>{(c.abilities||[]).forEach(a=>tagList(a.attr).forEach(x=>s.add(x)));tagList(c.weakAttr).forEach(x=>s.add(x));tagList(c.resistAttr).forEach(x=>s.add(x));});(S.affinity||[]).forEach(r=>{if(r.atk)s.add(r.atk);});return [...s];}
function allEnvs(){const s=new Set();S.cards.forEach(c=>{tagList(c.env).forEach(x=>s.add(x));tagList(c.envGood).forEach(x=>s.add(x));tagList(c.envBad).forEach(x=>s.add(x));});return [...s];}
function abilityDatalists(){return `<datalist id="dl-attr">${allAttrs().map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist><datalist id="dl-env">${allEnvs().map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist><datalist id="dl-attrenv">${[...new Set([...allAttrs(),...allEnvs()])].map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`;}
function affIsEnv(x){const n=norm(x);return allEnvs().some(e=>norm(e)===n)&&!S.cards.some(c=>(c.abilities||[]).some(a=>tagList(a.attr).some(t=>norm(t)===n))||tagList(c.weakAttr).some(t=>norm(t)===n)||tagList(c.resistAttr).some(t=>norm(t)===n));}
function affRevState(r){if(!r.atk||!r.def||norm(r.atk)===norm(r.def)||affIsEnv(r.def))return '';const q=(S.affinity||[]).find(q=>norm(q.atk)===norm(r.def)&&norm(q.def)===norm(r.atk));if(!q)return 'none';const a=(Number(r.v)||1)>0,b=(Number(q.v)||1)>0;return a===b?'same':'ok';}
function affRevCell(r,i){const st=affRevState(r),v=(Number(r.v)||1)>0;const rev=`${r.def} は ${r.atk} に ${v?'不利':'有利'}`;
 if(st==='none')return `<button class="btn sm aff-rev" data-act="affRev" data-i="${i}" title="「${esc(rev)}」を足します">⇄ 反対も作る</button>`;
 if(st==='ok')return `<span class="aff-rev ok" title="反対の「${esc(rev)}」も決まっています">⇄ 反対あり</span>`;
 if(st==='same')return `<span class="aff-rev same" title="反対向きも同じ「${v?'有利':'不利'}」です（お互いに${v?'効く':'効きにくい'}関係）。片方だけにしたいときは、反対の行を直してください">⇄ お互いに${v?'有利':'不利'}</span>`;
 return '<span></span>';}
function affV(x,y){let v=0;(S.affinity||[]).forEach(r=>{if(r.atk&&r.def&&norm(r.atk)===norm(x)&&norm(r.def)===norm(y))v+=(Number(r.v)||1);});return v;}
const hasAbility=c=>c.type==='person'&&((c.abilities||[]).some(a=>a.name||a.attr)||c.weakAttr||c.resistAttr||c.envGood||c.envBad);
function attackScore(A,B){const o={s:0,why:[]};const bw=tagList(B.weakAttr).map(norm),br=tagList(B.resistAttr).map(norm);
 (A.abilities||[]).forEach(a=>{const w=(Number(a.power)||3)/3,an=a.name||'能力';tagList(a.attr).forEach(x=>{const nx=norm(x);
  if(bw.includes(nx)){o.s+=2*w;o.why.push(`${A.title}の「${an}」（${x}）は${B.title}の弱点`);}
  if(br.includes(nx)){o.s-=1*w;o.why.push(`${A.title}の「${an}」（${x}）は${B.title}に効きにくい`);}
  (B.abilities||[]).forEach(b=>tagList(b.attr).forEach(y=>{const v=affV(x,y);if(v){o.s+=v*w*0.8;o.why.push(`${x}は${y}に${v>0?'有利':'不利'}（「${an}」対「${b.name||y}」）`);}}));});});
 return o;}
function matchup(A,B){const f=attackScore(A,B),g=attackScore(B,A);return {score:f.s-g.s,mine:f.why,theirs:g.why};}
function envFit(A,P){const env=tagList(P.env).map(norm);if(!env.length)return null;let s=0;const why=[];
 tagList(A.envGood).forEach(e=>{if(env.includes(norm(e))){s+=1.5;why.push(`得意な環境「${e}」`);}});
 tagList(A.envBad).forEach(e=>{if(env.includes(norm(e))){s-=1.5;why.push(`苦手な環境「${e}」`);}});
 (A.abilities||[]).forEach(a=>tagList(a.attr).forEach(x=>tagList(P.env).forEach(e=>{const v=affV(x,e);if(v){s+=v*0.8*((Number(a.power)||3)/3);why.push(`「${a.name||x}」（${x}）は「${e}」で${v>0?'強まる':'弱まる'}`);}})));
 return {s,why};}

const TERR={land:'陸地',forest:'森',mountain:'山地',water:'湖・海',desert:'砂漠',snow:'雪原',city:'市街地',building:'建物',floor:'床・部屋'};

 for(let it2=0;it2<40;it2++){const pts=areaPolyPts(it,24);let worst=null,wd=0;

function fitToLot(m,it,lot,g){if(lot.shape==='poly'){it.shape='poly';it.pts=insetPoly(lot,g).map(q=>[Math.round(q[0]),Math.round(q[1])]);delete it.x;delete it.y;delete it.w;delete it.h;}

function lineOffset(it,m){const w=it.width||LW0[it.style||'road'];const al=it.align||'auto';

function resample(pts,step){const out=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(l/step));for(let k=0;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n,i]);}out.push([...pts[pts.length-1],pts.length-1]);return out;}
function distPL(x,y,pl){let best=Infinity;for(let i=0;i<pl.length-1;i++)best=Math.min(best,segDist(x,y,pl[i][0],pl[i][1],pl[i+1][0],pl[i+1][1]));return best;}

function trimAgainst(m,K,B){const wK=K.width||LW0.road,wB=B.width||LW0.road;const vK=offsetPts(K.pts,lineOffset(K,m)),vB=offsetPts(B.pts,lineOffset(B,m));
 const tol=(wK+wB)/2+2,minRun=Math.max(wK,wB)*3;const sp=resample(vB,3);const ov=sp.map(p=>distPL(p[0],p[1],vK)<=tol);
 let i=0;const runs=[];while(i<sp.length){if(ov[i]){let j=i;while(j<sp.length&&ov[j])j++;let len=0;for(let k=i+1;k<j;k++)len+=Math.hypot(sp[k][0]-sp[k-1][0],sp[k][1]-sp[k-1][1]);if(len>=minRun)runs.push([i,j-1]);i=j;}else i++;}
 if(!runs.length)return null;const cut=new Array(sp.length).fill(false);runs.forEach(([a,b])=>{for(let k=a+1;k<b;k++)cut[k]=true;});
 const pieces=[];let cur=[];sp.forEach((p,k)=>{if(cut[k]){if(cur.length>1)pieces.push(cur);cur=[];}else cur.push([p[0],p[1]]);});if(cur.length>1)pieces.push(cur);

function mergeRoads(m,keepId,mode){const roads=m.items.filter(isRoad);let changed=0;const done=new Set();

document.addEventListener('pointermove',e=>{
 if(UI.tab==='map'&&(UI.mtool==='line'||UI.mtool==='poly')){const svg=document.querySelector('.msvg'),m=curMap();if(svg&&m){const pt=svgPt(svg,e);const sp=!e.altKey&&e.target.closest&&e.target.closest('.msvg')?snapPoint(m,pt.x,pt.y,snapTol(svg,m)):null;const c=svg.querySelector('#m-snapw');

 if(UI.tab==='map'&&UI.mtool==='wall'&&!zdrag){const svg=document.querySelector('.msvg.indoor');const m=curMap();const c=svg&&svg.querySelector('#m-snap');if(c&&m&&e.target.closest&&e.target.closest('.msvg')){const v=snapV(m,svgPt(svg,e)),s=m.cs||32;c.style.display='inline';c.setAttribute('cx',v[0]*s);c.setAttribute('cy',v[1]*s);}}
 if(!zdrag)return;const z=zdrag;
 if(['npen','narrow','nmove'].includes(z.kind)){noteMove(z,svgPt(z.svg,e));return;}
 if(z.kind==='pan'){const dx=e.clientX-z.sx,dy=e.clientY-z.sy;if(Math.abs(dx)+Math.abs(dy)>4)z.moved=true;if(!z.moved)return;const k=z.v0.w/(z.svg.clientWidth||1);zSet(z.svg,{...z.v0,x:z.v0.x-dx*k,y:z.v0.y-dy*k});z.svg.classList.add('panning');return;}
 const pt=svgPt(z.svg,e);const m=curMap();if(!m)return;

 if(z.kind==='wall'){const v=snapV(m,pt),s=m.cs||32;const l=z.svg.querySelector('#m-wallprev');if(l){l.setAttribute('x2',v[0]*s);l.setAttribute('y2',v[1]*s);}z.v1=v;return;}
 if(z.kind==='newarea'){const x=Math.min(z.x0,pt.x),y=Math.min(z.y0,pt.y),w=Math.abs(pt.x-z.x0),h=Math.abs(pt.y-z.y0);if(w+h>6)z.moved=true;const r=z.svg.querySelector('#m-temp');if(r){r.style.display='inline';r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);}z.rect={x,y,w,h};return;}
 if(z.kind==='rotate'){let deg=(Math.atan2(pt.y-z.c[1],pt.x-z.c[0])-z.a0)*180/Math.PI;if(e.shiftKey)deg=Math.round(deg/15)*15;Object.keys(z.it).forEach(k=>delete z.it[k]);Object.assign(z.it,JSON.parse(JSON.stringify(z.orig)));if(Math.abs(deg)>0.5){transformItem(z.it,{r:deg});z.moved=true;}const g=z.svg.querySelector(`[data-mi="${z.it.id}"]`);if(g)g.outerHTML=mapItemSvg(z.it);if(z.it.kind==='line'||isBuilding(z.it))refreshRoads(z.svg,m);return;}
 if(z.kind==='vertex'){const sp=!e.altKey?snapPoint(m,pt.x,pt.y,snapTol(z.svg,m),z.it.id):null;z.it.pts[z.i]=sp?[sp[0],sp[1]]:[pt.x,pt.y];z.moved=true;const g=z.svg.querySelector(`[data-mi="${z.it.id}"]`);if(g)g.outerHTML=mapItemSvg(z.it);if(z.it.kind==='line'||isBuilding(z.it))refreshRoads(z.svg,m);return;}
 const dx=pt.x-z.sx,dy=pt.y-z.sy;if(Math.abs(dx)+Math.abs(dy)>2)z.moved=true;if(!z.moved)return;
 const it=z.it,o=z.orig;
 if(z.kind==='move'){if(it.pts)it.pts=o.pts.map(p=>[p[0]+dx,p[1]+dy]);else{it.x=o.x+dx;it.y=o.y+dy;if(it.kind==='station'&&!e.altKey){const rs=railSnap(m,it.x,it.y,snapTol(z.svg,m)*1.5);if(rs){it.x=rs.x;it.y=rs.y;it.angle=rs.angle;}}}}

document.addEventListener('change',e=>{if(!e.target.id||!e.target.id.startsWith('cimg-'))return;const cid=e.target.id.slice(5),c=card(cid),f=e.target.files&&e.target.files[0];if(!c||!f)return;downscaleCard(f,u=>{if(!u){toast('画像を読み込めませんでした');return;}c.img=u;save();snapshotNow();render();toast('画像を付けました');});});

async function readDefSet(f){const h=new Uint8Array(await f.slice(0,5).arrayBuffer());if(h[0]===0x25&&h[1]===0x50&&h[2]===0x44&&h[3]===0x46){let d=null;try{d=await readPdfData(await f.arrayBuffer());}catch(_){}return d&&d.defImgs?{kind:'storycard-defimgs',imgs:d.defImgs,pdf:true}:{pdf:true};}try{return JSON.parse(await f.text());}catch(_){return null;}}
document.addEventListener('change',e=>{if(e.target.id!=='defset-file')return;const f=e.target.files&&e.target.files[0];if(!f)return;readDefSet(f).then(d=>{if(d&&d.pdf&&!d.imgs){toast('このPDFには標準の絵が入っていません');return;}if(d&&!d.kind&&d.defImgs&&Array.isArray(d.scenes))d={kind:'storycard-defimgs',imgs:d.defImgs};const imgs=d&&d.kind==='storycard-defimgs'&&d.imgs;if(!imgs||typeof imgs!=='object'){toast('標準の絵のファイルではないようです');return;}let n=0;S.defImgs=S.defImgs||{};DEF_KEYS.forEach(([k])=>{const v=imgs[k];if(typeof v==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(v)){S.defImgs[k]=v;n++;}});save();snapshotNow();render();toast(n?`標準の絵を${n}枚読み込みました（元に戻すで戻せます）`:'読み込める絵がありませんでした');}).catch(()=>toast('ファイルを読み込めませんでした'));});

document.addEventListener('keydown',e=>{
