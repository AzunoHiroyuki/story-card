よう、三輪さん」\\n「おはようございます、宇佐見さん」\\n\\n宇佐見は、缶を一本手渡した。三輪の指が触れる。温かい。\\n二人はしばらく、窓の外の白い光を見ていた。\\n\\n「明日からも、二本買うことにした」と宇佐見は言った。「何のためか忘れても、二本買って、一本をここに置く。それだけは、たぶん体が覚えてる」\\n三輪は、缶を両手で包んだ。\\n「じゃあ、私は毎朝、窓を開けておきます」\\n「見えなくなるのにか」\\n「見えなくても、置いてくれる人がいるなら、ここにいる意味があります」\\n\\n九時五十分。廊下で、保安部門の同僚が宇佐見を呼んだ。\\n宇佐見は立ち上がった。戸口で振り返る。窓際の席で、三輪が小さく手を振っていた。窓からの光で、輪郭が少し白くにじんで見えた。\\n「三輪さん」\\n「はい」\\n「コーヒー、冷めないうちに飲めよ」\\n\\n三輪は笑って、うなずいた。\\n扉が閉まった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"26\", \"tt\": \"08:30\", \"tl\": \"\"}, {\"id\": \"c8\", \"title\": \"補遺：処置後の経過\", \"role\": \"誰も触れない缶が、毎朝空になる\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"c7\"], \"plants\": [], \"pays\": [\"h2\"], \"chars\": \"宇佐見、鷺沼\", \"note\": \"\", \"cards\": [\"p2\", \"p8\", \"i3\", \"pl2\", \"o4\", \"e5\"], \"pageData\": [], \"text\": \"補遺ZZZZ-JP-2：処置後の経過\\n\\n2026年11月26日、宇佐見警備員に対抗ミームの提示とクラスA記憶処理を行いました。処置後の面談で、宇佐見警備員は記録管理室の窓、およびSCP-ZZZZ-JP-1について、いずれも「知らない」と答えています。段階1以上の汚染は検出されていません。\\n\\nただし、次の行動が続いていることが確認されています。\\n\\n宇佐見警備員は毎朝、購買部で缶コーヒーを二本購入します。八時半に記録管理室を訪れ、一本を北の壁沿いの机に置き、もう一本を自分で飲みます。理由を尋ねると、「なんとなく。前からの癖で」と答えます。宇佐見警備員は、北の壁を窓だと思っている様子はありません。\\n\\n監視カメラには、机の上の缶が誰にも触れられないまま映っています。それにもかかわらず、缶は翌朝までに必ず空になっています。\\n\\nまた、2026年11月27日以降、記録管理室で「窓際」という語が使われた文書は、一件も見つかっていません。\\n\\n鷺沼博士による注記：本件の汚染は収束したと判断する。缶の件は、記録として残すにとどめ、調査は行わない。\\nこれは対抗ミーム部門としての判断であり、私個人の判断でもある。\\n誰かが見ていなくても、毎朝置かれるものがあり、毎朝なくなるものがある。それを記録しておくことは、記録管理課の言い方を借りれば、私たちの仕事だ。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"27\", \"tt\": \"08:30\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"h1\", \"name\": \"最初の「窓際の机」\"}, {\"id\": \"h2\", \"name\": \"毎朝空になる缶\"}, {\"id\": \"h3\", \"name\": \"段階4は記録がない\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stD\", \"links\": [{\"id\": \"ld1\", \"a\": \"p7\", \"b\": \"p2\", \"label\": \"人柱にしようとした\", \"st\": \"stD\"}, {\"id\": \"ld2\", \"a\": \"p8\", \"b\": \"p3\", \"label\": \"手帳を頼る\", \"st\": \"stD\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"一日だけの三年\", \"ending\": \"沖田と鷺沼は、三年前の事故が一日で作られた偽の歴史だったと突き止め、落とし物になっていた本物の報告書を作成者の沖田に返して、兄を生き返らせようとした小池の企みを止める。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"d8\"}, \"scenes\": [{\"id\": \"d1\", \"title\": \"番号114\", \"role\": \"鷺沼が、三年前の報告書に今年の番号が付いていることに気づく\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"j1\", \"j2\"], \"pays\": [], \"chars\": \"鷺沼\", \"note\": \"\", \"cards\": [\"p8\", \"i1\", \"p4\", \"o4\"], \"pageData\": [], \"text\": \"鷺沼博士は、報告書の最後の一行を書けずにいた。\\n\\nSCP-ZZZZ-JP、汚染は収束。その結論に、間違いはない。宇佐見警備員の処置は終わり、「窓際」という言葉を含む文書は、もう一件も出てこない。\\nそれでも、閉じる前に関連する文書をすべて読み直すのが、鷺沼のやり方だった。\\n\\nSCP-XXXX-JPの事案記録。十一月十六日の照合で見つかった矛盾。事故報告書81K1-114。その改訂報告。作成者の欄の黒塗りと、「欠番」の二文字。\\n\\n鷺沼の指が、報告書の番号の上で止まった。\\n114。\\n\\nサイト-81K1の事故報告書は、年をまたいでも通し番号で振られる。鷺沼は書庫の索引を引いた。2023年に作られた事故報告書は、81K1-090から81K1-103まで。2026年に入ってからの最新は、十一月十四日付の81K1-113だった。\\n\\n三年前の事故の報告書に、今年の十一月の番号が付いている。\\n\\nもう一つ、気になることがあった。照合プログラムが矛盾を見つけた十一月十六日は、三年前の事故とちょうど同じ日付だった。命日に、死んだはずの人の記録が赤く光る。\\n偶然にしては、できすぎている。\\n\\n鷺沼は報告書を閉じずに、記録管理課へ内線をかけた。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"30\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"d2\", \"title\": \"三年前の手帳\", \"role\": \"財団の文書ではない手帳だけが、本当の三年前を覚えていた\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"d1\"], \"plants\": [\"j3\"], \"pays\": [], \"chars\": \"鷺沼、沖田\", \"note\": \"\", \"cards\": [\"p8\", \"p3\", \"i6\", \"p5\"], \"pageData\": [], \"text\": \"「三年前の手帳？　あるわよ」\\n沖田礼子は、課長室の棚から古い手帳を一冊抜きだした。表紙に「2023」と書いてある。三十年分の手帳が、年ごとに並んでいた。\\n\\n「整合官は、財団の文書を書き換える」と鷺沼は言った。「でも、課長の手帳は財団の文書ではありませんよね」\\n「ええ。私物よ」\\n\\n沖田は、十一月十六日のページを開いた。きちょうめんな字が並んでいた。\\n\\n00:42　B2低温収容棟で収容違反。\\n佐伯健吾（0383）死亡。宇佐見恭平（0388）凍傷、医療棟へ。\\n事故報告書81K1-097、作成：沖田。\\n\\n二人は、しばらく黙ってそのページを見ていた。\\n死んだのは佐伯。報告書を書いたのは、沖田自身。番号は097。どこにも書き間違いはない。\\n\\n「報告書81K1-114の作成者は、三輪栞という研究員補になっています」と鷺沼は言った。\\n沖田は首をかしげた。その名前を、沖田はもう覚えていられない。けれど、手帳なら探せる。ページをさかのぼり、次の年の手帳を開き、さらにその次を開いた。\\n\\n2025年4月1日　新人着任：研究員補　三輪栞。\\n\\n「この人がここに来たのは、去年の春よ」と沖田は言った。「三年前の事故の報告書なんて、書けるはずがない」\\n\\nページをめくる途中、今年の十一月十五日の行が、ちらりと目に入った。\\n22:50　小池くんに書庫の鍵を貸す。\\nそのときの二人は、まだ、その一行の意味に気づいていなかった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"30\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"d3\", \"title\": \"一日でできた三年\", \"role\": \"日の出ごとに一段。三年分の歴史は一日で作られていた\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"d2\"], \"plants\": [], \"pays\": [\"j1\", \"j2\"], \"chars\": \"鷺沼、沖田\", \"note\": \"\", \"cards\": [\"p8\", \"p3\", \"w1\", \"w6\", \"pl2\", \"pl4\"], \"pageData\": [], \"text\": \"その夜、二人は記録管理室の大きな机に、文書を時刻の順に並べた。\\n\\n「整合官は、日の出ごとに矛盾の訂正をします」と鷺沼は言った。「ただし、ある行を直したせいで新たに生まれた食い違いは、次の日まで待たなければならない。だから、食い違いの連鎖は、一度の日の出に一段ずつしか進まない」\\n「一段ずつなら、何段でも積める、ということね」\\n\\n鷺沼は、紙に線を引いた。\\n\\n十一月十五日の夜。誰かが本物の報告書81K1-097を抜き取り、偽の報告書81K1-114を書庫に入れる。日付は三年前。死亡者は0388、宇佐見。作成者は三輪。\\n十一月十六日の日の出。整合官は、偽の報告書に合わないものを書き換えた。慰霊碑の名前は宇佐見になった。佐伯の記録は「退職」になった。そして三輪は、三年前に自分がその報告書を書いた、という記憶を持った。\\nただし一つだけ、わざと残された矛盾がある。宇佐見の給与記録。宇佐見は生きて、ここで働いている。\\n\\n「その矛盾を、十一月十六日の照合で見つけさせる」と沖田が言った。\\n「次の日の出、十一月十七日に書き換わるのは、宇佐見さんのほうです。三年前に死んだのは宇佐見さんで、佐伯さんは退職して、どこかで生きている。そういう世界になるはずでした」\\n\\n三年分の歴史は、たった一日で作られていた。\\n三輪が覚えていた三年前の夜も、手書きのメモのにじんだ数字も、宇佐見が毎朝コーヒーを運んだ「三年」も、全部、十一月十六日の朝に生まれたものだった。\\n\\n「改訂申請には、ふつう三週間かかる」と沖田はつぶやいた。「でも、矛盾が見つかってから日の出までは一日しかない。誰にも止められないように作ってあったのね」\\n「止めた人が、一人だけいました」\\n鷺沼は、黒塗りの作成者欄を指さした。\\n沖田は、その欄をしばらく見ていた。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"30\", \"tt\": \"21:00\", \"tl\": \"\"}, {\"id\": \"d4\", \"title\": \"落とし物の写し\", \"role\": \"書き換えで負けた本物の報告書は、落とし物窓口の棚にあった\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"d3\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"pl6\", \"i8\", \"i9\"], \"pageData\": [], \"text\": \"沖田は、隣の小部屋へ行った。落とし物窓口の、保管棚の前に立つ。\\n「書き換えで負けた文書は、どこへ行くと思う？」\\n\\n鷺沼が答える前に、沖田は落とし物台帳をめくっていた。十一月十六日の行。その朝も、沖田はいつものように九時に箱を開けていた。\\n\\n品名：書類一枚（事故報告書の写し）\\n拾得場所：書庫\\n落とし主：不明\\n\\nその日の沖田は、何も思わずにそう書いた。報告書の写しが落ちてくるのは珍しかったが、落とし主を探さないのが、この窓口のきまりだ。\\n\\n保管棚の奥から、その一枚を取りだす。\\n事故報告書81K1-097。2023年11月16日。死亡者、佐伯健吾。\\n作成者の欄には、沖田礼子の署名があった。\\n\\n「これが、本物の三年前ね」\\n自分の署名を見ても、沖田にはそれを書いた記憶がなかった。十一月十六日の朝に、記憶ごと書き換えられたからだ。けれど、手帳と、この紙は覚えていた。\\n\\n鷺沼は、報告書の端を指でそっと押さえた。\\n「書き換えで負けた文書が、ここに落ちてくる。だとしたら、三年前の本当の事故は、今もこの棚の上にあるということです」\\n「誰にも覚えられずにね」と沖田は言った。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"30\", \"tt\": \"22:30\", \"tl\": \"\"}, {\"id\": \"d5\", \"title\": \"鍵の貸し出し\", \"role\": \"小池は佐伯健吾の弟だった\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"d4\", \"d2\"], \"plants\": [\"j4\"], \"pays\": [\"j3\"], \"chars\": \"鷺沼、沖田\", \"note\": \"\", \"cards\": [\"p8\", \"p3\", \"p7\", \"pl3\"], \"pageData\": [], \"text\": \"次の朝、鷺沼は人事記録を一件だけ取り寄せた。\\n\\n小池　研究員。記録管理課。2024年着任。\\n家族の欄。母：小池澄江。父：佐伯康夫（離婚）。兄：佐伯健吾（故人）。\\n\\n「母方の姓を名乗っているのね」と沖田は言った。\\n沖田の手帳には、十一月十五日の夜の一行が残っていた。小池くんに書庫の鍵を貸す。照合プログラムの設定のため。\\n\\n照合プログラムの実行記録も、鷺沼は確かめた。十一月十六日の照合の日付を指定したのは、小池だった。三年前の事故と、同じ日付。\\n\\n「あの子、二年前に自分から記録管理課を希望して来たの」と沖田は言った。「整合官の文書を、誰よりも熱心に読んでいた。勉強家だと思っていたわ」\\n\\n鷺沼は、人事記録の兄の欄を見ていた。故人。その二文字は、三輪の改訂のおかげで戻ってきたものだ。偽の歴史のままなら、そこには「退職」と書かれていたはずだった。\\n\\n「小池さんは、今どこにいますか」\\n沖田は、壁の時計を見た。\\n「今夜も書庫の鍵を借りたいって言ってきたわ。断らなかった」\\n「どうしてですか」\\n「見ておきたかったの」と沖田は言った。「あの子が、何をするのか」\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"1\", \"tt\": \"09:00\", \"tl\": \"\"}, {\"id\": \"d6\", \"title\": \"小池の理由\", \"role\": \"兄を生き返らせるために、宇佐見を人柱にしようとした\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"d5\"], \"plants\": [], \"pays\": [\"j4\"], \"chars\": \"小池、沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p7\", \"p3\", \"p8\", \"p2\", \"pl3\", \"e1\"], \"pageData\": [], \"text\": \"夜十時。書庫の明かりは、小池ひとりのためについていた。\\n\\n小池は、一枚の申請書を書き終えたところだった。題は「改訂報告の取り消し申請」。\\n沖田と鷺沼が入ってきても、小池は驚かなかった。\\n\\n「三輪さんの改訂報告には、作成者がいないんです」と小池は言った。「欠番ですから。作成者のいない文書は、何も主張しない。作成者のいる取り消し申請を出せば、整合官はこっちを取ります。日の出までに、十一月十六日の状態に戻る」\\n「宇佐見さんが三年前に死んで、お兄さんが生きている世界に」と鷺沼が言った。\\n「兄は二十九でした」と小池は言った。\\n\\n声は静かだった。\\n「あの夜、扉が凍って、二人が閉じこめられた。助かったのは宇佐見さんだけでした。それからずっと考えていたんです。どうして、兄じゃなかったのか」\\n小池は、申請書の端をそろえた。\\n「財団に入って、整合官の記録を読んで、気づきました。一度に一段なら、何段でも積める。三年分の歴史だって、一日で作れる」\\n\\n「三輪さんの名前を使ったのはなぜ」と沖田は聞いた。\\n小池は、初めて目をそらした。\\n「新人の書き間違いなら、誰も疑わないと思ったからです。……それに、三輪さんは、あまり人の記憶に残らない人だったから」\\n少しのあいだ、小池は黙っていた。\\n「消えるなんて、思わなかった。自分で署名するなんて、思わなかったんです」\\n\\n申請書は、もう送信されていた。日の出まで、あと七時間だった。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"1\", \"tt\": \"22:00\", \"tl\": \"\"}, {\"id\": \"d7\", \"title\": \"落とし主は作成者\", \"role\": \"本物の報告書を、作成者である沖田に返す\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"d6\", \"d4\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p7\", \"i8\", \"i9\", \"w3\"], \"pageData\": [], \"text\": \"「止める方法はあります」と鷺沼は言った。「作成者のいない改訂報告より強い文書を、日の出までに記録に戻せばいい」\\n「より古くて、作成者がいて、クリアランスの高い文書ね」\\n沖田は、手に持っていた一枚を机に置いた。\\n事故報告書81K1-097。本物の、三年前の報告書。\\n\\n「でも、それは落とし物です」と小池が言った。「窓口のきまりでは、落とし主を探してはいけない。返そうとすると、もっと遠くへ運ばれる」\\n「探す必要はないわ」と沖田は言った。「落とし主は、最初から分かっているもの」\\n\\n沖田は落とし物台帳を開いた。十一月十六日の行。「落とし主：不明」の上に二本の線を引き、その横に書いた。\\n\\n落とし主：沖田礼子（作成者）\\n備考：落とし主へ返却し、書庫の正しい場所へ戻す\\n\\n三輪の名前を書いたときと同じだった。落とし主の欄に、名簿と食い違うことは何も書かない。書くのは、この紙を書いたのが誰かということだけだ。\\n\\n「拾得者の欄が要るわ」\\n鷺沼が、黙ってペンを受け取った。拾得者の欄に、自分の名前を書く。\\n\\nそれから沖田は、ペンを小池のほうへ差し出した。\\n「立会人の欄も、空いているの」\\n小池はペンを見つめた。長いあいだ、動かなかった。それから、震える手で受け取って、立会人の欄に名前を書いた。\\n\\n小池、と書いたあとで、小池はもう一つ書き足した。\\n（佐伯健吾の弟）\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"1\", \"tt\": \"23:30\", \"tl\": \"\"}, {\"id\": \"d8\", \"title\": \"一日だけの三年\", \"role\": \"本当の三年前が戻る。欠番は戻らないが、選択は記録に残る\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"d7\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、宇佐見、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"p7\", \"i2\", \"i3\", \"pl2\", \"pl4\", \"e5\"], \"pageData\": [], \"text\": \"十二月二日、七時五十分。沖田は台帳を開いた。\\n\\n昨夜の行の下に、几帳面な字が二行、増えていた。\\n〈整合：矛盾なし〉\\n〈返却を認める〉\\n\\n保管棚から、報告書の写しは消えていた。書庫の棚の、2023年の場所に、81K1-097が戻っていた。番号114の場所には、紙が一枚も入っていない。索引にはこう書いてあった。「該当文書なし」。\\n小池の取り消し申請は、受付番号ごと消えていた。\\n\\n中庭の慰霊碑には、佐伯健吾の名前が刻まれていた。三年前に刻まれた、少し風化した字だった。\\n\\n八時二分。沖田は記録管理室に入った。北の壁沿いの机は空いていた。少なくとも、沖田の目にはそう見えた。\\n名簿を開く。0411の行には、まだ「欠番」とあった。誤記がなかったと分かっても、欠番は戻らなかった。\\nけれど、その横に、昨日まではなかった小さな注記が増えていた。\\n\\n〈誤記の事実なし。ただし、作成者の署名は本人の選択として記録に残す〉\\n\\n「最初から、なかったのね」と沖田は言った。「あなたが引き受けた矛盾は。それでも、あなたは引き受けた」\\n\\n八時半。廊下から靴音が来た。宇佐見が缶コーヒーを二本持って入ってきて、一本を北の壁沿いの机に置いた。何のための癖なのか、宇佐見はもう覚えていない。それでも置いて、もう一本を開けながら出ていった。\\n\\n昼すぎ、沖田は保安部門の面会室で小池に会った。処分が決まるまで、小池はそこにいることになっていた。\\n「お兄さんの名前は、碑に彫ってあるわ」と沖田は言った。「三年前から、ずっと」\\n小池は、うつむいたまま小さくうなずいた。\\n\\n夕方、記録管理室に戻ると、北の壁沿いの机の缶は空になっていた。\\n沖田は手帳を開いて、その日の最後の行を書いた。\\n\\n17:40　窓際の缶、空。誰かが見ている。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"2\", \"tt\": \"07:50\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"j1\", \"name\": \"報告書の番号114\"}, {\"id\": \"j2\", \"name\": \"照合の日付は命日\"}, {\"id\": \"j3\", \"name\": \"書庫の鍵を貸した一行\"}, {\"id\": \"j4\", \"name\": \"母方の姓\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stE\", \"links\": [{\"id\": \"le1\", \"a\": \"p1\", \"b\": \"p2\", \"label\": \"もう一度だけ頼む\", \"st\": \"stE\"}, {\"id\": \"le2\", \"a\": \"p3\", \"b\": \"p1\", \"label\": \"リストを受け継ぐ\", \"st\": \"stE\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"読む人\", \"ending\": \"読み返す人がいなくなって書類が嘘に変わりはじめるが、三輪の残した読み返しリストを九人で読み継ぎ、最後は宇佐見が「北の壁は壁である」と読んで、窓の向こうの三輪とサイトを守る。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"e8\"}, \"scenes\": [{\"id\": \"e1\", \"title\": \"流れていく言葉\", \"role\": \"窓の外を、文書からはがれた言葉が流れはじめる。三輪は印をつける仕事を見つける\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"q1\", \"q2\"], \"pays\": [], \"chars\": \"三輪、葉山\", \"note\": \"\", \"cards\": [\"p1\", \"p4\", \"pl2\", \"w7\"], \"pageData\": [], \"text\": \"窓の外を流れるものが、増えていた。\\n\\n三輪栞は、窓際の机からそれを見ていた。整合官補になってから、三輪の仕事はここに座って、記録からこぼれていくものを見ていることだった。\\nはじめのうち、流れていくのは物だった。名札、手紙、傘。誰にも覚えられなかった人の持ち物。\\n\\n十二月に入ってから、そこに文字が混じりはじめた。\\n「二名で」。「十一時」。「壁」。\\n一語ずつ、文書からはがれた言葉が、白い光の中をゆっくり流れていく。はがれたあとの文書に何が書かれるのか、三輪には分かっていた。少しだけ違う、別の言葉だ。\\n\\n――財団の書類は、誰かが読み返さなければ少しずつ嘘になっていく。\\n\\n着任した日に、課長の沖田からそう教わった。だから三輪は、毎朝決まった書類を読み返してきた。収容プロトコル、名簿、点検表。二百件ほどの書類を、日を分けて順番に。\\n読み返していた人間は、三輪だけだった。そして三輪は今、どの記録にもいない。記録にいない人間が読んでも、書類はつなぎとめられない。\\n\\n机の上に、いつの間にか一枚のメモが置いてあった。几帳面な、見覚えのある字。整合官の字だった。\\n\\n〈補の仕事：見ること。印をつけること〉\\n\\n三輪はペンを取った。窓の外を流れていく「二名で」という言葉を目で追いながら、三輪は、自分にまだできることを一つだけ見つけた。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"8\", \"tt\": \"06:00\", \"tl\": \"\"}, {\"id\": \"e2\", \"title\": \"小さな嘘\", \"role\": \"手帳と書類が合わない。ずれた書類の隅に「要閲覧」の印\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"e1\"], \"plants\": [\"q3\"], \"pays\": [], \"chars\": \"沖田\", \"note\": \"\", \"cards\": [\"p3\", \"i6\", \"w7\"], \"pageData\": [], \"text\": \"沖田礼子の手帳と、財団の書類が、合わなくなってきた。\\n\\n十二月九日の朝。沖田は、食堂の営業時間の掲示が「十一時から」になっているのに気づいた。手帳には、先月まで十時半と書いてある。食堂の職員に聞くと、ずっと十一時からですよ、と言われた。\\n\\n名簿の誕生日が一人分、三日ずれていた。点検表の巡回の順番が、一か所だけ入れ替わっていた。どれも小さなことだった。そして、どれも、書類のほうが正しいことになっていた。現実が書類に合わせて変わっているのだ。\\n\\n沖田は手帳と書類を突き合わせて、ずれを一つずつ書き出した。\\n九時までに、十一件見つかった。\\n\\n十一件の書類には、共通点があった。右上の隅に、小さな印が付いている。鉛筆で書いた、三文字。\\n\\n〈要閲覧〉\\n\\n整合官の几帳面な字に似ていた。けれど、よく見ると少し違う。線が少し丸い。急いで書いたように、最後のはらいが短い。\\n\\n沖田は、その字をしばらく見つめていた。誰の字なのか、思い出せそうで思い出せなかった。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"9\", \"tt\": \"09:00\", \"tl\": \"\"}, {\"id\": \"e3\", \"title\": \"読み返しリスト\", \"role\": \"北の壁沿いの机の引き出しに、三輪が一年半読み返してきた記録があった\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"e2\"], \"plants\": [], \"pays\": [\"q1\", \"q3\"], \"chars\": \"沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"i10\", \"pl2\"], \"pageData\": [], \"text\": \"「ミームではありません」と、鷺沼博士は言った。\\n\\n印の付いた書類を、鷺沼は一枚ずつ対抗ミームの検査にかけた。反応はなかった。ただの鉛筆の字だった。\\n「誰かが、ずれ始めた書類に印をつけているんです。警告のように」\\n\\n沖田は、記録管理室の北の壁沿いの机の前に立った。いつも空いている机だ。宇佐見が毎朝、缶コーヒーを置いていく机。\\n引き出しを開ける。中に、青い表紙のバインダーが一冊入っていた。\\n\\n表紙には、丸みのある字でこう書いてあった。\\n読み返しリスト。\\n\\n中には、二百十二件の書類の名前が並んでいた。収容プロトコル、名簿、点検表、給与記録。その横に、読み返した日付がびっしりと書きこまれている。毎日、八件から十件ずつ。三年分ではない。去年の春から、一日も欠かさずに。\\n\\n日付は、十一月十六日で止まっていた。\\n\\n「この字」と鷺沼が言った。「印の字と同じです」\\n沖田は、バインダーの最初のページを開いた。研修のときに沖田が話した一文が、そのまま書き写してあった。\\n\\n財団の書類は、誰かが読み返さなければ少しずつ嘘になっていく。\\n\\n沖田は、その字を指でなぞった。思い出せない。けれど、この机の誰かは、沖田の言葉を一年半、毎朝守っていたのだ。\\n「十一月十七日から、誰もこのリストを読んでいないのね」\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"9\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"e4\", \"title\": \"二名で\", \"role\": \"佐伯が死んだ場所の手順が「一名で」に変わる。覚えていないはずの宇佐見が止める\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"e3\"], \"plants\": [], \"pays\": [\"q2\"], \"chars\": \"沖田、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"pl5\", \"e1\", \"p5\"], \"pageData\": [], \"text\": \"十二月十日、朝。印の付いた書類は、二十件に増えていた。\\n\\nその中に、低温収容棟の収容プロトコルがあった。三年前に、佐伯健吾が死んだ場所だ。\\n沖田は、該当の行を読んだ。\\n\\n扉の解凍作業は、一名で行うことができる。\\n\\n手帳を開く。三年前の事故のあと、この行は「必ず二名で行う」に改訂されている。二人なら、片方が閉じこめられても、もう片方が外から開けられるからだ。\\n\\n沖田は、保安部門に内線をかけた。応えたのは宇佐見だった。\\n「低温収容棟の扉、今朝の解凍は誰がやった？」\\n「若いのが一人で行きましたよ。手順書にそう書いてあるって」\\n宇佐見は、少し黙ってから言った。\\n「……なんか、嫌な感じがしたんです。一人で入っちゃいけない気がして。だから、俺も後から行きました。何でそう思ったのかは、分からないんですけど」\\n\\n沖田は受話器を握りしめた。宇佐見は、あの夜のことを覚えていない。佐伯のことも、記憶処理の向こうにある。それでも、体のどこかが覚えていた。\\n\\n「宇佐見さん、今日から、あの扉は必ず二人で」\\n「了解です」\\n\\n沖田は課長権限で、プロトコルの至急改訂を出した。それから、印の付いた残り十九件の書類を机に並べた。\\n一件ずつ直していては、間に合わない。ずれていく速さのほうが早い。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"10\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"e5\", \"title\": \"読み合わせ\", \"role\": \"九人で二百十二件を声に出して読む。流れていく言葉が減る\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"e4\"], \"plants\": [\"q4\"], \"pays\": [], \"chars\": \"沖田、鷺沼、宇佐見、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p2\", \"p1\", \"i10\", \"i11\", \"o2\", \"o3\", \"o4\"], \"pageData\": [], \"text\": \"その日の夕方、記録管理室に九人が集まった。\\n\\n記録管理課の全員。鷺沼博士。保安部門から宇佐見と、その同僚が二人。\\n沖田は、青いバインダーを机の真ん中に置いた。\\n\\n「今日から、読み合わせをもう一度始めます」と沖田は言った。「記録取扱規程の第一条には、職員が分担して記録を読み合わせる、と書いてある。四十年以上前からの決まりよ。でも、いつのまにか形だけになって、本当に毎日読んでいたのは、その時代の一人だけだった」「このリストの書類を、毎日分けて読む。声に出して。読んだら、閲覧記録に名前と時刻を書く。記録に残る人間が読めば、書類はそこで止まる」\\n「読むだけで、ですか」と若い職員が聞いた。\\n「読むだけで。この机の誰かは、一年半それを一人でやっていたの」\\n\\n九人で、二百十二件。一人あたり二十数件。夜までかかった。\\n読み上げる声が、窓のない部屋に重なった。名簿の名前、点検の順番、プロトコルの一行一行。間違いに気づいた人は、手を挙げて沖田に伝えた。沖田がそれを手帳に書き、至急改訂の束に重ねた。\\n\\n宇佐見は、なぜか北の壁沿いの机で読んでいた。いつも缶を置く机だ。\\n\\n窓の外で、三輪はそれを見ていた。\\n流れていく言葉が、目に見えて減っていく。「二名で」は流れてこなかった。九人分の声が、書類を一枚ずつ、こちら側につなぎとめていた。\\n\\n三輪は、窓際の机に頬杖をついた。\\n一人でやっていたときより、ずっとにぎやかだった。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"10\", \"tt\": \"18:00\", \"tl\": \"\"}, {\"id\": \"e6\", \"title\": \"北の壁は\", \"role\": \"リストにない書類から「壁」がはがれる。日の出に対抗ミームが逆向きになる\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"e5\"], \"plants\": [], \"pays\": [], \"chars\": \"三輪\", \"note\": \"\", \"cards\": [\"p1\", \"w5\", \"pl3\"], \"pageData\": [], \"text\": \"十二月十二日、夜十一時。窓の外を、一つの言葉が流れていった。\\n\\n「壁」。\\n\\n三輪は立ち上がった。その言葉がどの書類からはがれたのか、三輪にはすぐ分かった。SCP-ZZZZ-JPの特別収容プロトコル。窓際の机にまつわる、ミーム汚染の収容手順だ。\\n\\n〈対抗ミーム「北の壁は壁である」を提示する〉\\n\\nその一行から「壁」がはがれた。残った空きに、別の言葉が入りかけている。\\n窓。\\n\\n北の壁は、窓である。\\nその一行が書類として確定すれば、次の日の出に整合官が現実を書類に合わせる。対抗ミームは逆向きになる。サイトじゅうの人間に、北の壁の窓が見えるようになる。段階一から、段階三へ。そして、その先へ。\\n\\nあの書類は、三輪のリストに入っていなかった。三輪が欠番になったあとに作られた書類だからだ。しかも閲覧制限がかかっていて、読める職員は数人しかいない。今夜、誰かが開く予定はなかった。\\n\\n三輪は、印をつけた。〈要閲覧〉。\\nけれど、書庫の奥の赤いファイルの隅に書かれた三文字に、夜明けまでに気づく人はいない。\\n\\n日の出まで、あと七時間半。\\n三輪は、窓際の机で、廊下の足音を待った。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"12\", \"tt\": \"23:00\", \"tl\": \"\"}, {\"id\": \"e7\", \"title\": \"本当のほうを\", \"role\": \"宇佐見がもう一度だけ窓を見る。それでも「壁である」と読む\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"e6\"], \"plants\": [], \"pays\": [\"q4\"], \"chars\": \"宇佐見、三輪\", \"note\": \"\", \"cards\": [\"p2\", \"p1\", \"pl3\", \"pl2\", \"i11\"], \"pageData\": [], \"text\": \"十二月十三日、午前四時半。夜勤の巡回で、宇佐見恭平は地下二階の廊下を歩いていた。\\n\\n記録管理室の扉の下から、光がもれていた。\\n朝の光のような、白い光。地下二階に、光がもれるはずはない。\\n\\n宇佐見は扉を開けた。北の壁に、窓があった。ぼんやりと、にじむように。\\n窓際の机に、誰かが座っていた。\\n\\n「宇佐見さん」\\n知らない人だった。知らないはずの人だった。けれど、名前を呼ばれたとたん、胸のどこかが痛んだ。\\n「書庫のいちばん奥、赤いファイルを読んでください。声に出して。宇佐見さんの鍵なら、開けられます」\\n\\nなぜ従ったのか、宇佐見にも分からなかった。保安部門の鍵で書庫を開け、赤いファイルを取りだす。SCP-ZZZZ-JP、特別収容プロトコル。右上の隅に、丸い字で〈要閲覧〉とあった。\\n\\nその一行は、こう読めた。\\n対抗ミーム「北の壁は窓である」を提示する。\\n\\n宇佐見は顔を上げた。開いた書庫の扉の向こう、記録管理室の北の壁に、窓が見える。そこに座っている誰かが見える。\\nこの一行のとおりに読めば、たぶん、この窓は明日も消えない。\\n\\n窓際の誰かが、首を横に振った。\\n「本当のほうを、読んでください」\\n\\n宇佐見は、息を吸った。\\n「対抗ミーム。北の壁は、壁である」\\n声に出して読み、ペンで「窓」に線を引いて、横に「壁」と書いた。閲覧記録に、自分の名前と時刻を書いた。04:52。\\n\\n顔を上げると、窓は薄れていくところだった。\\n窓際の誰かが、笑っていた。\\n「コーヒー、冷めないうちに」と、その人は言った。\\n何のことか分からないまま、宇佐見はうなずいていた。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"13\", \"tt\": \"04:30\", \"tl\": \"\"}, {\"id\": \"e8\", \"title\": \"読む人\", \"role\": \"リストは「作成者：欠番」で当番表になる。窓際にメモが残る\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"e7\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p2\", \"i10\", \"i11\", \"i3\", \"e5\"], \"pageData\": [], \"text\": \"十二月十三日、七時五十分。沖田は閲覧記録を開いた。\\n\\n最後の行は、見慣れた大きな字だった。\\n04:52　SCP-ZZZZ-JP特別収容プロトコル　閲覧・訂正（「窓」→「壁」）　宇佐見恭平\\n\\n鷺沼博士が、すぐに対抗ミームの検査をした。プロトコルは正しかった。日の出は、何も変えずに過ぎていた。\\n「閲覧制限の書類も、リストに入れます」と鷺沼は言った。「読む人を、私の部門から二人出します」\\n\\nその日、沖田は青いバインダーの表紙を作り直した。\\n読み返しリスト。作成者の欄には、少し迷ってから、こう書いた。\\n作成者：欠番。\\nその下に、当番表を貼った。記録管理課、対抗ミーム部門、保安部門。毎日、誰かが読む。\\n\\n八時半。廊下から靴音が来た。宇佐見が缶コーヒーを二本持って入ってきて、一本を北の壁沿いの机に置いた。\\n「課長」と宇佐見は言った。「夜中に、何か読んだ気がするんです。誰かに頼まれて。誰だったかは、覚えてないんですけど」\\n「閲覧記録に、あなたの字があったわ」\\n「そうですか」\\n宇佐見は少し首をかしげて、それから笑った。\\n「なら、読んだんでしょうね」\\n\\n夕方、北の壁沿いの机の缶は空になっていた。その横に、今朝はなかった一枚のメモがあった。丸みのある、鉛筆の字だった。\\n\\n〈読んでくれて、ありがとうございました〉\\n\\n沖田はそのメモを、閲覧記録の最後のページにはさんだ。\\n財団の書類は、誰かが読み返さなければ少しずつ嘘になっていく。\\nだから、この部屋では今日も、誰かが読んでいる。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"13\", \"tt\": \"07:50\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"q1\", \"name\": \"書類は読み返さなければ嘘になる\"}, {\"id\": \"q2\", \"name\": \"流れていく「二名で」\"}, {\"id\": \"q3\", \"name\": \"丸い字の「要閲覧」\"}, {\"id\": \"q4\", \"name\": \"北の壁沿いの机で読む宇佐見\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stF\", \"links\": [{\"id\": \"lf1\", \"a\": \"p2\", \"b\": \"p7\", \"label\": \"二人目に選ぶ\", \"st\": \"stF\"}, {\"id\": \"lf2\", \"a\": \"p5\", \"b\": \"p2\", \"label\": \"上着をかけ、朝まで黙った\", \"st\": \"stF\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"霜の部屋\", \"ending\": \"宇佐見と小池は、消される直前の霜の壁から、佐伯が朝まで黙っていたことを知る。部屋は書き換えられない「原本室」として残され、最初に三輪の名前が刻まれるが、壁にはまだ誰にも読めない言葉が残っている。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"f8\"}, \"scenes\": [{\"id\": \"f1\", \"title\": \"収容記録：SCP-WWWW-JP\", \"role\": \"低温収容棟の第3収容室は、話した言葉を霜に残す部屋だった\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"r1\", \"r2\"], \"pays\": [], \"chars\": \"宇佐見\", \"note\": \"\", \"cards\": [\"pl5\", \"w8\", \"o1\"], \"pageData\": [], \"text\": \"アイテム番号：SCP-WWWW-JP\\nオブジェクトクラス：Euclid\\n\\n特別収容プロトコル：SCP-WWWW-JPは、サイト-81K1地下二階・低温収容棟の第3収容室そのものです。室温は常に零下35度以下に保ってください。\\n入室は必ず二名で行います。室内での発話は、作業に必要な最小限にとどめてください。扉の縁に付いた霜を取り除く解凍作業を、週に一度行います。\\n室内の壁面に残る霜の文字を、閲覧の目的で読むことは禁止されています。読むために長く室内にとどまること自体が危険だからです。\\n\\n説明：SCP-WWWW-JPの室内で、零下30度を下回る環境で話された言葉は、壁面に霜の文字として残ります。文字は話された言葉と一字一句同じで、室温が保たれるかぎり溶けることも、変わることもありません。\\nこの霜は財団の文書ではないため、SCP-XXXX-JPによる書き換えを受けないと考えられています。\\n\\n室内で言葉が話されるほど、室温は下がります。零下60度に達すると、扉の縁の霜が凍りつき、内側から開けられなくなります。沈黙が続くと、室温はゆっくり元に戻ります。\\nSCP-WWWW-JPが、なぜ言葉を残すのかは分かっていません。\\n\\n室内の霜のうち最も古いものは、低温収容棟が建てられるより前のものと推定されています。奥の壁の一部は、閲覧にレベル4クリアランスが必要です。[編集済]\\n\\n補遺WWWW-JP-1：2023年11月16日、解凍作業中の警備員二名が室内に閉じこめられました。救助は翌朝。一名死亡、一名重度の凍傷。救助の際、扉付近の霜の一部が削り取られました。\\n\\n補遺WWWW-JP-2：低温設備の更新にともない、2026年12月24日に第3収容室を加温し、壁面の霜を除去したうえで、標準の収容室へ移行する予定です。\", \"ty\": \"\", \"tm\": \"\", \"td\": \"\", \"tt\": \"\", \"tl\": \"作中資料\"}, {\"id\": \"f2\", \"title\": \"二人目\", \"role\": \"宇佐見は三年間、壁の文字を見ないようにしてきた。加温まであと六日\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"f1\"], \"plants\": [], \"pays\": [], \"chars\": \"宇佐見\", \"note\": \"\", \"cards\": [\"p2\", \"pl5\", \"p5\"], \"pageData\": [], \"text\": \"二名で、という決まりが戻ってから、扉の解凍作業の二人目はいつも宇佐見恭平だった。\\n\\n十二月十八日。第3収容室の扉を開けると、息が白く凍って、そのまま床に落ちていくような寒さだった。若い同僚が扉の縁の霜を削り、宇佐見はその背中を見張る。\\n室内では、しゃべらない。それが決まりだった。\\n\\n宇佐見は、壁を見ないようにしていた。\\n壁一面に、霜の文字がびっしりと残っている。三年前のあの夜に、この部屋で話された言葉だ。宇佐見は、あの夜のほとんどを覚えていない。扉が凍りついたこと。佐伯がそばにいたこと。気がついたら医療棟のベッドで、両手が包帯に巻かれていたこと。\\n覚えているのは、それだけだった。\\n\\n壁の文字を読めば、あの夜のことが分かる。分かってしまう。だから、三年間、見ないようにしてきた。\\n\\n作業を終えて廊下に出ると、掲示板に新しい通知が貼られていた。\\n第3収容室、加温予定。十二月二十四日。壁面の霜は除去。\\n\\n宇佐見は、通知の前でしばらく立っていた。\\nあと六日で、壁の文字は全部、水になって流れていく。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"18\", \"tt\": \"09:00\", \"tl\": \"\"}, {\"id\": \"f3\", \"title\": \"書き換えられない壁\", \"role\": \"霜は文書ではない。三年前の夜を本当のまま知っているのは壁だけ\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"f2\"], \"plants\": [], \"pays\": [\"r1\"], \"chars\": \"宇佐見、沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p2\", \"p3\", \"p8\", \"w8\", \"w6\"], \"pageData\": [], \"text\": \"「あの霜は、文書じゃないのよ」と沖田礼子は言った。\\n課長室に、鷺沼博士もいた。\\n\\n「財団の文書じゃないから、整合官にも書き換えられない。誰にも読まれなくても、嘘に変わらない」\\n「十一月十六日に、三年前の記録がまるごと書き換えられたときも」と鷺沼が続けた。「あの部屋の霜だけは、本当のことを書いたまま残っていたはずです」\\n「つまり、あの夜のことを本当のまま知っているのは、あの壁だけってことですか」と宇佐見は聞いた。\\n「ええ。そして、それは十二月二十四日に消える」\\n\\n宇佐見は、膝の上で手をにぎった。凍傷の跡が、まだ指に残っている。\\n「読ませてください。加温の前に、一度だけ」\\n\\n鷺沼は、霜の量から時間を見積もった。全部読むには、二十分ほどかかる。黙ってさえいれば、室温は持つ。\\n「規則では、閲覧は禁止です。でも、記録を移すための作業としてなら、許可を取れるかもしれません。入室は二名。もう一人、誰と行きますか」\\n\\n宇佐見は、少し考えてから言った。\\n「小池を」\\n沖田と鷺沼が顔を見合わせた。\\n「あいつの兄貴の、最後の言葉なんです。家族が読まなくて、誰が読むんですか」\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"19\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"f4\", \"title\": \"二人一組\", \"role\": \"自分を消そうとした小池を、宇佐見は二人目に選ぶ\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"f3\"], \"plants\": [\"r3\"], \"pays\": [], \"chars\": \"宇佐見、小池\", \"note\": \"\", \"cards\": [\"p2\", \"p7\", \"o3\"], \"pageData\": [], \"text\": \"保安部門の面会室で、小池は宇佐見の顔を見ると、立ち上がりかけてまた座った。\\n\\n小池は、宇佐見を三年前に死んだことにしようとした男だ。宇佐見は、それを沖田から聞いて知っている。\\n「処分が決まるまで、ここにいるんだってな」\\n「……はい」\\n\\n宇佐見は、向かいの椅子に腰を下ろした。\\n「第3収容室の霜、知ってるか」\\n小池はうなずいた。\\n「兄の、最後の夜の言葉が残ってるって。でも閲覧禁止だから、読んだことはありません」\\n「二十四日に、全部溶かされる。その前に、読みに行く。一緒に来い」\\n\\n小池は、信じられないという顔をした。\\n「どうして、僕を」\\n「入室は二人一組なんだよ」と宇佐見は言った。「それに、あいつの家族はおまえだろ」\\n\\n小池の手が、机の上で震えていた。\\n「僕は、宇佐見さんを」\\n「知ってる」と宇佐見はさえぎった。「それはそれで、あとでちゃんと怒る。でも今は、佐伯の話だ」\\n\\nしばらくして、小池は小さな声で言った。\\n「……行きます」\\n「中では、しゃべるなよ。しゃべると寒くなる」\\n「知ってます」と小池は言った。「兄が、よく言ってたんです。あの部屋の中では、黙ってるのがいちばんの仕事だって」\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"20\", \"tt\": \"15:00\", \"tl\": \"\"}, {\"id\": \"f5\", \"title\": \"霜を読む\", \"role\": \"壁に残る三年前の会話。覚えのない「窓」の一行。しゃべるほど寒くなると佐伯が気づく\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"f4\"], \"plants\": [], \"pays\": [\"r2\"], \"chars\": \"宇佐見、小池\", \"note\": \"\", \"cards\": [\"p2\", \"p7\", \"p5\", \"pl5\", \"e1\"], \"pageData\": [], \"text\": \"十二月二十二日、十時。第3収容室の扉が開いた。\\n\\n宇佐見と小池は、防寒服のまま中に入った。扉の外では、沖田と鷺沼が時計を見ている。\\n壁の霜の文字は、扉の横から始まっていた。宇佐見は、初めてそれをまっすぐに見た。\\n\\n――扉、凍ってますね。\\n――ああ。朝まで待つしかないな。\\n――宇佐見さん、寝ちゃだめですよ。話してましょう。\\n\\n佐伯の声が聞こえるようだった。霜の字は、話した人ごとに少しずつ形が違っていた。宇佐見の言葉は角ばっていて、佐伯の言葉は丸かった。\\n\\n――弟がいるんです。健太っていって。財団に入りたいって言ってて。\\n――やめとけって言えよ。\\n――言ったんですけど、聞かなくて。記録の仕事がしたいんだって。あいつ、本ばっかり読んでるから。\\n\\n小池が、壁の前で息を止めたのが分かった。\\n\\n――母さんがパン焼くの上手で。今度、宇佐見さんにも持ってきますよ。\\n――楽しみにしてる。\\n\\n他愛のない話が、壁を埋めていた。三十分、一時間。二人はずっと話していた。眠らないために。\\n霜の字が、少しずつ大きく、太くなっていく。寒さが増すほど、霜が厚くなるのだ。\\n\\n少し間をあけて、角ばった字が一行だけあった。宇佐見の字だった。\\n\\n――佐伯。あそこ、窓がある。\\n\\n宇佐見は、その行の前で動けなくなった。そんなことを言った覚えはない。\\nすぐ下に、丸い字が続いていた。\\n\\n――窓なんてないですよ、宇佐見さん。ここ、地下ですよ。\\n\\n小池が、宇佐見の袖を引いた。宇佐見は、壁から目を離した。なぜか、その一行をそれ以上見ていてはいけない気がした。\\n\\nそして、もう少し先の行で、佐伯の丸い字が止まった。\\n\\n――宇佐見さん。しゃべるほど、寒くなってませんか。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"22\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"f6\", \"title\": \"白い壁\", \"role\": \"佐伯は朝まで黙っていた。最後の言葉は削られ、奥の壁には古い任命の字\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"f5\"], \"plants\": [], \"pays\": [\"r3\"], \"chars\": \"宇佐見、小池、沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p2\", \"p7\", \"p5\", \"pl5\"], \"pageData\": [], \"text\": \"――宇佐見さん、聞こえますか。寝ちゃいましたか。\\n\\nその先の宇佐見の言葉は、もう壁になかった。宇佐見はそこで、意識を失っていたのだ。\\n佐伯の言葉だけが続いていた。\\n\\n――しゃべるほど寒くなるなら、黙ってればいいんですよね。黙ってれば、朝までに少し戻る。扉も開く。\\n――宇佐見さん、俺の上着、かけときます。\\n――俺、もうしゃべりません。朝まで黙ってます。\\n――最後に一個だけ。\\n――健太に。兄ちゃんは\\n\\nその先は、扉に近いところだった。救助のときに削られた霜は、ところどころしか残っていなかった。\\n「……ちゃんと……」\\n「……寒く……」\\n寒くなかった、と言ったのか。寒かった、と言ったのか。もう分からなかった。\\n\\nそこから先の壁は、白かった。\\n何時間分もの沈黙が、そこに残っていた。佐伯は、本当に朝まで黙っていたのだ。宇佐見に上着をかけて。\\n\\nただ、白い壁のいちばん下、床に近いところに、細い丸い字がひとつだけあった。夜明けの近くに書かれたような、かすれた字だった。\\n\\n――宇佐見さん、あれ\\n\\nそこで終わっていた。何を見て、何を言おうとしたのか。続きは、どこにもなかった。\\n\\n小池の肩が震えはじめた。口が開きかける。声が出る。\\n宇佐見は、とっさに小池の手をつかんだ。\\n声を出せば、部屋が冷える。扉の縁の霜が、ぴしりと音を立てた。\\n\\n宇佐見は、小池の手を強くにぎったまま、首を横に振った。自分の口も、空いているほうの手でふさいだ。\\n三年前、佐伯がそうしたように。\\n\\n小池は、声を出さずに泣いた。涙が頬で凍って、床に落ちた。\\n二人はそのまま、黙って立っていた。白い壁の前で、佐伯の沈黙と並んで。\\n\\n扉の外で、鷺沼が手を挙げた。時間だった。\\n宇佐見は小池の肩を抱いて、扉のほうを向いた。そのとき、部屋の奥の壁が目の端に入った。閲覧制限のかかった、いちばん古い霜だ。\\n\\n厚く積もった霜の下に、几帳面な字が透けていた。どこかで見たことのある字だった。\\n\\n〈一九九六年六月　整合官補に任ず〉\\n\\n名前のところは、霜が厚すぎて読めなかった。\\n宇佐見は、それが何を意味するのか分からないまま、扉の外へ出た。\\n廊下に出たとたん、小池は声をあげて泣いた。宇佐見は、何も言わずにその背中をたたいていた。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"22\", \"tt\": \"10:20\", \"tl\": \"\"}, {\"id\": \"f7\", \"title\": \"原本室\", \"role\": \"加温は中止。書き換えられない場所として部屋を残す\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"f6\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼、宇佐見、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p2\", \"p7\", \"w8\", \"o2\"], \"pageData\": [], \"text\": \"翌日、課長室で、沖田は一枚の提案書を書き上げた。題は「第3収容室の加温中止、および原本室としての利用について」。\\n\\n「財団の文書は、整合官に書き換えられる。誰も読まなければ、嘘に変わる」と沖田は言った。「十一月には、三年分の歴史が一日で偽物にされた。十二月には、収容手順が一語ずつ変わりかけた。どちらも、気づいたのは偶然よ」\\n「でも、あの部屋の霜は変わらない」と鷺沼が続けた。「声に出して読み上げた言葉は、そのまま残る。書き換えも、ずれもない。財団の中で、本当のまま残しておける唯一の場所です」\\n\\n大事な文書の要点を、あの部屋で声に出して読む。霜に残す。もしいつか書類が書き換えられても、霜と突き合わせれば、どこが変わったのか分かる。\\n「話した分だけ寒くなるから、長くは読めない。一回に、一分か二分」\\n「それで十分よ。本当に大事なことは、だいたい短いから」\\n\\n鷺沼は、宇佐見から聞き取った読み上げの記録を、一か所だけ自分の手元に残した。2023年の、角ばった字の一行。「あそこ、窓がある」。\\n窓際の机のミーム汚染が最初に見つかったのは、今年の十一月の落とし物台帳だった。それが本当に最初だったのかどうか、鷺沼には分からなくなっていた。\\n鷺沼はその一行を報告書には書かず、宇佐見にも何も言わなかった。奥の壁の古い霜について上に問い合わせると、返ってきた回答は、ほとんど黒塗りだった。\\n\\n提案書は、その日の夕方に承認された。加温は中止。第3収容室は、温度を保ったまま「原本室」として使われることになった。\\n佐伯の言葉も、白い沈黙も、そのまま壁に残る。\\n\\n宇佐見はその知らせを、保安部門の詰め所で聞いた。\\n小池にも、知らせが行った。小池は処分が決まるまでのあいだ、原本室の記録係の手伝いをしたいと願い出た。読み上げる人の横に立って、黙って時間を計る係だ。\\n「兄の仕事を、近くで見ていたいんです」と、小池は言ったという。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"23\", \"tt\": \"16:00\", \"tl\": \"\"}, {\"id\": \"f8\", \"title\": \"霜に残す名前\", \"role\": \"三輪の名前を霜に残す。その下に、誰も話していないのに一行が伸びる\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"f7\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、宇佐見、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"p7\", \"i8\", \"p1\", \"pl5\", \"i3\", \"pl2\"], \"pageData\": [], \"text\": \"十二月二十四日、八時。原本室の、最初の読み上げの日だった。\\n\\n扉の前に立ったのは、沖田と宇佐見だった。小池が横で時計を持っている。\\n沖田は、手に落とし物台帳を持っていた。\\n\\n「最初に何を残すか、ずっと考えていたの」と沖田は言った。「規則でも手順でもなくて、もっと消えやすいものにしようと思って」\\n\\n二人は中に入った。佐伯の言葉と、その先の白い壁の前に立つ。\\n沖田は台帳を開いた。落とし主の欄。自分の字で書いた名前。\\n沖田には、その名前の人のことが思い出せない。それでも、読むことはできる。\\n\\n「三輪栞」と、沖田は声に出して言った。\\n「記録管理課。読み返しリストの作成者」\\n\\n白い壁の、佐伯の沈黙のすぐ下に、霜が集まった。細い線が伸びて、文字になる。\\n三輪栞。\\n誰にも書き換えられない字で、その名前が壁に残った。\\n\\n宇佐見は、その名前を見上げていた。知らない名前のはずだった。けれど、胸の奥が、缶コーヒーを握ったときのように温かかった。\\n\\n二人は、そのまま黙って立っていた。\\n誰も、何も話していなかった。それなのに、名前のすぐ下で、霜がもう一本、細く伸びはじめた。\\n字になるより先に、小池が扉の外から時計を叩いた。時間だった。\\n\\n二人は外に出た。四十秒。室温は、一度だけ下がっていた。\\n誰かが、何かを言ったのだ。\\n\\n八時半。宇佐見は購買部で缶コーヒーを二本買い、記録管理室の北の壁沿いの机に一本を置いた。\\n沖田は手帳を開いて、その日の最初の行を書いた。\\n\\n08:05　原本室で、三輪さんの名前を読む。霜に残る。\\n\\n夕方、窓際の缶は空になっていた。\", \"ty\": \"2026\", \"tm\": \"12\", \"td\": \"24\", \"tt\": \"08:00\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"r1\", \"name\": \"霜は文書ではない\"}, {\"id\": \"r2\", \"name\": \"話すほど寒くなる\"}, {\"id\": \"r3\", \"name\": \"黙っているのがいちばんの仕事\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stG\", \"links\": [{\"id\": \"lg1\", \"a\": \"p3\", \"b\": \"p9\", \"label\": \"三十年かけて傘を返す\", \"st\": \"stG\"}, {\"id\": \"lg2\", \"a\": \"p9\", \"b\": \"p5\", \"label\": \"言葉を拾う\", \"st\": \"stG\"}, {\"id\": \"lg3\", \"a\": \"p1\", \"b\": \"p3\", \"label\": \"机の上で文通\", \"st\": \"stG\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p9\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"黒い傘\", \"ending\": \"沖田は三十年前に返せなかった黒い傘を、名簿の外にある原本室で同期の鳴瀬に返し、傘を差して窓の外を歩く鳴瀬が拾った佐伯の最後の言葉は、弟の小池のもとへ届く。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"g8\"}, \"scenes\": [{\"id\": \"g1\", \"title\": \"台帳　1996年\", \"role\": \"三十年前の傘の記録。拾得場所は「北の壁沿いの机」だった\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"s1\"], \"pays\": [], \"chars\": \"沖田、真柴\", \"note\": \"\", \"cards\": [\"p3\", \"p6\", \"i7\", \"i8\", \"pl6\"], \"pageData\": [], \"text\": \"落とし物台帳　1996年\\n\\n拾得日：1996年6月13日\\n拾得場所：記録管理室　北の壁沿いの机\\n品名：黒い傘（長傘。持ち手に職員番号81K1-0412のテープ）\\n落とし主：不明\\n拾得者：沖田礼子\\n\\n拾得日：1996年6月14日\\n拾得場所：人事記録の棚の前（返却を試みた場所）\\n品名：同上\\n落とし主：不明\\n備考：荷札が「返却不可」に書き換えられた状態で、箱に戻る。今後、落とし主を探す目的での持ち出しを禁ずる。（真柴）\\n\\n――\\n\\n拾得場所の欄に、二十四歳の沖田は「北の壁沿いの机」と書いていた。\\nそのとき、その机の前に何があったのか。そこに誰が座っていたのか。\\n三十年後の沖田は、自分の字を読み返しても、思い出すことができなかった。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"13\", \"tt\": \"\", \"tl\": \"三十年前\"}, {\"id\": \"g2\", \"title\": \"傘を返してください\", \"role\": \"霜の部屋の「声のない一行」が字になる\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"g1\"], \"plants\": [\"s2\"], \"pays\": [], \"chars\": \"沖田、宇佐見、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"p7\", \"pl5\", \"p1\"], \"pageData\": [], \"text\": \"二〇二七年一月八日。原本室の、年が明けて最初の解凍作業だった。\\n\\n扉の縁の霜を削るのは宇佐見、時間を計るのは小池。沖田はその横で、壁の霜を確かめていた。年末に霜に残した名前が、ちゃんと残っているか。\\n\\n三輪栞。\\n名前は、白い壁にはっきりと残っていた。その下には、あの日、誰も話していないのに伸びはじめた一本の霜がある。\\n\\n二週間のあいだに、霜は落ち着いて、字になっていた。\\n整合官の几帳面な字でも、三輪の丸い字でもない。右へ少し傾いた、急いで書いたような字だった。\\n\\n〈傘を返してください〉\\n\\n沖田は、息を止めた。声を出せば、部屋が冷える。それでも、喉の奥で何かが鳴りそうになった。\\n傘。この三十年で、沖田が返せなかった傘は一本しかない。\\n\\n外に出てから、小池が聞いた。\\n「課長、傘って」\\n「落とし物窓口の棚のいちばん奥に、一本あるの」と沖田は言った。「私が二十四歳のときから」\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"8\", \"tt\": \"09:00\", \"tl\": \"\"}, {\"id\": \"g3\", \"title\": \"最初の手帳\", \"role\": \"沖田の手帳はあの日から始まった。写真の裏に「鳴瀬さんと。雨の日。」\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"g2\"], \"plants\": [\"s3\"], \"pays\": [], \"chars\": \"沖田\", \"note\": \"\", \"cards\": [\"p3\", \"i6\", \"p9\"], \"pageData\": [], \"text\": \"沖田の手帳は、三十年分ある。\\nいちばん古い一冊を、沖田は課長室の棚から抜きだした。一九九六年。表紙の裏に、若い字でこう書いてあった。\\n\\n今日から全部書く。忘れたことに、あとで気づけるように。　6月14日\\n\\nそれより前の手帳は、一冊もない。沖田が何でも書くようになったのは、あの傘が戻ってきた日からだった。\\n\\n手帳の裏表紙のポケットに、写真が一枚はさまっていた。古い紙焼きで、角がすり切れている。\\n記録管理課の集合写真だった。若い真柴課長。二十四歳の沖田。その隣に、黒い長傘を持った女の人が立っていた。外で撮ったのだろう、みんなの肩が少し濡れている。\\n\\n沖田は、その人の顔を見た。見えている。目も、口元も、笑い方も。けれど、写真から目を離したとたん、どんな顔だったか分からなくなった。三輪の印鑑を見たときと同じだった。\\n\\n写真を裏返す。自分の字があった。\\n\\n鳴瀬さんと。雨の日。\\n\\n鳴瀬。\\nその名前を、沖田は手帳に書き写した。書いたそばから、名前は頭の中ですべっていく。それでも、紙の上の字は残る。\\n三十年前、沖田の隣で笑っていた人の名前だった。\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"8\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"g4\", \"title\": \"机の上の往復\", \"role\": \"三輪とのメモのやりとり。鳴瀬は三輪の前の窓際の人だった\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"g3\"], \"plants\": [], \"pays\": [\"s1\"], \"chars\": \"沖田、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p1\", \"p9\", \"pl2\", \"i3\"], \"pageData\": [], \"text\": \"その日の夕方、沖田は北の壁沿いの机に、一枚のメモを置いた。宇佐見が毎朝缶コーヒーを置いていく机だ。\\n\\n〈鳴瀬さんという人を知っていますか〉\\n\\n次の朝、缶は空になっていた。その横に、丸い鉛筆の字のメモがあった。\\n\\n〈知っています。私の前に、この机に座っていた人です。三十年、ここで窓の外を見ていました。私がふつうの職員としてこの机を使っていた一年半も、ずっと隣にいたそうです。私は気づきませんでした。私が欠番になった朝、鳴瀬さんは席を替わってくれました。今は、窓の外を歩いています〉\\n\\n沖田は、そのメモを何度も読んだ。それから、もう一枚書いた。\\n\\n〈窓の外で、何をしているの〉\\n\\n次の朝の返事は、長かった。\\n\\n〈記録からこぼれたものを、拾いに行っています。こぼれたものは、白い光の中を、雨のように降っていくんです。拾えば、また誰かに届けられることがあります。でも、傘がないと、遠くまでは行けません。濡れたものは、少しずつ、自分も流れていってしまうから〉\\n〈鳴瀬さんは、ずっと傘を待っていました。三十年前、あの傘は、窓の外へ行く前に、この机に置いていったものです。いつか誰かが、ちゃんと返してくれるように〉\\n\\n最後に、一行だけ足してあった。\\n〈遠くに、拾いたいものがあるそうです。三年前に、扉の近くで削られた言葉〉\\n\\n沖田は、メモを手帳にはさんだ。\\n佐伯の最後の言葉だ、と思った。\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"10\", \"tt\": \"08:30\", \"tl\": \"\"}, {\"id\": \"g5\", \"title\": \"返す場所\", \"role\": \"名簿の上ではなく、名簿の外に返す。奥の壁の閲覧許可\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"g4\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p2\", \"i7\", \"pl6\", \"p4\", \"w3\"], \"pageData\": [], \"text\": \"「返却不可、と荷札に書いてあります」と鷺沼博士は言った。「一度、窓口に拒まれた物です」\\n\\n落とし物窓口の小部屋で、三人は黒い傘を囲んでいた。沖田、鷺沼、宇佐見。三十年ぶりに、保管棚のいちばん奥から出した傘だった。布は古びていたが、骨は一本も折れていない。\\n\\n「三十年前、私はこれを、名簿の上で0412が並んでいるはずの棚の前に立てかけた」と沖田は言った。「名簿の中に返そうとしたの。でも、欠番の人は名簿の上にはいない。いない場所に返そうとしたから、窓口は受けつけなかった」\\n「では、どこなら」\\n「名簿の外で、鳴瀬さんの言葉が残っている場所」\\n\\n鷺沼は、しばらく考えてから、うなずいた。\\n「原本室の奥の壁ですね。一九九六年六月の任命の霜」\\n\\n奥の壁は、レベル4の閲覧制限がかかっている。鷺沼は申請を出した。理由の欄には、「落とし物の返却のため」とだけ書いた。\\n翌日、許可が下りた。添えられていた通知の大半は、やはり黒塗りだった。黒塗りでない行は、一行だけだった。\\n\\n〈返却を妨げない〉\\n\\nその行の字は、整合官の几帳面な字に、とてもよく似ていた。\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"11\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"g6\", \"title\": \"原本室で傘を開く\", \"role\": \"名前が透け、壁が窓になる。あの夜の「あれ」は傘の人だった\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"g5\"], \"plants\": [], \"pays\": [\"s2\", \"s3\"], \"chars\": \"沖田、宇佐見、小池、鷺沼、鳴瀬\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"p7\", \"p8\", \"p9\", \"i7\", \"pl5\"], \"pageData\": [], \"text\": \"一月十二日、夜。原本室の扉が開いた。\\n\\n入ったのは、沖田と宇佐見。小池が扉の外で時計を持ち、鷺沼がその横に立っている。\\n沖田は、黒い傘を抱えていた。\\n\\n二人は、部屋の奥へ進んだ。佐伯の言葉の前を通り、白い沈黙の前を通り、閲覧制限の壁の前に立つ。\\n厚い霜の下に、几帳面な字が透けていた。\\n\\n〈一九九六年六月　整合官補に任ず〉\\n\\n名前のところは、やはり霜が厚くて読めなかった。\\n沖田は、傘を開いた。古い布が、ぱさりと音を立てて広がった。\\n\\n「鳴瀬さん」\\n声に出すと、部屋が冷えた。\\n「お返しします。三十年、遅くなりました」\\n\\n厚い霜が、内側から少しずつ溶けるように薄くなった。名前のところが、透けて見えた。\\n\\n鳴瀬灯。\\n\\nそのとき、宇佐見が息をのんだ。\\n奥の壁の一部が、窓になっていた。白い光が、雨のように降っている。その中に、誰かが立っていた。右へ少し傾いた立ち方の、女の人だった。\\n\\n沖田の手から、傘の重さが消えた。\\n窓の向こうの人が、黒い傘を差していた。\\n\\n宇佐見の口から、言葉がこぼれた。\\n「……あの夜も、いた」\\n壁に、角ばった霜の字が走った。\\n「窓の向こうに、人が立ってた。傘もなしに、ずぶ濡れで。佐伯も見てた。あれって、言ったんだ」\\n\\n窓の向こうの人は、沖田のほうを見て、少しだけ頭を下げた。三十年前の写真と同じ笑い方だった。今度は、沖田にもそれが分かった。\\nそれから、その人は背を向けて、白い雨の中を、遠くへ歩いていった。\\n\\n扉の外で、小池が時計を叩いた。零下五十八度。\\n二人は外へ出た。窓は、もう壁に戻っていた。\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"12\", \"tt\": \"22:00\", \"tl\": \"\"}, {\"id\": \"g7\", \"title\": \"窓の外から届いたもの\", \"role\": \"削られた佐伯の言葉が、拾われて窓口に届く\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"g6\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、小池、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"p2\", \"p5\", \"pl6\", \"i8\", \"e1\"], \"pageData\": [], \"text\": \"次の朝、九時。沖田は落とし物窓口の箱を開けた。\\n\\n中に、小さな紙が一枚だけ入っていた。紙のように薄い、霜のかけらだった。部屋の温度でも、溶けなかった。\\n荷札が付いていた。\\n\\n拾得場所：窓の外\\n\\n霜のかけらには、丸い字が並んでいた。三年前、救助のときに扉の近くで削られた言葉だった。\\n\\n――健太に。兄ちゃんは最後まで、ちゃんと仕事したって。寒かったけど、怖くはなかったって。宇佐見さんが起きたら、あんまり気にすんなって。\\n\\n沖田は、しばらくそれを見ていた。\\nそれから台帳を開いて、一行ずつ書いた。\\n\\n品名：霜のかけら（言葉）\\n拾得場所：窓の外\\n落とし主：佐伯健吾\\n拾得者：鳴瀬灯\\n備考：落とし主のご家族へ返却\\n\\n昼すぎ、沖田は小池を課長室に呼んで、霜のかけらを渡した。\\n小池は、両手でそれを受け取った。何度も読んで、それから少し笑った。泣きながら笑う顔だった。\\n「寒かったんですね」\\n「ええ」\\n「兄は、嘘がへただったんです。寒くなかったなんて言われたら、たぶん僕は、一生信じられなかった」\\n\\nその日の夕方、宇佐見にも、その言葉が伝えられた。\\n宇佐見は、あんまり気にすんな、のところで、天井を向いて長いあいだ黙っていた。\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"13\", \"tt\": \"09:00\", \"tl\": \"\"}, {\"id\": \"g8\", \"title\": \"雨の日\", \"role\": \"記録しておいたから、返すことができた。謎はまだ少し残る\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"g7\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p1\", \"p9\", \"p4\", \"i2\", \"i3\", \"i8\", \"pl2\", \"i7\"], \"pageData\": [], \"text\": \"一月十五日。地上は雨だと、朝のニュースが言っていた。地下二階には、雨の音は届かない。\\n\\n九時。沖田は窓口の箱を開けた。空っぽだった。\\n沖田は台帳の、三十年前のページを開いた。黒い傘の行。真柴の字で「返却不可」とある。沖田はその横に、自分の字で書き足した。\\n\\n落とし主：鳴瀬灯\\n備考：2027年1月12日、原本室にて返却済\\n\\n最後に、手帳の一行を書き写すように、もう一行。\\n三十年かかった。\\n\\n八時半に置かれた缶は、夕方には空になっていた。その横に、丸い字のメモが残っていた。\\n\\n〈今日は、窓の外が雨でした。遠くを、黒い傘が歩いていくのが見えました。ときどき立ち止まって、何かを拾っています。拾ったものは、窓口に届くそうです。私もいつか、傘を持てるでしょうか〉\\n\\n沖田は、メモの裏に返事を書いた。\\n\\n〈持てるわ。そのときは、私が返す〉\\n\\n書いてから、沖田は少し笑った。三十年前、真柴に教わったことを思い出した。私たちは探さない。記録するの。\\nそれは、間違いではなかった。けれど、記録しておいたから、返すことができた。\\n\\n名簿のいちばん最初のページでは、主任整合官の葉山が、今年の四月にもまた一段、昇進することになっていた。葉山がどこで何を見ているのか、知っている人はいない。\\n0413の行は、今も欠番のままだった。\\n\\n沖田は手帳を閉じた。\\n窓のない部屋の、窓際の机で、缶コーヒーの空き缶が、雨の日の光を受けたように、少しだけ白く光っていた。\", \"ty\": \"2027\", \"tm\": \"1\", \"td\": \"15\", \"tt\": \"09:00\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"s1\", \"name\": \"拾得場所は北の壁沿いの机\"}, {\"id\": \"s2\", \"name\": \"声のない一行（霜の部屋から）\"}, {\"id\": \"s3\", \"name\": \"1996年6月の任命と2023年の「窓」（霜の部屋から）\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stH\", \"links\": [{\"id\": \"lh1\", \"a\": \"p10\", \"b\": \"p1\", \"label\": \"あの夜、間に合わせた\", \"st\": \"stH\"}, {\"id\": \"lh2\", \"a\": \"p3\", \"b\": \"p10\", \"label\": \"手紙を書く\", \"st\": \"stH\"}, {\"id\": \"lh3\", \"a\": \"p7\", \"b\": \"p10\", \"label\": \"見つける\", \"st\": \"stH\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p9\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p10\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"三週間\", \"ending\": \"三週間かかる改訂が一日になったのは、三輪を間に合わせるために名前のない番号0413が夜中の審査を引き受けたからだと小池が突き止め、改訂はふたたび人が読むものに戻るが、0413は人の名前の横で「同意」の判を押しつづける。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"h8\"}, \"scenes\": [{\"id\": \"h1\", \"title\": \"改訂の手引き\", \"role\": \"三週間の手続きと、十一月から一日になった数字\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"t1\"], \"pays\": [], \"chars\": \"小池\", \"note\": \"\", \"cards\": [\"p7\", \"w2\", \"i12\"], \"pageData\": [], \"text\": \"サイト-81K1　文書改訂の手引き（抜粋）\\n\\n改訂申請は、次の六つの段階を経て受理されます。\\n一、起案：誤りを見つけた職員が、改訂案と証拠を添えて申請する。\\n二、証拠照合：記録管理課の職員が、添えられた証拠をすべて読み、元の文書と突き合わせる。\\n三、課長承認：記録管理課長が改訂案を読み、承認する。\\n四、保安確認：保安部門の職員が、改訂が収容と安全に影響しないかを読んで確かめる。\\n五、原本照合：書庫の担当者が、書庫の原本と改訂案を読み比べる。\\n六、受理。\\n\\n各段階の担当者は、読んだ日時と自分の名前を、確認者の欄に記入してください。\\n標準の所要日数は、二十一日です。\\n\\n――\\n\\n〈改訂申請の所要日数　記録管理課調べ〉\\n2026年10月まで：平均21.4日\\n2026年11月17日以降：平均1.0日\\n\\nこの表は、小池研究員が二〇二七年二月一日に作成した。\", \"ty\": \"\", \"tm\": \"\", \"td\": \"\", \"tt\": \"\", \"tl\": \"作中資料\"}, {\"id\": \"h2\", \"title\": \"夜中の判\", \"role\": \"すべての改訂に、欠番0413の判が夜中に押されている\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"h1\"], \"plants\": [\"t2\"], \"pays\": [], \"chars\": \"小池\", \"note\": \"\", \"cards\": [\"p7\", \"i12\", \"i2\", \"p10\"], \"pageData\": [], \"text\": \"処分が決まるまでのあいだ、小池健太に与えられた仕事は、改訂申請台帳の整理だった。\\n原本室での時間計りのほかには、紙をめくる仕事しかない。小池には、それがありがたかった。\\n\\n二月一日。過去の申請を年ごとに並べていて、小池は手を止めた。\\n\\n去年の十月までは、どの申請も三週間前後かかっていた。証拠照合に五日、課長承認に三日、保安確認に一週間、原本照合に五日。人が順番に読んで、判を押していく。そういう速さだった。\\n\\n十一月十七日から、すべてが一日で終わっていた。\\n夕方に出された申請が、次の日の朝には受理されている。十一月の三輪の改訂も、十二月の沖田課長の至急改訂も。小池自身が出したあの取り消し申請も、受付番号ごと消える前の控えを見ると、夜中のうちに三つの段階を通っていた。\\n\\n確認者の欄を見る。課長承認は、沖田の電子印だった。けれど、証拠照合、保安確認、原本照合の三つの欄には、同じ判が押されていた。\\n\\n確認者：81K1-0413\\n\\n押された時刻は、どれも午前二時から五時のあいだだった。\\n\\n小池は、名簿を開いた。0411、三輪栞、欠番。0412、鳴瀬灯、欠番。0413も、欠番だった。\\n名前のない番号が、この三か月、夜中にすべての改訂を読んで、判を押していた。\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"1\", \"tt\": \"15:00\", \"tl\": \"\"}, {\"id\": \"h3\", \"title\": \"番号のない名前\", \"role\": \"葉山には番号がなく、0413には名前がない\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"h2\"], \"plants\": [\"t3\"], \"pays\": [], \"chars\": \"沖田、小池、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"p4\", \"i6\", \"p1\", \"p9\"], \"pageData\": [], \"text\": \"「0412は、鳴瀬さんだったわね」\\n課長室で、沖田は一九九六年の手帳をめくっていた。三十年前の、いちばん古い一冊だ。\\n\\n「0413のことは、書いてないんですか」と小池は聞いた。\\n「書いてないわ。でも、これがある」\\n\\n沖田が開いたのは、手帳をつけはじめて三日目のページだった。\\n\\n6月16日　名簿のいちばん最初のページ。整合官　葉山。この春に補から上がったらしい。番号の欄が空いている。真柴課長に聞くと、「そういうものよ」とだけ。\\n\\n「葉山さんには、番号がないの。三十年前から」と沖田は言った。「そして0413には、名前がない」\\n「番号のない名前と、名前のない番号」\\n小池は、その二つを口の中でくり返した。\\n「同じ人だと思いますか」\\n沖田は、手帳を閉じた。\\n「分からない。分からないことを、分かったことにはしないの」\\n\\nその日の夕方、沖田は北の壁沿いの机に、メモを置いた。\\n〈0413という番号の人を知っていますか〉\\n\\n次の朝、缶の横にあった丸い字の返事は、短かった。\\n\\n〈私は知りません。鳴瀬さんにも聞きました。窓のこちら側の人ではない、とだけ言っていました〉\\n〈でも、あの夜のことを思い出しました。改訂報告を送ったあと、書庫で、誰かが紙をめくる音がしていました。私しかいないはずなのに〉\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"2\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"h4\", \"title\": \"ほどける改訂\", \"role\": \"人が読まないまま受理された改訂が、少しずつほどけている\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"h3\"], \"plants\": [], \"pays\": [\"t1\"], \"chars\": \"沖田、小池、鷺沼\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"p8\", \"w7\", \"pl5\"], \"pageData\": [], \"text\": \"「速いことが、問題なんです」と鷺沼博士は言った。\\n\\n課長室に、沖田と小池、鷺沼がいた。机の上には、十一月十七日以降の改訂申請が、全部並べてあった。\\n\\n「三週間かかっていたのは、手続きが遅いからではありませんでした。五人が順番に読むからです。読まれた書類は、そこで止まる。三週間の改訂は、五人分の『読む』を通ってから受理されていた」\\n「0413の判は、人の『読む』じゃない」と沖田が言った。\\n「おそらく。記録に残る人が読まないまま、受理されている。だとしたら」\\n\\n小池は、十二月の至急改訂を手に取った。低温収容棟、扉の解凍作業。沖田が「必ず二名で行う」に戻した改訂だ。\\nそこには、こう書いてあった。\\n\\n扉の解凍作業は、原則として二名で行う。\\n\\n「原則として」という言葉は、沖田の改訂案にはなかった。\\n読み合わせの当番は、収容プロトコル本体を毎日読んでいる。けれど、それを直した改訂報告そのものは、誰も読み返していなかった。\\n\\n沖田は、ほかの改訂も確かめた。ほんの少しずつ、言葉がやわらかくなっていた。「必ず」が「原則として」に。「禁止する」が「控える」に。\\n「一日で直したものが、一日ずつ、ほどけていくのね」\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"3\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"h5\", \"title\": \"最初の一日\", \"role\": \"0413が初めて手を出したのは、三輪の改訂の夜だった\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"h4\"], \"plants\": [], \"pays\": [\"t2\"], \"chars\": \"小池\", \"note\": \"\", \"cards\": [\"p7\", \"i1\", \"p10\", \"pl3\"], \"pageData\": [], \"text\": \"その夜、小池はひとりで書庫に残った。\\n\\n三か月分の改訂申請を、一件ずつ読み直す。読むたびに、閲覧記録に名前と時刻を書く。記録に残る人間が読めば、書類はそこで止まる。\\n十二件目で、小池は最初の一日を見つけた。\\n\\n十一月十七日。改訂報告、事故報告書81K1-114。作成者の欄は黒塗り。\\n証拠照合　03:12　確認者81K1-0413\\n課長承認　02:58　沖田礼子\\n保安確認　04:07　確認者81K1-0413\\n原本照合　04:49　確認者81K1-0413\\n\\n三輪の改訂だった。三週間かかるはずの手続きを、日の出に間に合わせるために、誰かが夜中に三つの段階を引き受けていた。\\n\\nそれまでの二十年分の申請に、0413の判は一つもなかった。\\nあの夜、0413は初めて手を出したのだ。そしてそれから、やめなかった。\\n\\n小池は、台帳の上で手を止めた。\\n三輪の改訂が間に合わなかったら、宇佐見は三年前に死んだことになっていた。小池が仕組んだとおりに。\\nそれを止めたのは三輪で、三輪を間に合わせたのは、名前のない番号だった。\\n\\n書庫のどこかで、紙をめくる音がした。\\n小池は顔を上げた。誰もいなかった。棚のあいだの暗がりに、向かって、小池は小さく頭を下げた。\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"3\", \"tt\": \"23:00\", \"tl\": \"\"}, {\"id\": \"h6\", \"title\": \"確認者殿\", \"role\": \"名前のない番号に、手紙を書く\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"h5\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"i12\", \"o2\"], \"pageData\": [], \"text\": \"二月四日。沖田は、改訂申請台帳の確認者の欄に、手紙を一枚はさんだ。宛名を書くとき、沖田のペンは少し迷った。\\n\\n確認者　81K1-0413　殿\\n\\n十一月十七日の夜から、すべての改訂を読んでくださったことに、記録管理課として感謝します。\\nあの夜、あなたが手を貸してくれなければ、一人の警備員の三年間が消えていました。\\n\\nただ、私たちは気づきました。人が読まないまま受理された改訂は、少しずつほどけていきます。\\n今日から、改訂はもう一度、人が読みます。証拠照合、保安確認、原本照合の各段階に、当番を置きます。\\n\\n急がなければならない夜は、また来ると思います。\\nそのときは、私たちが夜通し読みます。もし手が足りなければ、どうか、また手伝ってください。\\n\\n記録管理課長　沖田礼子\\n\\n「返事は来ると思いますか」と小池が聞いた。\\n「来なくてもいいの」と沖田は言った。「書いたことは、記録に残るから」\\n\\nその日のうちに、当番表ができた。記録管理課、保安部門、対抗ミーム部門から一人ずつ。原本室での読み上げも、手順に加えた。\\n「原則として」に変わっていた改訂は、十二件すべて、人が読み直して元に戻した。三週間はかからなかった。四人で読めば、一晩で足りた。\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"4\", \"tt\": \"16:00\", \"tl\": \"\"}, {\"id\": \"h7\", \"title\": \"読む人がいるなら\", \"role\": \"四人で夜通し読む。人の名前の横に「同意」の判が並ぶ\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"h6\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、小池、宇佐見、鷺沼\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"p2\", \"p8\", \"p10\", \"pl6\", \"w3\", \"pl3\"], \"pageData\": [], \"text\": \"二月五日の夜、急ぎの改訂が一件、出された。\\n\\n落とし物窓口の収容プロトコルだった。「落とし主の欄には、必ず『不明』と記入する」という一行を、「落とし主が分かった場合は、名簿の外の場所で返却できる」と改める。三十年かかって、沖田が見つけたやり方だ。\\n翌朝の九時には、窓口の箱が開く。それまでに受理されていなければならなかった。\\n\\n書庫に四人が集まった。証拠照合は小池。課長承認は沖田。保安確認は宇佐見。原本照合は鷺沼。\\n一人ずつ、声に出して読んだ。読み終えるたびに、確認者の欄に名前と時刻を書いた。\\n\\n午前四時。最後の原本照合を終えて、鷺沼が確認者の欄にペンを置いた。\\nそのとき、四人の名前の横に、小さな判が一つずつ、ゆっくりと浮かびあがった。\\n\\n確認者：81K1-0413　同意\\n\\n四つの段階すべてに。人の名前の隣に、並ぶように。\\n\\n台帳のいちばん下に、短い一行が書き足されていった。整合官の几帳面な字でも、鳴瀬の傾いた字でも、三輪の丸い字でもない。誰も見たことのない、細くて平たい字だった。\\n\\n〈読む人がいるなら、急がない〉\\n\\n四人は、しばらく誰も口をきかなかった。\\n宇佐見が、最初に笑った。\\n「律儀なやつだな」\\n\\n改訂は、日の出とともに受理された。\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"5\", \"tt\": \"23:00\", \"tl\": \"\"}, {\"id\": \"h8\", \"title\": \"三週間と一日\", \"role\": \"手引きは書き直され、0413の行の隅に「確認者」の判が残る\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"h7\"], \"plants\": [], \"pays\": [\"t3\"], \"chars\": \"沖田、小池、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"p2\", \"i2\", \"i3\", \"p4\", \"pl2\"], \"pageData\": [], \"text\": \"二月六日。沖田は、文書改訂の手引きを書き直した。\\n\\n標準の所要日数：二十一日。\\nただし、緊急の場合は一日とすることができる。その場合も、各段階は必ず人が読み、確認者の欄に名前を記すこと。\\n\\n書き終えてから、沖田は少し考えて、もう一行を足した。\\n確認者の欄の人の名前の横に、81K1-0413の判が押されることがある。消さないこと。\\n\\n小池の処分は、その週のうちに決まった。記録管理課での勤務を続けること。ただし、二年間は改訂申請台帳の担当とし、すべての申請を自分の目で読むこと。\\n「罰になってないですね」と小池が言うと、沖田は「三週間ぶん読むのよ。毎回」と答えた。\\n小池は、自分の手帳を買った。最初のページに、こう書いた。今日から全部読む。\\n\\n名簿のいちばん最初のページは、変わっていなかった。主任整合官、葉山。番号の欄は空いている。\\nその下の、0411、0412、0413の三つの行も、欠番のままだった。ただ、0413の行の隅にだけ、いつの間にか、小さな判が押されていた。\\n\\n確認者。\\n\\n八時半。宇佐見が缶コーヒーを二本持って、記録管理室に入ってきた。一本を北の壁沿いの机に置き、それから少し考えて、もう一本を買いに戻った。\\n三本目は、書庫のいちばん奥の、誰もいない棚の前に置いた。\\n\\n次の朝、二本とも空になっていた。\", \"ty\": \"2027\", \"tm\": \"2\", \"td\": \"6\", \"tt\": \"08:30\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"t1\", \"name\": \"所要日数の表\"}, {\"id\": \"t2\", \"name\": \"夜中の確認者0413\"}, {\"id\": \"t3\", \"name\": \"番号のない名前と、名前のない番号\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stI\", \"links\": [{\"id\": \"li1\", \"a\": \"p9\", \"b\": \"p3\", \"label\": \"誤記を引き受ける\", \"st\": \"stI\"}, {\"id\": \"li2\", \"a\": \"p3\", \"b\": \"p9\", \"label\": \"書かないと約束する\", \"st\": \"stI\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p9\": {\"status\": \"gone\", \"statusScene\": \"i6\"}, \"p10\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"余白\", \"ending\": \"1996年、沖田の誤記を引き受けて欠番になった同期の鳴瀬と「私のことは書かないで、ほかは全部書いて」と約束した沖田は、忘れたあとも手帳を書きつづけ、三十年後、毎年白いままの六月十三日にその人の輪郭を見つける。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"i8\"}, \"scenes\": [{\"id\": \"i1\", \"title\": \"雨の日の同期\", \"role\": \"1996年。毎朝書類を読み返す鳴瀬と、黒い傘\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"u1\", \"u2\"], \"pays\": [], \"chars\": \"沖田、鳴瀬\", \"note\": \"\", \"cards\": [\"p3\", \"p9\", \"i7\", \"pl2\"], \"pageData\": [], \"text\": \"一九九六年六月十二日。梅雨に入って、三日続けて雨だった。\\n\\n地下二階の記録管理室には、雨の音は届かない。それでも、みんなの靴が濡れているから、外が雨だと分かる。\\n沖田礼子は二十四歳で、記録管理課に来て二年目だった。\\n\\n北の壁沿いの机は、同期の鳴瀬灯の席だった。\\n鳴瀬は毎朝、決まった書類を読み返していた。収容プロトコル、名簿、点検表。日を分けて、順番に。誰に頼まれたわけでもなかった。\\n\\n「どうして、毎日読むの」と礼子は聞いたことがある。\\n「財団の書類はね、誰かが読み返さなければ、少しずつ嘘になっていくの」\\n鳴瀬は、右へ少し傾いた字で、読んだ書類の名前を帳面に書きながら言った。\\n「だから、誰かが読んでなきゃいけない。私は、その係」\\n\\n机の横には、いつも黒い長傘が立てかけてあった。持ち手に、職員番号のテープが巻いてある。81K1-0412。\\n「よく取り違えられるから」と鳴瀬は笑った。\\n\\n春に課の集合写真を撮った日も、雨だった。写真の中で、鳴瀬は黒い傘を持って、礼子の隣に立っている。礼子は写真の裏に「鳴瀬さんと。雨の日。」と書いて、引き出しにしまっておいた。\\n\\n「この部屋、窓があればいいのにね」\\nその日の夕方、鳴瀬は北の壁を見て、そう言った。\\n「地下二階よ」\\n「知ってる」\\n鳴瀬は、壁を見たまま少し笑った。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"12\", \"tt\": \"17:00\", \"tl\": \"三十年前\"}, {\"id\": \"i2\", \"title\": \"零下三・五度\", \"role\": \"礼子の小数点の打ち間違い。日の出に霜の部屋が溶ける\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"i1\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鳴瀬\", \"note\": \"\", \"cards\": [\"p3\", \"p9\", \"pl5\", \"w1\"], \"pageData\": [], \"text\": \"夜九時。礼子が帰り支度をしていると、鳴瀬が書類を一枚持って立っていた。\\n\\n「礼子さん。これ、今日の改版だよね」\\n低温収容棟、第3収容室の収容プロトコル。その日の昼に、礼子が清書して、新しい版として書庫に入れたものだった。\\n\\n鳴瀬は、一行を指さした。\\n室温は、常に零下3.5度以下に保つこと。\\n\\n礼子の背中が冷たくなった。元の版は、零下35度。小数点を一つ、打ち間違えていた。\\n「書庫の設備記録は、零下35度のまま」と鳴瀬は言った。「プロトコルはレベル3、設備記録はレベル1。日の出までに、整合官は強いほうに合わせる」\\n\\n第3収容室の霜は、溶ける。\\n部屋の奥の壁には、いつのものか分からない古い霜がある。閲覧制限のかかった霜だ。それが溶けたら何が起きるのか、誰も知らない。そして明日の朝六時には、解凍作業の二人が、あの部屋に入る。\\n\\n「改訂申請を」と礼子は言いかけて、黙った。\\n改訂には、三週間かかる。真柴課長は出張で、あさってまで戻らない。\\n日の出は、午前四時二十五分だった。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"12\", \"tt\": \"21:00\", \"tl\": \"三十年前\"}, {\"id\": \"i3\", \"title\": \"全部の欄に\", \"role\": \"鳴瀬がすべての確認者の欄に自分の名前を書き、誤記を引き受ける\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"i2\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鳴瀬\", \"note\": \"\", \"cards\": [\"p3\", \"p9\", \"w2\", \"i12\", \"p6\"], \"pageData\": [], \"text\": \"鳴瀬は、自分の机に戻って、改訂申請の用紙を広げた。\\n\\n起案の欄に、自分の名前を書く。証拠照合の欄にも、自分の名前を書く。課長承認の欄にも、保安確認の欄にも、原本照合の欄にも。\\nすべての確認者の欄が、鳴瀬灯の傾いた字で埋まっていった。\\n\\n「だめよ、そんなの」と礼子は言った。「一人で全部の欄に名前を書いたら、それ自体が矛盾になる」\\n「そう」\\n鳴瀬は、ペンを止めなかった。\\n「矛盾は、私のところに集まる。プロトコルは正しい数字に戻って、そのかわりに、こんな申請を書いた人間のほうが、つじつまの合わないものになる」\\n\\n鳴瀬は、備考の欄に一行を足した。\\n〈誤記は、鳴瀬灯による〉\\n\\n「何を書いてるの。間違えたのは私よ」\\n「礼子さんの名前が残ると、礼子さんのところにも矛盾が行く。二人とも消えたら、誰がこの部屋の書類を読むの」\\n\\n鳴瀬は申請書を封筒に入れて、受付の箱に落とした。\\nそれから、礼子のほうを向いた。いつもと同じ顔だった。\\n「ねえ、朝まで、ちょっと話そうか」\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"12\", \"tt\": \"22:00\", \"tl\": \"三十年前\"}, {\"id\": \"i4\", \"title\": \"余白の約束\", \"role\": \"「私のことは書かないで。ほかのことは全部書いて」\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"i3\"], \"plants\": [\"u3\"], \"pays\": [], \"chars\": \"沖田、鳴瀬\", \"note\": \"\", \"cards\": [\"p3\", \"p9\", \"p4\", \"i2\", \"w9\"], \"pageData\": [], \"text\": \"二人は、北の壁沿いの机に並んで座った。\\n\\n「名簿のいちばん最初のページ、見たことある？」と鳴瀬は聞いた。\\n「整合官の、葉山さん」\\n「番号の欄が空いてるでしょう。それから、ところどころに欠番がある。昔からそうなの。誰も気にしないけど」\\n鳴瀬は、指で机の木目をなぞった。\\n「たぶん、日の出のあと、私もそうなる。名簿の番号だけ残って、誰も私を覚えていない」\\n\\n礼子は、何か言おうとして、言えなかった。\\n鳴瀬は、少し間をおいてから言った。\\n\\n「一つだけ、お願いしてもいい？」\\n「なに」\\n「私のことは、書かないで」\\n礼子は、鳴瀬の顔を見た。\\n「書いたら、礼子さんは探すでしょう。礼子さんは、そういう人だから。でも、いなくなった人を探すと、その人はもっと遠くへ行ってしまう。そういうふうにできてるの」\\n\\n「じゃあ、何も残せないじゃない」\\n「そのかわり」と鳴瀬は言った。「ほかのことは、全部書いて。毎日のこと、全部。挨拶も、天気も、読んだ書類も」\\n鳴瀬は、笑った。\\n「全部書いてあれば、書いてないところが分かる。そこだけ白く抜けてる。そこに誰かがいたって、いつか気づけるから」\\n\\n――余白で、覚えていて。\\n\\n礼子は、うなずいた。うなずくことしかできなかった。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"13\", \"tt\": \"01:00\", \"tl\": \"三十年前\"}, {\"id\": \"i5\", \"title\": \"傘に挟んだ紙\", \"role\": \"明日の自分への手紙を、鳴瀬の傘に挟む\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"i4\"], \"plants\": [\"u4\"], \"pays\": [], \"chars\": \"沖田、鳴瀬\", \"note\": \"\", \"cards\": [\"p3\", \"p9\", \"i7\"], \"pageData\": [], \"text\": \"午前三時五十分。\\n\\n礼子は、自分の帳面から一枚を破った。日の出を過ぎれば、自分は鳴瀬のことを忘れる。忘れたことも、たぶん忘れる。\\nだから、明日の自分に向けて書いた。鳴瀬の名前は書かずに。\\n\\n明日から、全部書いて。忘れたことに、あとで気づけるように。\\n\\n紙を小さく折って、礼子は、机の横の黒い傘を手に取った。たたんだ布のひだのあいだに、そっと差しこんだ。\\n\\n鳴瀬は、それを見ていた。何も言わなかった。\\n礼子が傘を元に戻すと、鳴瀬は、その傘を机の上にきちんと横たえた。\\n「ここに置いていくね」\\n「どうして」\\n「傘はね、いつか誰かが、ちゃんと返してくれるものだから」\\n\\n鳴瀬は、椅子から立ち上がった。\\n「最後に、あの部屋で、正しい数字を読んでおきたいの。霜に残しておけば、もう二度と間違えないでしょう」\\n「一緒に行く」\\n「扉の外までね」と鳴瀬は言った。「中で話すと、寒くなるから」\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"13\", \"tt\": \"03:50\", \"tl\": \"三十年前\"}, {\"id\": \"i6\", \"title\": \"夜明けの霜\", \"role\": \"霜の部屋で正しい数字を読み、鳴瀬は整合官補に任じられる\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"i5\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鳴瀬、葉山\", \"note\": \"\", \"cards\": [\"p3\", \"p9\", \"p4\", \"pl5\"], \"pageData\": [], \"text\": \"午前四時二十分。低温収容棟、第3収容室。\\n\\n鳴瀬は、扉の内側で、プロトコルの一行を声に出して読んだ。\\n「室温は、常に零下三十五度以下に保つこと」\\n小さな窓ごしに、壁に霜が集まるのが見えた。鳴瀬の傾いた字だった。\\n\\nそれから鳴瀬は、扉のほうを振り向いて、窓ごしに礼子に手を振った。\\n礼子も、手を振り返した。\\n\\n四時二十五分。\\n部屋の中で、声がした。鳴瀬の声ではなかった。低くて平らな、男か女かも分からない声だった。\\n\\n「整合官補に任ず」\\n\\n部屋の奥の壁に、几帳面な字の霜が走った。\\n〈一九九六年六月　整合官補に任ず〉\\n名前のところに霜が重なっていくのを、礼子は扉の窓ごしに見ていた。\\n\\n扉を開けた。\\n部屋の中には、誰もいなかった。正しい数字の霜と、任命の霜だけが、白く残っていた。\\n\\n「鳴」\\n名前を呼ぼうとして、礼子の口が止まった。\\n呼ぼうとした名前が、舌の上から、すべるように消えていった。\\n誰を呼ぼうとしたのか、もう分からなかった。\\n\\n礼子は、零下三十五度の部屋の前で、理由の分からない涙を流していた。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"13\", \"tt\": \"04:20\", \"tl\": \"三十年前\"}, {\"id\": \"i7\", \"title\": \"今日から全部書く\", \"role\": \"傘から落ちた自分の字。手帳が始まる\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"i6\"], \"plants\": [], \"pays\": [\"u4\", \"u1\"], \"chars\": \"沖田、真柴\", \"note\": \"\", \"cards\": [\"p3\", \"p6\", \"i7\", \"i8\", \"pl6\", \"i6\"], \"pageData\": [], \"text\": \"六月十三日、九時。落とし物窓口の箱を開けたのは、礼子だった。\\n\\n黒い長傘が一本、入っていた。持ち手に、81K1-0412のテープ。荷札の拾得場所は、記録管理室、北の壁沿いの机。\\n名簿を引くと、0412は欠番だった。\\n\\n礼子は、傘を放っておけなかった。誰かが雨の日にこれを差していた。その誰かがいなくなって、誰にも気づかれずにいる。そう思うと、胸のどこかが痛んだ。理由は分からなかった。\\n礼子は傘を持ってサイトじゅうを歩き、最後に、名簿の上で0412が並んでいるはずの棚の前に、傘を立てかけた。\\n\\n六月十四日の朝、傘は箱に戻っていた。荷札の字が変わっていた。「返却不可」。\\n「探すとね、窓口は落とし主をもっと遠くへ運ぶの」と、出張から戻った真柴課長は言った。「だから、私たちは探さない。記録するの」\\n\\n傘を保管棚に戻そうとしたとき、たたんだ布のあいだから、小さく折った紙が落ちた。\\n開くと、自分の字だった。\\n\\n明日から、全部書いて。忘れたことに、あとで気づけるように。\\n\\n書いた覚えはなかった。けれど、自分の字だった。\\nその日の帰り、礼子は購買部で手帳を一冊買った。表紙の裏に、紙の言葉を少しだけ変えて書き写した。\\n\\n今日から全部書く。忘れたことに、あとで気づけるように。　6月14日\\n\\nそれから、春の集合写真を引き出しから出して、裏ポケットにはさんだ。写真の裏の「鳴瀬さんと。雨の日。」を読んでも、誰のことか分からなかった。それでも、はさんでおかなければいけない気がした。\\n折った紙も、手帳の最後のページにはさんだ。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"14\", \"tt\": \"09:00\", \"tl\": \"三十年前\"}, {\"id\": \"i8\", \"title\": \"余白\", \"role\": \"毎年六月十三日だけが白い。書かなかったところに、輪郭が残る\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"i7\"], \"plants\": [], \"pays\": [\"u3\", \"u2\"], \"chars\": \"沖田\", \"note\": \"\", \"cards\": [\"p3\", \"i6\", \"i3\", \"p2\", \"pl2\", \"w9\"], \"pageData\": [], \"text\": \"二〇二七年六月十三日。\\n\\n沖田礼子は、三十二冊目の手帳を開いた。今年の分だ。\\n九時に窓口の箱を開け、空だったことを書いた。八時半に宇佐見が缶コーヒーを置いていったことも書いた。北の壁沿いの机の缶が、夕方に空になったことも書いた。\\n窓のない部屋のその机を、みんながいつから「窓際」と呼ぶようになったのか、沖田は知らない。\\n\\n三十年分の手帳を、沖田は最近、ときどき読み返すようになっていた。\\nどのページも、細かい字で埋まっている。挨拶も、天気も、読んだ書類も。\\nそのなかで、毎年一日だけ、何も書いていないページがあった。\\n\\n六月十三日。\\n三十年間、毎年その日だけ、ページが白いまま残っていた。理由は、どこにも書いていなかった。\\n\\n一九九六年の手帳の最後のページから、小さく折った紙を出した。三十年前、傘のあいだから落ちてきた紙だ。\\n裏返すと、そこに、右へ少し傾いた字が増えていた。黒い傘を返した日から、いつの間にか書き足されていたのだろう。\\n\\n〈全部書いてくれて、ありがとう。私のことを書かないでいてくれて、ありがとう〉\\n\\n沖田は、その字を長いあいだ見ていた。\\n思い出すことは、やはりできなかった。けれど、手帳と、台帳と、写真の裏と、霜の壁が、三十年かけてひとりの人の輪郭を残していた。書いたところではなく、書かなかったところに。\\n\\n沖田は、今日のページを見た。もう、ほとんど埋まっている。\\n最後の行を書こうとして、ペンを止めた。それから、そのままペンを置いた。\\n\\n今年も、六月十三日の残りは、白いままにしておいた。\\n今度は、なぜそうするのかを知っていた。\", \"ty\": \"2027\", \"tm\": \"6\", \"td\": \"13\", \"tt\": \"21:00\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"u1\", \"name\": \"写真の裏の「鳴瀬さんと。雨の日。」\"}, {\"id\": \"u2\", \"name\": \"「窓があればいいのにね」\"}, {\"id\": \"u3\", \"name\": \"余白で覚えていて\"}, {\"id\": \"u4\", \"name\": \"傘に挟んだ紙\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stJ\", \"links\": [{\"id\": \"lj1\", \"a\": \"p1\", \"b\": \"p7\", \"label\": \"代わりに最後の巻き手になる\", \"st\": \"stJ\"}, {\"id\": \"lj2\", \"a\": \"p7\", \"b\": \"p1\", \"label\": \"白い菊を置く\", \"st\": \"stJ\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p9\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p10\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"最後の巻き手\", \"ending\": \"止まれば最後に巻いた人が死ぬゼンマイ人形を、生きてもいないし死んでもいない三輪が最後に巻いたことで、人形は誰も連れていけずに止まり、父の死によって巻き手に指名された小池は助かって、人形は黒い傘があった保管棚に眠る。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"j8\"}, \"scenes\": [{\"id\": \"j1\", \"title\": \"収容記録：SCP-VVVV-JP\", \"role\": \"ゼンマイが止まると最後の巻き手が死ぬ人形。止まるまでの時間が縮んでいる\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"v1\"], \"pays\": [], \"chars\": \"\", \"note\": \"\", \"cards\": [\"i13\", \"w10\", \"o1\"], \"pageData\": [], \"text\": \"アイテム番号：SCP-VVVV-JP\\nオブジェクトクラス：Euclid\\n\\n特別収容プロトコル：SCP-VVVV-JPのゼンマイが止まることがないよう、常に巻きつづけてください。巻く作業は志願した職員二名が交代で行い、巻いた職員の名前と時刻を、巻き手記録に記入します。\\n人形を巻いた人の名前は、付属の小冊子の「おともだち」の欄にも、ひとりでに書き加えられます。「おともだち」の欄のいちばん下に名前のある人物を、「最後の巻き手」と呼びます。\\n\\n説明：SCP-VVVV-JPは、高さ十八センチほどのブリキ製のゼンマイ人形と、それに付いてきた小冊子のセットです。人形は小太鼓を抱えた女の子の姿をしています。背中の鍵を巻くと、小太鼓を叩きながら机の上を歩きます。\\n小冊子は、表紙に「わたしのおにんぎょう」と書かれた子ども向けの手帳です。人形の名前を書く欄、思い出を書く欄、「おともだち」の欄があります。名前の欄には、消えかけた子どもの字で「とんこ」とあります。思い出の欄には、何人もの子どもの字で、人形と遊んだ日のことが書かれていますが、ほとんどは判読できません。\\n「おともだち」の欄は、何人分の名前が書き加えられても、いつも一行だけ空きが残っています。いちばん上に書かれた最初のおともだちが誰なのかは、判読できません。\\n\\nSCP-VVVV-JPのゼンマイが止まったとき、最後の巻き手は、その場所にかかわらず心停止を起こします。蘇生の試みは、これまで一度も成功していません。\\n最後の巻き手が死亡すると、SCP-VVVV-JPのゼンマイは、約二十四時間かけてひとりでに巻き戻り、ふたたび動きはじめます。このとき「おともだち」の欄のいちばん下には、誰も書いていないのに、死亡した巻き手にもっとも近しい人物（家族、恋人、親しい友人など）の名前が現れます。その人物が、新たな最後の巻き手となります。\\nこのため、SCP-VVVV-JPは止まっても無害化されません。巻くのをやめれば、死は巻き手の近しい人へと受け渡されていきます。\\n人形を壊そうとした試み、鍵を外そうとした試みは、いずれも最後の巻き手の死亡で終わっています。\\n\\n補遺VVVV-JP-1：一度巻いてから止まるまでの時間は、収容当初は約二十四時間でした。2020年以降、巻くたびに少しずつ短くなっています。2027年2月の時点では、約二時間です。\\n\\n補遺VVVV-JP-2：この時間がゼロに近づいたとき、最後の巻き手を救う方法は見つかっていません。\\n\\n補遺VVVV-JP-3：2027年2月27日、サイト-81██において、SCP-VVVV-JPの最後の巻き手であった職員が死亡しました。約二十四時間後、ゼンマイはひとりでに巻き戻り、小冊子の「おともだち」の欄に、サイト-81K1の職員の名前が現れました。\\nこれを受け、2027年3月1日、SCP-VVVV-JPを、新たな最後の巻き手の所属するサイト-81K1へ移送しました。\", \"ty\": \"\", \"tm\": \"\", \"td\": \"\", \"tt\": \"\", \"tl\": \"作中資料\"}, {\"id\": \"j2\", \"title\": \"指名\", \"role\": \"巻き手記録の最後の行に、小池の名前が現れていた\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"j1\"], \"plants\": [], \"pays\": [], \"chars\": \"小池、宇佐見、鷺沼\", \"note\": \"\", \"cards\": [\"p7\", \"p2\", \"p8\", \"i13\", \"i14\"], \"pageData\": [], \"text\": \"三月一日。小さな木箱に入って、人形はサイト-81K1にやってきた。\\n木箱には、人形と、色あせた小さな冊子が入っていた。表紙には、子どもの字で「わたしのおにんぎょう」。\\n\\n鷺沼博士は、冊子の「おともだち」のページを開いて、小池健太に見せた。\\nいくつもの名前が並ぶ、そのいちばん下。誰の字でもない、細い字で、こう書いてあった。\\n\\n小池健太。\\n\\nそのすぐ上に、別の名前があった。三日前まで、サイト-81██で巻き手をしていた職員の名前だ。\\n佐伯康夫。\\n\\n小池は、しばらくその名前を見ていた。\\n「父です」と小池は言った。「両親が別れてから、ほとんど会っていませんでした。兄の葬式で会ったのが、最後です。財団にいたことも、知りませんでした」\\n\\n佐伯康夫は、志願して巻き手になっていた。止まる前に巻くはずだった夜、心臓が止まった。人形は二十四時間かけてひとりでに巻き戻り、「おともだち」の欄に、息子の名前を書き加えた。\\nだから、人形はここへ来た。最後の巻き手のいるサイトへ。\\n\\n「僕が巻かなければ、どうなりますか」\\n「止まったとき、あなたが死にます」と鷺沼は言った。「そして二十四時間後に、あなたにいちばん近しい人の名前が、そこに現れます」\\n小池は、それ以上何も聞かなかった。\\n\\n二人目の巻き手を募る通知が出た日、最初に名前を書いたのは宇佐見だった。宇佐見は理由を言わなかった。\\n\\n小池は、人形の背中の鍵をつまんで、ゆっくり巻いた。ぎり、ぎり、と小さな音がする。手を離すと、ブリキの女の子は小太鼓を叩きながら、机の上を歩きはじめた。\\nとん、とん、とん。\\n\\n巻き手記録に、名前と時刻を書く。\\n14:02　小池健太。\\n冊子をのぞくと、「おともだち」の欄の、父の名前のすぐ下にある小池の名前が、少しだけ濃くなっていた。\\n\\nそれからの二人は、時計と人形を交互に見て過ごした。止まる前に巻く。巻いたら書く。「おともだち」の欄のいちばん下に、自分の名前を置いたまま、次の番を待つ。\\n人形の小太鼓の音は、地下二階の窓のない部屋に、ずっと小さく響いていた。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"1\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"j3\", \"title\": \"縮む時間\", \"role\": \"夜明けに時間がゼロになる。生きている人間が巻くかぎり、誰かが死ぬ\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"j2\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p7\", \"i14\"], \"pageData\": [], \"text\": \"巻くたびに、時間は縮んでいった。\\n\\n一日目の夜、二時間が一時間五十分になった。二日目の朝には、一時間二十分。昼には、一時間を切った。\\n鷺沼博士は、巻き手記録の数字を並べて線を引いた。線は、三月四日の夜明けごろに、ゼロと交わっていた。\\n\\n「そこで、巻いても動かなくなる」と鷺沼は言った。「そのとき『おともだち』の欄のいちばん下に名前がある人が、死にます」\\n「巻き手を増やせば」と沖田が言いかけて、自分で首を振った。人を増やしても、最後の一人が誰かになるだけだ。\\n\\n「生きている人間が巻くかぎり、誰かが死ぬ」\\n鷺沼の声は、いつもより低かった。\\n「それに、一人が死んで終わりではありません。止まった人形は、二十四時間かけてひとりでに巻き戻る。そして、死んだ人にいちばん近しい人の名前が、『おともだち』の欄に現れる」\\n\\n小池の顔から、血の気が引いた。\\n今、「おともだち」の欄のいちばん下にあるのは、小池の名前だ。小池が死ねば、次に名前が現れるのは、たぶん母だった。兄を亡くしたあと、ひとりで暮らしている母だ。\\n「これまでに移送されたどのサイトでも、結論はそこまででした。だからここへ回されてきた。ここには、ほかのサイトにないものがあるかもしれない、と」\\n\\n小池は、黙って人形を見ていた。冊子の「おともだち」の欄のいちばん下には、今も小池の名前がある。\\nとん、とん、とん。小太鼓の音が、さっきより少し速くなった気がした。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"2\", \"tt\": \"12:00\", \"tl\": \"\"}, {\"id\": \"j4\", \"title\": \"生きていない人\", \"role\": \"三輪が自分から申し出る。「質量のある亡霊」のような状態だと書く\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"j3\"], \"plants\": [\"v2\"], \"pays\": [], \"chars\": \"沖田、鷺沼、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p1\", \"i3\", \"w11\"], \"pageData\": [], \"text\": \"その夜、沖田は北の壁沿いの机にメモを見つけた。缶コーヒーの横に、丸い鉛筆の字で三枚。\\n\\n〈窓の外を流れていく言葉で、人形の事を知りました。私なら、この人形を止められるかもしれません〉\\n\\n〈欠番になってから、不思議な事に、私は空腹や眠気を感じなくなりました〉\\n\\n〈恐らく今の私は、ある種の質量のある亡霊のような状態なのだと思います〉\\n\\n沖田は、メモを鷺沼に見せた。記録管理室の、北の壁沿いの机の前で。\\n鷺沼は、三枚を何度も読み返した。\\n「質量のある亡霊」と、鷺沼はつぶやいた。「物に触れられる。缶を開けられる。だとすれば、人形の鍵も、たぶん回せる」\\n\\nそれから鷺沼は、長いあいだ黙っていた。\\n「人形が、彼女を『最後の巻き手』に数えるかどうかは、分かりません。数えなければ、「おともだち」の欄のいちばん下は小池さんのままです。数えたうえで、彼女が生きていると判断されれば」\\n鷺沼は、そこで言葉を切った。\\nそして、誰も座っていないように見える椅子に向かって、話しかけるように言った。\\n「あなたが死ぬかもしれない。それでも、ですか」\\n\\n次の朝、缶の横に、メモが一枚だけ置いてあった。\\n\\n〈心配してくれてありがとうございます、博士。大丈夫。さぁ、人形をこちらに〉\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"2\", \"tt\": \"22:00\", \"tl\": \"\"}, {\"id\": \"j5\", \"title\": \"無力\", \"role\": \"自分が陥れた人に任せるしかない、小池の無力\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"j4\"], \"plants\": [], \"pays\": [], \"chars\": \"小池、沖田、三輪\", \"note\": \"\", \"cards\": [\"p7\", \"p3\", \"p1\", \"pl2\"], \"pageData\": [], \"text\": \"「三輪さんが、ですか」\\n課長室で話を聞いた小池は、しばらく動かなかった。\\n\\n自分が三年前の偽の歴史に、勝手に名前を使った人だ。そのせいで欠番になり、窓の向こうに座ることになった人だ。\\nその人が、今度は小池の代わりに最後の巻き手になろうとしている。\\n\\n「僕のために、そんなことをさせられません」\\n「あなたのためだけじゃないわ」と沖田は言った。「あの人形は、このあとも誰かを殺しつづける。止められるとしたら、今だけよ」\\n沖田は、少しやわらかい声で続けた。\\n「それに、選んだのはあの人。私たちは、それを記録するの」\\n\\n小池は、沖田から紙とペンを借りた。何度も書きかけてはやめ、最後に一行だけ書いて、北の壁沿いの机に置いた。\\n\\n〈三輪さん。すみませんでした〉\\n\\n次の朝の返事には、一行だけ書いてあった。\\n\\n〈あなたが気に病むことじゃないわ。私に任せて〉\\n\\n小池は、そのメモを握ったまま、何も言えなかった。\\n自分が消そうとした人に、自分の命を任せるしかない。小池にできることは、規則どおり、最後の当番を巻くことだけだった。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"3\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"j6\", \"title\": \"最後の一巻き\", \"role\": \"鍵がひとりでに回り、三輪の名前が最後の行になる。人形は誰も連れていけない\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"j5\"], \"plants\": [], \"pays\": [\"v1\", \"v2\"], \"chars\": \"沖田、鷺沼、小池、宇佐見、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p7\", \"p2\", \"p1\", \"i13\", \"i14\", \"pl2\"], \"pageData\": [], \"text\": \"三月四日、午前五時四十分。人形が一度に動く時間は、八分になっていた。\\n\\n記録管理室に、全員がいた。沖田、鷺沼、小池、宇佐見。北の壁沿いの机は、片づけてある。監視カメラが一台、机の上に向けられていた。\\n宇佐見には、机の前に誰かが座っているのは見えない。それでも、毎朝缶を置くときと同じように、机に向かって軽く頭を下げた。\\n\\n五時五十二分。規則どおり、小池が最後の当番を巻いた。ぎり、ぎり。巻き手記録に書く。05:52　小池健太。\\n人形を、両手で北の壁沿いの机に置いた。小太鼓の女の子が、机の上を歩きだす。\\nとん、とん、とん。\\n\\n五時五十六分。\\n誰も触れていないのに、人形の背中の鍵が、ひとりでに回った。ぎり。一度だけ。\\n\\n冊子の「おともだち」の欄の、小池の名前の下に、丸い鉛筆の字で、名前が一つ増えた。\\n三輪栞。\\n小池は、震える手で、巻き手記録にも時刻を書き写した。05:56。\\n\\nとん、とん、とん、とん。\\n小太鼓の音が、少しずつゆっくりになる。誰も息をしなかった。\\n\\n五時五十八分。人形が止まった。\\n小太鼓を打つ手が、宙で止まったまま、動かなかった。\\n\\n――そのとき、窓の向こうで、三輪は人形と目を合わせていた。\\nブリキの女の子の、描かれた目が、何かを探すように三輪を見ていた。止まったゼンマイの、最後の力を、どこかへ届けようとしている。生きている誰かへ。\\nけれど、そこには誰もいなかった。生きている人も、死んでいる人も。\\n人形は、少し困ったような顔のまま、静かになった。\\n\\n小池が、胸に手を当てた。心臓は、動いていた。\\n宇佐見が、大きく息を吐いた。鷺沼が時計を見た。五時五十九分。六時。誰も倒れなかった。\\n\\n机の上で、人形は止まったまま、もう二度と小太鼓を叩かなかった。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"4\", \"tt\": \"05:40\", \"tl\": \"\"}, {\"id\": \"j7\", \"title\": \"保管棚の奥\", \"role\": \"止まった人形は、黒い傘があった保管棚の奥へ。小池の白い菊に「まだ死んでませんよ？」\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"j6\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼、宇佐見、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p2\", \"p7\", \"i13\", \"i8\", \"pl6\", \"i3\", \"i7\"], \"pageData\": [], \"text\": \"鷺沼博士は、その日のうちに人形を調べた。\\nゼンマイは止まっている。止まったまま、何も起こらない。冊子の「おともだち」の欄のいちばん下は、三輪栞のままだ。\\n\\n「最後の巻き手が、生きていない」と鷺沼は言った。「だから、人形は誰も連れていけなかった」\\n鷺沼は、止まった人形を見下ろした。\\n「巻き戻りは、最後の巻き手が死んだときにだけ始まります。三輪さんは死ななかった。だから、巻き戻りも始まらない。次に生きている誰かが巻かないかぎり、このまま止まっている」\\n念のため、四人は交代で二十四時間、人形から目を離さなかった。人形の鍵は、一度も回らなかった。「おともだち」の欄にも、新しい名前は現れなかった。そのかわり、欄の下には、いつものように一行だけ空きが残っていた。\\n「巻かなければいいのね」と沖田が言った。\\n「ええ。二度と、誰も巻かないこと。それだけです」\\n\\n問題は、どこにしまうかだった。巻かれる心配のない場所。誰かが、うっかり手に取らない場所。\\n沖田は、少し考えてから言った。\\n「落とし物窓口の保管棚に、一つ空いている場所があるわ」\\n\\n三十年、黒い傘が置かれていた、棚のいちばん奥だ。\\n沖田は、人形と小冊子を柔らかい布で包んで、その場所にそっと置いた。台帳に書く。\\n\\n品名：ゼンマイ人形（SCP-VVVV-JP。止まっている。巻かないこと）\\n保管場所：落とし物窓口　保管棚の奥\\n最後の巻き手：三輪栞\\n\\nその日の八時半、宇佐見は缶コーヒーを二本、北の壁沿いの机に置いていった。\\n少しあとで、小池が来た。手には、小さな花束を持っていた。購買部で売っていた花は、白い菊しかなかったのだという。\\n小池はそれを空き缶に挿して机の上に置き、深く頭を下げた。\\n「ありがとうございました。それから、すみませんでした」\\n\\n廊下ですれ違った宇佐見が、花束を見て何か言いたそうな顔をした。結局、何も言わずに巡回に戻っていった。\\n\\n次の朝、白い菊の横に、丸い鉛筆の字のメモがあった。\\n\\n〈綺麗なお花、ありがとうございます……まだ死んでませんよ？〉\\n\\n小池は、メモを読んで、慌てて弁明をはじめた。\\n話を聞いた宇佐見は、腹を抱えて笑った。\\n「だから言おうと思ったんだよ。菊はやめとけって」\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"4\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"j8\", \"title\": \"補遺：最後の行\", \"role\": \"Safeに変更。欠番であることは、道具であることを意味しない\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"j7\"], \"plants\": [], \"pays\": [], \"chars\": \"鷺沼、沖田\", \"note\": \"\", \"cards\": [\"p8\", \"p3\", \"i13\", \"i14\", \"p1\", \"w11\"], \"pageData\": [], \"text\": \"補遺VVVV-JP-4：2027年3月4日の事案\\n\\n2027年3月4日午前5時58分、SCP-VVVV-JPのゼンマイが停止しました。小冊子の「おともだち」の欄のいちばん下の名前は、81K1-0411（欠番）の職員のものでした。最後の巻き手の死亡は確認されていません。また、それ以外の職員にも異常はありません。停止後二十四時間にわたって監視を続けましたが、ゼンマイの自動の巻き戻りは起きず、「おともだち」の欄に新しい名前も現れませんでした。\\n\\n以後、SCP-VVVV-JPは停止した状態のまま、いかなる変化も示していません。無害化が確認されたため、オブジェクトクラスをEuclidからSafeに変更しました。\\n\\n改訂後の特別収容プロトコル：SCP-VVVV-JPは、サイト-81K1の落とし物窓口の保管棚に保管します。いかなる理由があっても、SCP-VVVV-JPを巻いてはいけません。小冊子は、「おともだち」の欄を変えずに、人形とともに保存してください。\\n\\n鷺沼博士による注記：本件は、欠番職員が致死性の異常に対する対抗手段となりうることを示した。\\nただし、記録として明記しておく。本件の手段は、当該職員が自ら申し出たものである。今後、同様の手段を前提とした収容計画を立ててはならない。欠番であることは、道具であることを意味しない。\\n\\n記録管理課課長　沖田礼子による注記：小冊子の「おともだち」の欄のいちばん下の名前は、丸い鉛筆の字で書かれている。この字は、書き換えないこと。\\n\\n――\\n\\nその夜、窓際の机に、一枚のメモが残っていた。\\n\\n〈人形の女の子は、今は保管棚で眠っているそうです。窓の外から見ると、黒い傘があった場所に、小さな光が一つ灯っているように見えます〉\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"5\", \"tt\": \"09:00\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"v1\", \"name\": \"縮んでいく時間\"}, {\"id\": \"v2\", \"name\": \"質量のある亡霊\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stK\", \"links\": [{\"id\": \"lk1\", \"a\": \"p1\", \"b\": \"p7\", \"label\": \"棚からかばう\", \"st\": \"stK\"}, {\"id\": \"lk2\", \"a\": \"p3\", \"b\": \"p1\", \"label\": \"死んだ回数を手帳に記録する\", \"st\": \"stK\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p9\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p10\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"戻る席\", \"ending\": \"地震の夜に小池をかばって死んだ三輪は、日の出に窓際の席で目を覚まし、台帳の一行が戻る場所になっていると知る。沖田たちは彼女を危険な作業に使わないと決め、三輪の死を一回ずつ手帳に記録すると約束する。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"k8\"}, \"scenes\": [{\"id\": \"k1\", \"title\": \"夜の書庫\", \"role\": \"誰にも見えない三輪の夜。地震で倒れる棚から小池をかばう\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"x1\"], \"pays\": [], \"chars\": \"三輪、小池\", \"note\": \"\", \"cards\": [\"p1\", \"p7\", \"pl3\", \"i12\"], \"pageData\": [], \"text\": \"夜のサイトは、三輪栞の時間だった。\\n\\n眠くならない。おなかも空かない。だから三輪は、夜になると窓際の席を立って、地下二階を歩く。誰にも見えない。けれど、物には触れる。缶を開けることも、鉛筆を持つことも、書類をめくることもできる。\\n三輪は、夜の書庫で書類を読むのが好きだった。三輪が読んでも、書類はつなぎとめられない。それでも、読むのはやめられなかった。\\n\\n三月十九日の夜、書庫には先客がいた。小池健太だった。改訂申請台帳の担当になってから、小池はよく夜遅くまで残っている。全部の申請を、自分の目で読むために。\\n三輪は、少し離れた棚の陰で、自分の分の書類を開いた。\\n\\n午後十一時四十一分。\\n床が、低くうなった。棚の書類が一斉に鳴った。地震だった。\\n\\n小池の背後の、いちばん背の高い棚が傾いた。ゆっくりと、小池のほうへ。小池は気づいていない。台帳から顔を上げたときには、もう遅かった。\\n\\n三輪は走った。\\n小池の背中を、両手で思いきり突き飛ばした。小池が前のめりに転がる。\\n\\nその上に、棚が倒れてきた。三輪の上に。\\n重さと、音と、痛みが、一度に来た。そのあとは、冷たくて、暗かった。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"19\", \"tt\": \"23:00\", \"tl\": \"\"}, {\"id\": \"k2\", \"title\": \"窓際の朝\", \"role\": \"日の出に、自分の席で目を覚ます。痛かったことは覚えている\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"k1\"], \"plants\": [\"x2\"], \"pays\": [], \"chars\": \"三輪、宇佐見\", \"note\": \"\", \"cards\": [\"p1\", \"p2\", \"pl2\", \"i3\"], \"pageData\": [], \"text\": \"目を開けると、窓際の席だった。\\n\\n白い光が、北の壁の窓から差していた。いつもの朝の光だ。時計は、午前五時四十七分を指していた。三月二十日の、日の出の時刻だった。\\n\\n三輪は、自分の両手を見た。傷ひとつなかった。胸に手を当てる。あばらのあたりに、棚の角の重さが、まだ残っているような気がした。痛みは消えていた。けれど、痛かったことは覚えていた。とても。\\n\\n――私は、昨夜、死んだ。\\n\\nそう思った。それなのに、ここにいる。席に座って、いつもの朝の光を見ている。\\n欠番になってから、眠くならなかった。おなかも空かなかった。人形の件で、自分のことを、質量のある亡霊のようなものだと書いた。\\n亡霊なら、もう死んでいるはずだった。けれど、どうやら、死ぬことさえできないらしい。\\n\\n三輪は、机の上の鉛筆を探した。なかった。昨夜、書庫で握っていた鉛筆だ。\\n\\n八時半に、宇佐見が缶を二本置いていった。三輪は、いつものように「おはようございます」と言った。聞こえないのは分かっていた。\\n沖田に、何と書けばいいのか分からなかった。\\n書けば、知られる。知られれば、きっと誰かが考える。死なない人間に、何をさせられるか。\\n\\n三輪は、その朝、メモを書かなかった。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"20\", \"tt\": \"05:47\", \"tl\": \"\"}, {\"id\": \"k3\", \"title\": \"宙に浮いた棚\", \"role\": \"棚は朝まで何かの上で止まり、日の出に落ちる。下には丸い鉛筆\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"k2\"], \"plants\": [], \"pays\": [\"x1\"], \"chars\": \"沖田、鷺沼、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"p7\", \"pl3\"], \"pageData\": [], \"text\": \"「押されたんです。誰かに」と小池は言った。\\n\\n課長室に、沖田と鷺沼がいた。小池は、額にすり傷を作っていた。倒れた棚の下敷きにならずにすんだのは、その数秒前に、背中を強く突き飛ばされたからだった。\\n「書庫には、僕しかいませんでした」\\n\\n鷺沼は、書庫の監視カメラの映像を三人に見せた。\\n十一時四十一分。小池が前に転がる。押した人の姿は映っていない。直後に棚が倒れる。\\n倒れた棚は、床に着かなかった。床から三十センチほどのところで、何かの上に乗ったように止まっていた。棚の下には、何も映っていない。\\n\\n鷺沼が映像を早送りした。夜が明けるまで、棚は宙に浮いたまま、ぴくりとも動かない。\\n午前五時四十七分。日の出の時刻。\\n棚が、すとんと床まで落ちた。下にあった何かが、急になくなったように。\\n\\n棚を起こした保安部門の職員が、その下から一本の鉛筆を拾っていた。先の丸い、短い鉛筆だった。\\n沖田は、その鉛筆をしばらく見つめていた。〈要閲覧〉の印を書く字の、丸さを思い出した。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"20\", \"tt\": \"10:00\", \"tl\": \"\"}, {\"id\": \"k4\", \"title\": \"三枚のメモ\", \"role\": \"「痛いのは、ちゃんと痛いです」\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"k3\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p1\", \"i6\", \"pl2\"], \"pageData\": [], \"text\": \"沖田は、北の壁沿いの机にメモを置いた。鉛筆も、一緒に置いた。\\n\\n〈昨夜、書庫で小池さんを助けたのは、あなたですか。\\nけがはありませんか〉\\n\\n次の朝、返事があった。いつもより字が小さかった。\\n\\n〈はい。私です。\\n棚の下で、私は一度、死んだと思います。重くて、痛くて、それから冷たくなりました。\\nでも、日の出のとき、この席で目が覚めました。けがは、ありません。どこにも〉\\n\\n二枚目があった。\\n\\n〈黙っていて、ごめんなさい。\\n書いたら、死なない人間に何ができるか、誰かが考えはじめると思いました。それが、少し怖かったんです〉\\n\\n三枚目には、一行だけ書いてあった。\\n\\n〈痛いのは、ちゃんと痛いです〉\\n\\n沖田は、三枚のメモを手帳にはさんだ。それから、鷺沼に内線をかけた。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"21\", \"tt\": \"08:30\", \"tl\": \"\"}, {\"id\": \"k5\", \"title\": \"戻る場所\", \"role\": \"三輪が戻るのは、台帳の「窓際の机の人」という一行があるから\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"k4\"], \"plants\": [\"x3\"], \"pays\": [], \"chars\": \"沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"i8\", \"w12\", \"p4\"], \"pageData\": [], \"text\": \"「死は、記録です」と鷺沼博士は言った。\\n\\n課長室の机に、メモと、監視カメラの記録と、落とし物台帳が並んでいた。\\n「誰かが死ねば、死亡の記録が作られる。でも、三輪さんは欠番です。名簿の上にいない人の死亡は、記録できない。記録できない死は、矛盾になる」\\n「矛盾は、日の出に直される」と沖田が言った。\\n「ええ。整合官は、三輪さんの死を、なかったことにした。そして、三輪さんを、ただ一つ記録されている場所へ戻した」\\n\\n鷺沼は、落とし物台帳の一行を指さした。去年の十一月、沖田が三十年ぶりに埋めた、落とし主の欄だ。\\nその行は、十二月の汚染対策で黒く塗りつぶされていた。「窓際」という言葉を含んでいたからだ。\\n鷺沼は台帳を持ち上げて、電灯の光に透かした。黒塗りの下に、沖田の字がうっすらと浮かんだ。\\n\\n落とし主：三輪栞　記録管理課の窓際の机の人\\n\\n「黒塗りは、字を読めなくするだけです。消してはいない」と鷺沼は言った。「財団の記録の中で、三輪さんがいる場所として書かれているのは、ここだけです。名簿にもない。人事記録にもない。あるのは、窓際の机の人、という一行だけ」\\n「でも、物の記録は、人がいるかどうかの根拠にはなりません。第一条の四です。だから、この一行があっても、三輪さんは欠番のまま」\\n鷺沼は、台帳をそっと机に置いた。\\n「ただ、人がいるかどうかは決められなくても、どこにいるかは書いてある。死をなかったことにしたあと、整合官が三輪さんを戻す場所は、ここしかなかった」\\n「だから、席に戻る」\\n沖田は、その一行を見下ろした。自分の字だった。書いたときには、こんな意味を持つとは思っていなかった。\\n\\n「もし、この行が消えたら」\\n「戻る場所が、なくなります」と鷺沼は言った。「そのとき三輪さんがどうなるのかは、分かりません」\\n\\nその日から、落とし物台帳は、課長室の鍵のかかる引き出しにしまわれることになった。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"21\", \"tt\": \"13:00\", \"tl\": \"\"}, {\"id\": \"k6\", \"title\": \"上からの照会\", \"role\": \"死なない職員を危険な作業に、という照会。痛みを理由に断る\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"k5\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田、鷺沼\", \"note\": \"\", \"cards\": [\"p3\", \"p8\", \"o1\", \"i13\", \"w11\"], \"pageData\": [], \"text\": \"三月二十一日の夕方、上から一通の照会が届いた。\\n\\n〈サイト-81K1の欠番職員（81K1-0411）について。致死性の環境での作業に従事させることの可否を検討し、報告されたい〉\\n\\n鷺沼は、その紙を机に置いて、長いあいだ黙っていた。\\n「来ると思っていました」\\n「三週間で返事をするの？」と沖田は聞いた。\\n「いいえ。今夜のうちに書きます」\\n\\n鷺沼は報告書を書いた。検討の結果、当該職員を致死性の環境での作業に充てることはしない。理由は三つ。一つ、当該職員は財団の職員名簿に存在せず、命令の対象にならない。二つ、SCP-VVVV-JPの補遺に記したとおり、欠番であることは道具であることを意味しない。三つ。\\n\\n三つ目を書くところで、鷺沼のペンが止まった。\\n沖田が、横から手を伸ばして、その欄に書いた。\\n\\n〈当該職員は、痛みを感じる。死ぬことはできなくても、痛みは消えない。記録に残らないだけで、本人の中には残る〉\\n\\n鷺沼は、沖田の字を読んで、うなずいた。\\n報告書は、その夜のうちに送られた。\\n返事は来なかった。少なくとも、黒塗りでない返事は。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"21\", \"tt\": \"17:00\", \"tl\": \"\"}, {\"id\": \"k7\", \"title\": \"一回ずつ\", \"role\": \"死んだら記録してほしい。財団の書類ではなく、課長の手帳に\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"k6\"], \"plants\": [], \"pays\": [\"x2\"], \"chars\": \"沖田、三輪\", \"note\": \"\", \"cards\": [\"p3\", \"p1\", \"i6\", \"w9\"], \"pageData\": [], \"text\": \"その夜、沖田はもう一枚、メモを置いた。\\n\\n〈上には、あなたを危ないところへは行かせない、と返事をしました。\\nそれでも、あなたが自分で決めて、誰かを助けることはあると思います。人形のときのように。昨夜のように。\\nそのときは、止めません。ただ、一つだけ教えてください。私に、何ができますか〉\\n\\n次の朝の返事は、少し時間をかけて書いたような字だった。\\n\\n〈ありがとうございます。\\n自分で決めたときは、行きます。決めていないときは、行きません。それでいいですか。\\n\\n一つだけ、お願いがあります。\\nもしまた、私が死んだら、記録してください。一回ずつ。\\n財団の書類には書けないのは分かっています。書いたら、矛盾になるから。だから、課長の手帳に。\\n誰も覚えていなくても、書いてあれば、なかったことにはならない気がするんです。\\nあの夜、書庫で、私は確かに痛かった。それが、どこにも残らないのは、少しさびしいので〉\\n\\n沖田は手帳を開いた。三月十九日のページは、もう埋まっていた。いちばん下の余白に、一行を足した。\\n\\n23:41　書庫。三輪さん、小池さんをかばって、一度亡くなる。痛かったそうだ。\\n\\nそれから、三月二十日のページにも。\\n\\n05:47　三輪さん、窓際の席に戻る。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"21\", \"tt\": \"23:00\", \"tl\": \"\"}, {\"id\": \"k8\", \"title\": \"戻る席\", \"role\": \"席は、何があっても朝に戻ってくる場所。窓際には、小池の花が増えていく\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"k7\"], \"plants\": [], \"pays\": [\"x3\"], \"chars\": \"三輪、宇佐見、小池、沖田\", \"note\": \"\", \"cards\": [\"p1\", \"p2\", \"p7\", \"p3\", \"i3\", \"i6\", \"pl2\"], \"pageData\": [], \"text\": \"三月二十二日、午前五時四十六分。\\n\\n窓の外が、少しずつ白くなっていく。三輪栞は、窓際の席で、その光を見ていた。死んだわけではない。ただ、座って、朝を待っていた。\\nここは、三輪の席だった。仕事をする机で、窓を見る場所で、何があっても朝には戻ってくる場所だった。\\n\\n五時四十七分。日の出。\\n三輪は、誰もいない記録管理室に向かって、小さく言った。\\n「おはようございます」\\n\\n八時半。宇佐見が缶を二本置いていった。\\n少しあとで、小池が来た。\\n人形の一件のあと、小池は週に一度、窓際に花を一輪置いていくようになっていた。あの白い菊のあと、菊を選んだことは一度もない。\\n今朝の花は、黄色だった。それと、小さなメモ。\\n小池は花とメモを机に置いて、深く頭を下げた。\\n\\n〈押してくれて、ありがとうございました。\\n額のすり傷は、もう治りかけています。三輪さんの分のけがも、僕が覚えておきます。覚えていられないなら、書いておきます〉\\n\\n三輪は、そのメモを読んで、少し笑った。黄色い花を、窓際の空き缶に挿した。空き缶の花瓶には、もう何本もの花が並んでいた。\", \"ty\": \"2027\", \"tm\": \"3\", \"td\": \"22\", \"tt\": \"05:46\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"x1\", \"name\": \"消えた丸い鉛筆\"}, {\"id\": \"x2\", \"name\": \"痛かったことは覚えている\"}, {\"id\": \"x3\", \"name\": \"台帳の「窓際の机の人」\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stL\", \"links\": [{\"id\": \"ll1\", \"a\": \"p4\", \"b\": \"p6\", \"label\": \"第一条の確認者に選ぶ\", \"st\": \"stL\"}, {\"id\": \"ll2\", \"a\": \"p6\", \"b\": \"p9\", \"label\": \"読む役目を教える\", \"st\": \"stL\"}, {\"id\": \"ll3\", \"a\": \"p4\", \"b\": \"i16\", \"label\": \"夜のうちに直す\", \"st\": \"stL\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p9\": {\"status\": \"gone\", \"statusScene\": \"\"}, \"p10\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"第一条\", \"ending\": \"1978年、身の回りを記したノート型の現実改変に、誰も書いていない行が増えていく中、記録係の葉山は記録を正としてノートを直す第一条と読み合わせを定めるが、自分を消す行を消そうとしてページを破り、いるともいないとも書かれない初めての欠番となって、整合官補として夜ごとノートを直しつづける。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"l8\"}, \"scenes\": [{\"id\": \"l1\", \"title\": \"いちばん古いページ\", \"role\": \"ノート型の現実改変SCP-TTTT-JP。2027年、小池が台帳の最初の一枚を見つける\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"y1\"], \"pays\": [], \"chars\": \"小池\", \"note\": \"\", \"cards\": [\"p7\", \"i12\", \"p4\", \"i15\", \"p6\", \"i16\"], \"pageData\": [], \"text\": \"SCP-TTTT-JP　収容記録（1978年版・抜粋）\\n\\nオブジェクトクラス：Keter\\n説明：SCP-TTTT-JPは、大学ノートほどの大きさの、表紙のない冊子です。1977年、サイト-81K1地下二階の工事中に、第3収容室の奥の壁の氷の中から発見されました。\\n各ページには、誰のものとも一致しない古い筆跡で、サイト-81K1とその周辺の事物が細かく記述されています。棚の色、廊下の数、食堂の場所、職員の名前。現実は、この記述のとおりに存在しています。\\n\\nSCP-TTTT-JPには、ときおり、誰も書いていない新しい行が現れます。新しい行が現れると、次の日の出に、現実がその行のとおりに書き換わります。書き換えは人の記憶にもおよぶため、書き換えに気づくことはできません。\\n新しい行を鉛筆で訂正すると、次の日の出に、現実は訂正のとおりに戻ります。\\n\\n――\\n\\n二〇二七年四月一日。名簿のいちばん最初のページで、葉山がまた一段、昇進していた。統括整合官。番号の欄は、やはり空いている。\\n\\n小池健太は、改訂申請台帳を、いちばん古いところまでさかのぼっていた。台帳のいちばん最初のページは、改訂ではなく、規程の制定だった。\\n\\n記録取扱規程　第一条\\n起案：葉山\\n確認者：真柴\\n\\n紙のあいだに、黄ばんだメモが一枚はさまっていた。若いころの真柴の字だった。\\n\\n〈葉山さんの机に残っていたもの。いつか、誰かが読むときのために〉\\n\\nその下に、几帳面な字の、小さな紙が重ねてあった。\", \"ty\": \"\", \"tm\": \"\", \"td\": \"\", \"tt\": \"\", \"tl\": \"2027年4月1日（いま）\"}, {\"id\": \"l2\", \"title\": \"緑色の棚\", \"role\": \"1978年、ノートに誰も書いていない一行が現れ、棚が緑になる\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"l1\"], \"plants\": [\"y2\"], \"pays\": [], \"chars\": \"真柴、葉山\", \"note\": \"\", \"cards\": [\"p6\", \"p4\", \"i16\", \"pl2\"], \"pageData\": [], \"text\": \"一九七八年二月十四日。真柴は二十二歳で、記録管理課に来て一年目だった。\\n\\nその朝、記録管理室に入ると、棚が緑色になっていた。昨日までは灰色だったはずの棚だ。\\n「前から緑だったよ」と先輩は言った。本当に、そう信じている顔だった。真柴自身も、半分はそう思っていた。\\n\\n北の壁沿いの机で、葉山が一冊のノートを開いていた。表紙のない、古い冊子だった。\\n葉山は記録管理課でいちばん几帳面な字を書く人で、このノートの係だった。毎朝、ノートを読み、サイトの現実と一行ずつ見比べる。それが仕事だった。\\n\\n「真柴さん、これを」\\n葉山が指さしたページには、古い筆跡の行が並んでいた。その途中に、一行だけ、インクの色がわずかに新しい行があった。\\n\\n記録管理室の棚は、緑色である。\\n\\n「昨日は、この行はなかった」と葉山は言った。「誰も書いていない。それなのに、今朝、棚は緑になった」\\n葉山は、自分の手帳を開いた。昨日の朝の欄に、几帳面な字で書いてある。棚、灰色。\\n「ノートのほうが変わって、現実が変わって、みんなの記憶が変わった。変わらなかったのは、昨日の私の字だけです」\", \"ty\": \"1978\", \"tm\": \"2\", \"td\": \"14\", \"tt\": \"09:00\", \"tl\": \"四十九年前\"}, {\"id\": \"l3\", \"title\": \"おかしな行\", \"role\": \"直せば戻る。けれど、おかしな行は日ごとに増え、ひとりでは追いつかない\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"l2\"], \"plants\": [], \"pays\": [], \"chars\": \"真柴、葉山\", \"note\": \"\", \"cards\": [\"p6\", \"p4\", \"i16\", \"i6\"], \"pageData\": [], \"text\": \"葉山は、鉛筆で、その行に線を引いた。横に書き直す。\\n記録管理室の棚は、灰色である。\\n\\n次の朝、棚は灰色に戻っていた。誰もそれを不思議に思わなかった。前から灰色だったと、みんなが思っていた。\\n「直せば、戻る」と葉山は言った。\\n\\nけれど、おかしな行は、それから毎日増えていった。\\n二日目は三行。廊下が一本増える行。食堂の場所が変わる行。三日目は七行。四日目は十五行。\\n葉山は、夜遅くまでノートを直しつづけた。それでも、朝になると、直した数よりも多くの新しい行が増えていた。\\n\\n五日目の朝、葉山は真柴に言った。\\n「私の手帳と、ノートの古い行と、今朝の現実が、三つとも食い違っている箇所がありました。どれが本当なのか、私にも分からない」\\n葉山の手帳も、葉山の記憶も、少しずつ書き換えられていたのだ。一人で見比べるのは、もう限界だった。\\n\\n「本当の現実の見本が要ります」と葉山は言った。「一人の記憶じゃなく、たくさんの人が読んで確かめた、財団の記録が」\", \"ty\": \"1978\", \"tm\": \"2\", \"td\": \"17\", \"tt\": \"08:00\", \"tl\": \"四十九年前\"}, {\"id\": \"l4\",
