<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ストーリーカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* 原稿用紙の作業机：ノンフォトブルーの罫線とインクの黒。左＝シーン一覧、中央＝作業面、右＝選択中のシーン */
:root{
  --paper:#f7f9fb; --sheet:#ffffff; --ink:#15181d; --muted:#5d6874; --line:#d2e1eb; --line-soft:#e6eff5;
  --blue:#4fa3d9; --blue-ink:#1b6595; --blue-wash:#e7f2f9;
  --err:#bf3a27; --err-wash:#fbe8e4; --warn:#a96600; --warn-wash:#fbf0db; --ok:#2b7a53; --info-wash:#eef1f4;
  --c-person:#b04a72; --c-place:#2f7d5c; --c-item:#9c6a12; --c-world:#6555b0; --c-episode:#1b6595; --c-memo:#66717d; --c-org:#8a5634;
  --m-paper:#efe9da; --m-sea:#c9dfec; --m-land:#e7dfc3; --m-forest:#b5d0a0; --m-mount:#cbbca2; --m-water:#98c3de; --m-desert:#ead6a0; --m-snow:#f3f6f8; --m-city:#e2c6bc; --m-road:#8a6a50; --m-river:#3f86bb; --m-border:#7a5591; --m-rail:#3d3d3d; --m-roadfill:#f6eedc; --m-floor:#f4f1ea; --m-wall:#3b3f46; --m-tatami:#d9d6a4; --m-wood:#b98d5f; --m-door:#8a6a50; --m-glass:#9fd0ea; --m-bldg:#cfc6ba; --m-railw:#ffffff;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161b; --sheet:#171d23; --ink:#e5eaef; --muted:#8e99a5; --line:#2b3742; --line-soft:#212b34;
  --blue:#6ab4e4; --blue-ink:#8ccaf0; --blue-wash:#18303f;
  --err:#ef7d6a; --err-wash:#3a1f1b; --warn:#e3a94a; --warn-wash:#352a15; --ok:#6cc79a; --info-wash:#1d242b;
  --c-person:#e88aae; --c-place:#6fc79f; --c-item:#e0b25a; --c-world:#a89cf0; --c-episode:#8ccaf0; --c-memo:#9aa5b1; --c-org:#d9a27c; --m-paper:#2a2923; --m-sea:#18303d; --m-land:#3a3727; --m-forest:#2b4027; --m-mount:#4a4033; --m-water:#245470; --m-desert:#4c4127; --m-snow:#3b4247; --m-city:#4a3530; --m-road:#c9a688; --m-river:#6db2e0; --m-border:#bb97cf; --m-rail:#cfcfcf; --m-roadfill:#5c4f40; --m-floor:#2c2e32; --m-wall:#c9ced6; --m-tatami:#5a5838; --m-wood:#8a6a48; --m-door:#d2b49a; --m-glass:#4f8fb3; --m-bldg:#55504a; --m-railw:#2a2c30; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161b; --sheet:#171d23; --ink:#e5eaef; --muted:#8e99a5; --line:#2b3742; --line-soft:#212b34;
  --blue:#6ab4e4; --blue-ink:#8ccaf0; --blue-wash:#18303f;
  --err:#ef7d6a; --err-wash:#3a1f1b; --warn:#e3a94a; --warn-wash:#352a15; --ok:#6cc79a; --info-wash:#1d242b;
  --c-person:#e88aae; --c-place:#6fc79f; --c-item:#e0b25a; --c-world:#a89cf0; --c-episode:#8ccaf0; --c-memo:#9aa5b1; --c-org:#d9a27c; --m-paper:#2a2923; --m-sea:#18303d; --m-land:#3a3727; --m-forest:#2b4027; --m-mount:#4a4033; --m-water:#245470; --m-desert:#4c4127; --m-snow:#3b4247; --m-city:#4a3530; --m-road:#c9a688; --m-river:#6db2e0; --m-border:#bb97cf; --m-rail:#cfcfcf; --m-roadfill:#5c4f40; --m-floor:#2c2e32; --m-wall:#c9ced6; --m-tatami:#5a5838; --m-wood:#8a6a48; --m-door:#d2b49a; --m-glass:#4f8fb3; --m-bldg:#55504a; --m-railw:#2a2c30; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:24px 24px;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1560px;margin:0 auto}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.story-title{flex:1 1 220px;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:18px;font-weight:700;padding:4px 2px}
.top-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);font-size:12px;white-space:nowrap}
.pill.err{border-color:var(--err);color:var(--err);background:var(--err-wash)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-wash)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
button.pill{cursor:pointer}
.ending-line{display:flex;gap:10px;align-items:baseline;margin:12px 0 0;flex-wrap:wrap}
.ending-line label{font-size:11px;letter-spacing:.1em;color:var(--blue-ink);font-weight:700;white-space:nowrap}
.ending-line input{flex:1 1 300px;min-width:0;border:1px solid var(--line);background:var(--sheet);padding:6px 10px;border-radius:4px}

/* tabs */
.stickyhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(0 -100vmax -12px -100vmax);margin-top:-16px;padding-top:16px}
.stickyhead.stuck{box-shadow:0 0 0 100vmax var(--paper),0 6px 10px -8px rgba(0,0,0,.35)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--paper)}
@media (max-width:760px){.stickyhead{position:static;margin-top:0;padding-top:0;clip-path:none;box-shadow:none}.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper)}}
.tabs{display:flex;gap:2px;margin:16px 0 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 14px;border-radius:6px 6px 0 0;white-space:nowrap;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink);margin-bottom:-1px;font-weight:700}
.tabs-sep{flex:1 0 16px}
.tabs-lab{align-self:center;font-size:10px;letter-spacing:.14em;color:var(--muted);padding:0 4px;white-space:nowrap}
.tabs button.subtab{font-size:12px;padding:6px 10px}
.treedir{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;background:var(--sheet)}
.treedir button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--ink)}
.treedir button+button{border-left:1px solid var(--line)}
.treedir button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.dead-tag{display:inline-block;margin:6px 0 0 4px;font-size:11px;color:var(--warn);font-weight:700}
.seeds{margin-top:18px;border-top:2px solid var(--ink);padding-top:10px}
.seeds h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0 0 8px}
.seeds ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seeds li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:4px;background:var(--blue-wash);font-size:13px}
@media (max-width:560px){.seeds li{grid-template-columns:minmax(0,1fr) auto}.seeds li .seed-t{grid-column:1 / -1}}
.seed-t{font-size:11px;font-weight:700;color:var(--blue-ink);letter-spacing:.06em}
.btn:disabled{opacity:.4;cursor:default}

.grid.wide{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:760px){.grid.wide{grid-template-columns:minmax(0,1fr)}}
.zpct{font-size:11px;color:var(--muted);min-width:38px;text-align:right}
.zsvg{display:block;width:100%;height:auto;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.zsvg.msvg{touch-action:none}
.zsvg.panning{cursor:grabbing}
.fn rect{fill:var(--sheet);stroke:var(--ct);stroke-width:1.6}
.fn rect.s{fill:var(--ct);stroke:none}
.fn text{fill:var(--ink);font-size:13px;font-family:var(--f-body)}
.fn.virt rect{stroke:var(--muted);stroke-dasharray:4 3;fill:var(--paper)}
.fn.virt text{fill:var(--muted)}
.fn{cursor:pointer}
.fn[data-act]:hover rect:first-of-type{stroke-width:3}
.fn text.fl-role{font-size:10px;fill:var(--muted)}
.fl-pc,.fl-sib{fill:none;stroke:var(--ink);stroke-width:1.5}
.fl-sib{stroke-dasharray:2 3}
.fl-sp{stroke:var(--ink);stroke-width:1.5}
.fl-other{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.fl-rel{font-size:11px;font-weight:700;fill:var(--blue-ink);font-family:var(--f-body);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.fl-lab{font-size:10px;fill:var(--muted);font-family:var(--f-body);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.oc-l{fill:none;stroke:var(--ink);stroke-width:1.4}
.oc-sub{stroke:var(--c-org);stroke-dasharray:6 3}
.oc-p rect{fill:var(--sheet);stroke:var(--ct);stroke-width:1.4}.oc-p rect.s{fill:var(--ct);stroke:none}
.oc-o rect{fill:var(--ct);stroke:none}
.oc-oname{fill:var(--sheet);font-weight:700;font-size:15px;font-family:var(--f-body)}
.oc-o .oc-role{fill:var(--sheet);opacity:.85}
.oc-name{fill:var(--ink);font-size:13px;font-weight:500;font-family:var(--f-body)}
.oc-role{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.oc-p,.oc-o{cursor:pointer}.oc-p:hover rect:first-of-type{stroke-width:3}
.maptabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.mapgrid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.mapwrap{flex:1 1 460px;min-width:0}
.mside{flex:1 1 240px;max-width:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
.mpanel{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mpanel h4,.mpanel summary{margin:0;font-size:12px;letter-spacing:.08em;color:var(--blue-ink);font-weight:700}
.mpanel summary{cursor:pointer}
.fld2{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.fld2>span{font-size:11px;color:var(--muted)}
.fld2 input[type=text],.fld2 select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:5px 8px;width:100%;min-width:0;color:var(--ink)}
.fld2 input[type=file]{font-size:12px;max-width:100%}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mplaces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.mplaces li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 6px;border-radius:4px;border:1px solid var(--line-soft);font-size:13px}
.mplaces li.on{border-color:var(--blue);background:var(--blue-wash)}
.mp-acts{display:flex;gap:4px}
.m-bg.bg-sea{fill:var(--m-sea)}.m-bg.bg-paper{fill:var(--m-paper)}.m-bg.bg-plain{fill:var(--sheet)}
.m-gridline{fill:none;stroke:var(--ink);stroke-opacity:.07;stroke-width:1}
.m-area{stroke:var(--ink);stroke-opacity:.3;stroke-width:1.5}
.ter-land{fill:var(--m-land)}.ter-forest{fill:var(--m-forest)}.ter-mountain{fill:var(--m-mount)}.ter-water{fill:var(--m-water)}.ter-desert{fill:var(--m-desert)}.ter-snow{fill:var(--m-snow)}.ter-city{fill:var(--m-city)}
.legend i.ter-sw{border:1px solid var(--line)}
.m-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ls-road{stroke:var(--m-road);stroke-width:4;stroke-dasharray:10 5}
.ls-river{stroke:var(--m-river)}
.ls-border{stroke:var(--m-border)}
.ls-rail{stroke:var(--m-rail);stroke-linecap:butt!important}
.ls-rail-w{fill:none;stroke:var(--m-railw);stroke-linecap:butt}
.m-station{fill:var(--sheet);stroke:var(--m-rail);stroke-width:2.2}
.mi.msel .m-station{stroke:var(--blue);stroke-width:3}
.m-slabel{font-family:var(--f-body);font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.m-hit{fill:none;stroke:var(--blue);stroke-opacity:0;stroke-width:16}
.m-pin{fill:var(--c-place);stroke:var(--sheet);stroke-width:2.5}
.m-pin.fac{fill:var(--c-org)}
.m-pin-dot{fill:var(--sheet)}
.m-plabel,.m-alabel,.m-llabel{font-family:var(--f-body);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round;font-weight:700}
.m-alabel{font-size:15px;letter-spacing:.1em}
.m-llabel{font-size:12px;font-weight:500}
.mi{cursor:move}
.msvg.mtool-pin,.msvg.mtool-area,.msvg.mtool-line,.msvg.mtool-pin .mi,.msvg.mtool-area .mi,.msvg.mtool-line .mi{cursor:crosshair}
.mi.msel .m-area{stroke:var(--blue);stroke-opacity:1;stroke-width:3;stroke-dasharray:7 4}
.mi.msel .m-pin{stroke:var(--blue);stroke-width:4}
.mi.msel .m-hit{stroke-opacity:.25}
.m-handle{fill:var(--sheet);stroke:var(--blue);stroke-width:2;cursor:nwse-resize}
.m-temp{fill:var(--blue);fill-opacity:.12;stroke:var(--blue);stroke-dasharray:6 4}
.m-rubber{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.m-drawing,.m-vtx{pointer-events:none}
.m-vtx{fill:var(--sheet);stroke:var(--blue);stroke-width:2}
.m-compass{pointer-events:none}
.m-compass circle{fill:var(--sheet);fill-opacity:.8;stroke:var(--ink);stroke-opacity:.4}
.m-compass path{fill:var(--muted)}.m-compass path.n{fill:var(--err)}
.m-compass text{font-family:var(--f-mono);font-size:12px;fill:var(--ink);font-weight:700}

.m-road-case{fill:none;stroke:var(--m-road);stroke-linecap:round;stroke-linejoin:round}
.m-road-fill{fill:none;stroke:var(--m-roadfill);stroke-linecap:round;stroke-linejoin:round}
.m-road-case.sel{stroke:var(--blue)}
.m-railing{fill:none;stroke:var(--m-wall);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.m-bridge-shadow{fill:none;stroke:#000;stroke-opacity:.18;stroke-linecap:butt}
.m-roth{fill:var(--sheet);stroke:var(--blue);stroke-width:2;cursor:grab}
.m-rotline{stroke:var(--blue);stroke-width:1.2;stroke-dasharray:3 3;pointer-events:none}
.tfbar{display:flex;flex-wrap:wrap;gap:4px}
.pdfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}
.msvg.notemode .mi,.msvg.notemode .m-roads{pointer-events:none}
.notes:not(.live){pointer-events:none}
.n-hit{fill:transparent;stroke:transparent;fill-opacity:0}
.note.nsel{filter:drop-shadow(0 0 2px var(--blue)) drop-shadow(0 0 4px var(--blue))}
.msvg.ntool-select .note{cursor:move}.msvg.ntool-erase .note{cursor:not-allowed}
.msvg.ntool-pen,.msvg.ntool-arrow,.msvg.ntool-text,.msvg.ntool-icon{cursor:crosshair}
.n-temp{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#n-tline{stroke-linecap:round;pointer-events:none;stroke-dasharray:6 4}
.notebar{background:var(--warn-wash);border:1px solid var(--warn);border-radius:6px;padding:6px 8px}
.ncolors{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0}
.nc.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink)}
.nicons{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:4px}
.modesw button[aria-pressed="true"]{background:var(--blue-ink)!important;color:var(--sheet)!important}
.cimg{margin:2px -12px 2px;aspect-ratio:4/3;max-width:calc(100% + 24px);overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.wk{text-decoration:underline dotted;text-decoration-color:var(--c-world);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:2px}.wk:hover,.wk:focus{background:color-mix(in srgb,var(--c-world) 14%,transparent);outline:none}
.wkc{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);text-underline-offset:3px;cursor:pointer}.wkc:hover,.wkc:focus{background:var(--paper);outline:none}
#wktip{position:fixed;z-index:60;display:none;background:var(--sheet,#fff);color:var(--ink,#15181d);border:1px solid var(--line,#d2e1eb);border-left:3px solid var(--c-world,#6555b0);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:12px;line-height:1.6;pointer-events:none}#wktip.on{display:block}
#wktip b{font-size:13px}#wktip .wt-cat{margin-left:6px;font-size:10px;padding:0 6px;border-radius:99px;background:var(--paper,#eef4f8);color:var(--muted,#5d6874)}#wktip .wt-al{color:var(--muted,#5d6874);font-size:11px}#wktip .wt-b{margin-top:4px;white-space:pre-wrap}#wktip .wt-f{margin-top:4px;color:var(--c-world,#6555b0);font-size:10px}
.wkgrid{display:grid;grid-template-columns:minmax(180px,260px) minmax(0,1fr);gap:14px;margin-top:10px;align-items:start}
@media (max-width:760px){.wkgrid{grid-template-columns:1fr}}
.wklist{border:1px solid var(--line);border-radius:6px;padding:6px;max-height:70vh;overflow:auto}
.wkg{margin-bottom:6px}.wkg-h{font-size:11px;font-weight:700;color:var(--muted);padding:4px 6px;display:flex;justify-content:space-between}
.wkitem{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:4px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}.wkitem small{display:block;font-size:10px}.wkitem:hover{background:var(--paper)}.wkitem.on{background:color-mix(in srgb,var(--c-world) 14%,transparent);font-weight:700}
.wkdetail{border:1px solid var(--line);border-top:3px solid var(--c-world);border-radius:6px;padding:12px 14px;min-width:0}.wk-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wk-h h3{margin:0;font-size:18px}
.wkbody{white-space:pre-wrap;line-height:1.85;font-size:14px;margin:6px 0 10px}.wksec{margin-top:10px;font-size:12px;display:flex;flex-direction:column;gap:4px}.wksec .chips{display:flex;flex-wrap:wrap;gap:4px}

.ter-building{fill:var(--m-bldg)}
.m-area.ter-building{stroke-opacity:.65;stroke-width:1.8}
.m-guide{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:4 4;pointer-events:none}
.m-snapw{fill:none;stroke:var(--blue);stroke-width:2.5;pointer-events:none}
.m-area.ter-floor{stroke-opacity:.5}
.m-vh{fill:var(--sheet);stroke:var(--blue);stroke-width:2;cursor:move}
.m-mid{fill:var(--blue);fill-opacity:.35;stroke:var(--blue);stroke-width:1;cursor:copy}
.m-drawpoly{fill:var(--blue);fill-opacity:.1;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.m-tlabel{font-family:var(--f-display);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round;letter-spacing:.06em}
.m-tsel{fill:none;stroke:var(--blue);stroke-dasharray:4 3}
.m-gridline.strong{stroke-opacity:.16}
.msvg.mtool-paint,.msvg.mtool-erase,.msvg.mtool-wall,.msvg.mtool-text,.msvg.mtool-poly,.msvg.mtool-paint .mi,.msvg.mtool-erase .mi,.msvg.mtool-wall .mi,.msvg.mtool-text .mi,.msvg.mtool-poly .mi{cursor:crosshair}
.m-wall{stroke:var(--m-wall);stroke-linecap:square;fill:none}
.m-wall.prev{stroke:var(--blue);stroke-opacity:.8}
.m-snap{fill:var(--blue);pointer-events:none}
.tl-floor{fill:var(--m-floor);stroke:var(--line);stroke-width:.5}
.tl-wall{fill:var(--m-wall)}
.tl-door{fill:none;stroke:var(--m-door);stroke-width:1.5}
.tl-doorleaf{stroke:var(--m-door);stroke-width:2.5}
.tl-window{fill:var(--m-glass);stroke:var(--m-wall);stroke-width:1}
.tl-step{stroke:var(--muted);stroke-width:1.2}
.tl-arrow{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tl-tatami{fill:var(--m-tatami);stroke:var(--m-wood);stroke-width:1}
.tl-tline{stroke:var(--m-wood);stroke-width:.8;opacity:.6}
.tl-table{fill:var(--m-wood);stroke:var(--m-wall);stroke-width:.8}
.tl-water{fill:var(--m-water)}
.tl-wave{fill:none;stroke:var(--sheet);stroke-width:1.2;opacity:.8}
.tl-grass{fill:var(--m-forest)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 2px;font-size:11px;color:var(--ink)}
.pal.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-wash);background:var(--sheet);font-weight:700}
.pal svg{border:1px solid var(--line)}
.mtools{flex-wrap:wrap}
.legend svg{vertical-align:middle}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;margin-left:4px;color:var(--err)}

/* layout */
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:220px minmax(0,1fr)}.editor{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.side,.editor{position:sticky;top:calc(var(--headh,0px) + 12px);max-height:calc(100vh - var(--headh,0px) - 24px);overflow:auto}
@media (max-width:1180px){.editor{position:static;max-height:none}}
@media (max-width:760px){.side{position:static;max-height:340px}}
.box-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--blue-ink)}
.main{min-width:0}
.sec{padding:16px}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:65ch;font-size:13px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--sheet);padding:5px 10px;border-radius:4px;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);color:var(--sheet);border-color:var(--err)}
.btn.sm{padding:2px 7px;font-size:11px}
.ibtn{border:0;background:transparent;padding:2px 5px;color:var(--muted);border-radius:3px}
.ibtn:hover{background:var(--blue-wash);color:var(--ink)}

/* scene list */
.scenes{list-style:none;margin:0;padding:6px}
.sc{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 6px;align-items:start;padding:7px 6px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
.sc:hover{background:var(--blue-wash)}
.sc.sel{background:var(--blue-wash);border-left-color:var(--blue)}
.sc .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.sc .t{font-weight:500;overflow-wrap:anywhere;line-height:1.4}
.sc .m{grid-column:2;font-size:11px;color:var(--muted)}
.sc .mv{grid-row:1 / span 2;grid-column:3;display:flex;flex-direction:column}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.tag-end{font-size:10px;padding:0 5px;border:1px solid var(--ink);border-radius:2px;margin-left:4px;font-weight:700}

/* editor */
.fld{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.fld>span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
.fld textarea{min-height:60px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 90px;gap:8px}
.checks{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto}
.checks label{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:2px 0}
.checks label .later{color:var(--warn);font-size:11px}
.fs-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.fs-row label{font-size:11px;display:flex;gap:3px;align-items:center;color:var(--muted)}
.inline{display:flex;gap:6px}
.inline input{flex:1;min-width:0}
.ed-acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.consq{font-size:12px;color:var(--muted)}

/* reverse tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:22px;padding-left:16px;border-left:2px dashed var(--line)}
.tree li{position:relative;padding-top:10px}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:30px;width:14px;border-top:2px dashed var(--line)}
.node{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;cursor:pointer;max-width:560px}
.node:hover{border-color:var(--blue)}
.node.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-wash)}
.node.end{border:2px solid var(--ink)}
.node-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node-top b{font-size:15px}
.node .role{font-size:13px;color:var(--muted);margin-top:2px}
.node-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.node-acts select{border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:12px;padding:3px 6px;max-width:100%}
.kicker{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--blue-ink)}
.root-tag{display:inline-block;margin:6px 0 0 4px;font-size:11px;color:var(--ok);font-weight:700}
.ref{font-size:12px;color:var(--muted);padding:8px 0 0 4px}
.orphans{margin-top:24px;padding:12px;border:1px dashed var(--warn);border-radius:6px;background:var(--warn-wash)}
.orphans b{color:var(--warn)}

/* structure */
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.ctrls label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.ctrls select,.ctrls input[type=number]{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 6px;color:var(--ink)}
.ctrls input[type=number]{width:70px}
.ruler-wrap{overflow-x:auto;padding-bottom:6px}
.ruler{position:relative;min-width:560px;height:150px;margin:0 4px}
.r-beat{position:absolute;top:0;bottom:44px;border-left:1px dashed var(--blue)}
.r-beat span{position:absolute;top:0;left:3px;font-size:11px;color:var(--blue-ink);white-space:nowrap;background:var(--sheet);padding:0 3px}
.r-beat:nth-child(even) span{top:18px}
.r-track{position:absolute;left:0;right:0;bottom:22px;height:40px;background:var(--paper);border:1px solid var(--line)}
.r-scene{position:absolute;top:0;bottom:0;border-right:2px solid var(--sheet);background:var(--blue-wash);color:var(--ink);font-size:11px;padding:2px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;line-height:1.3}
.r-scene.sel{background:var(--blue);color:var(--sheet)}
.r-scene.nob{background:var(--info-wash)}
.r-over{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--err-wash) 0 6px,transparent 6px 12px);border-left:2px solid var(--err)}
.r-ticks{position:absolute;left:0;right:0;bottom:0;height:20px}
.r-ticks span{position:absolute;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--f-mono)}
.tbl-wrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;border-bottom:1px solid var(--ink);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line-soft);padding:6px 8px;vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blue-wash)}
.drift-w{color:var(--warn);font-weight:700}

/* panels */
.spreads{display:flex;flex-direction:column;gap:18px}
.spread{display:flex;flex-direction:row-reverse;gap:0;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.spread>*{flex:1 1 0;min-width:0}
.spread>*+*{border-right:2px solid var(--ink)}
@media (max-width:900px){.spread{flex-direction:column}.spread>*+*{border-right:0;border-top:2px solid var(--ink)}}
.pg{padding:10px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;background:var(--sheet)}
.pg.ghost{background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;min-height:80px}
.pg-head{grid-column:1 / -1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pg-head .no{font-family:var(--f-mono);font-weight:500;font-size:15px}
.side-tag{font-size:11px;padding:0 6px;border-radius:2px;background:var(--info-wash);color:var(--muted)}
.side-tag.turn{background:var(--blue);color:var(--sheet)}
.side-tag.hook{background:var(--ink);color:var(--sheet)}
.thumb{aspect-ratio:1 / 1.414;width:84px;max-width:100%;border:1px solid var(--ink);background:var(--sheet);padding:4px;display:flex;flex-direction:column;gap:3px}
.thumb .tr{display:flex;flex-direction:row-reverse;gap:3px;min-height:0}
.thumb .tc{flex:1;border:1px solid var(--ink);font-family:var(--f-mono);font-size:8px;display:flex;align-items:flex-start;justify-content:flex-end;padding:1px 2px;min-width:0}
.thumb .empty{flex:1;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.plist li{display:grid;grid-template-columns:18px 50px minmax(0,1fr) 22px;gap:4px;align-items:center}
.plist .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.plist select,.plist input{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:3px 4px;font-size:12px;min-width:0;width:100%}
.pcount{font-size:11px;color:var(--muted);margin-left:auto}
.pcount.over{color:var(--warn);font-weight:700}

/* templates */
.tpl-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:700px){.tpl-grid{grid-template-columns:minmax(0,1fr)}}
.tpl-list{display:flex;flex-direction:column;gap:2px}
.tpl-list button{text-align:left;border:1px solid transparent;background:transparent;padding:7px 10px;border-radius:4px}
.tpl-list button.sel{background:var(--blue-wash);border-color:var(--line);font-weight:700}
.tpl-list .using{font-size:10px;color:var(--blue-ink);margin-left:4px}
.beatbar{position:relative;height:34px;border:1px solid var(--line);background:var(--paper);margin:10px 0 18px;min-width:0}
.beatbar i{position:absolute;top:-1px;bottom:-1px;border-left:2px solid var(--blue)}
.beatbar i b{position:absolute;top:100%;left:-3px;font-style:normal;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.btable input,.btable textarea{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:4px 6px;width:100%;min-width:0;font-size:13px}
.btable textarea{min-height:34px;resize:vertical}
.btable td:nth-child(2){width:80px}

/* check */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sum div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--sheet)}
.sum b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.1}
.sum span{font-size:12px;color:var(--muted)}
.sum .e b{color:var(--err)}.sum .w b{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:2px 10px;font-size:12px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issue{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:4px;border-left:4px solid var(--line);background:var(--info-wash)}
.issue.err{border-left-color:var(--err);background:var(--err-wash)}
.issue.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.issue .lv{font-size:11px;font-weight:700}
.issue.err .lv{color:var(--err)}.issue.warn .lv{color:var(--warn)}.issue.info .lv{color:var(--muted)}
.issue .cat{font-size:10px;color:var(--muted);display:block}
.ok-note{padding:16px;border:1px solid var(--ok);border-radius:6px;color:var(--ok)}

/* data dialog */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dialog{background:var(--sheet);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px}
.dialog h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400}
.dialog textarea{width:100%;min-height:220px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:99px;font-size:13px;z-index:30}
.empty-note{padding:24px;color:var(--muted);text-align:center}
/* cards */
.t-person{--ct:var(--c-person)}.t-place{--ct:var(--c-place)}.t-item{--ct:var(--c-item)}.t-world{--ct:var(--c-world)}.t-episode{--ct:var(--c-episode)}.t-memo{--ct:var(--c-memo)}.t-org{--ct:var(--c-org)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--ct);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;
  background-image:repeating-linear-gradient(transparent 0 23px,var(--line-soft) 23px 24px);background-origin:content-box}
.card:hover{box-shadow:0 2px 0 var(--line)}
.card.picked{box-shadow:0 0 0 2px var(--blue)}
.card.editing{grid-column:1 / -1;cursor:default;background-image:none;gap:8px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:24px}
.card.editing .card-top{padding-right:0}
.ctype{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ct)}
.pick{position:absolute;top:8px;right:8px;display:flex}
.card h3{margin:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.cbody{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.ctags{font-size:11px;color:var(--blue-ink);overflow-wrap:anywhere}
.cuse{font-size:11px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cuse.unused{color:var(--warn)}
.card.editing input,.card.editing textarea,.card.editing select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
.card.editing select{width:auto}
.card.editing .ctitle-in{font-size:16px;font-weight:700}
.card.editing textarea{min-height:90px;resize:vertical}
.card-acts{display:flex;gap:8px;flex-wrap:wrap}
.pickbar{position:sticky;top:calc(var(--headh,0px) + 8px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--ink);color:var(--sheet);border-radius:6px;margin-bottom:12px}
.pickbar .btn{background:var(--sheet);color:var(--ink);border-color:var(--sheet)}
.pickbar .btn.ghostb{background:transparent;color:var(--sheet)}
.cchips{display:flex;flex-wrap:wrap;gap:4px}
.cchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-left:3px solid var(--ct);border-radius:3px;background:var(--paper);font-size:12px;max-width:100%}
.cchip-b{border:0;background:transparent;padding:2px 6px;text-align:left;overflow-wrap:anywhere}
.node-cards{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.node-cards span{font-size:11px;border-left:3px solid var(--ct);padding:0 6px;background:var(--paper)}
.sc.drop-on{outline:2px dashed var(--blue);background:var(--blue-wash)}
.dropnew{margin:6px;padding:12px;border:2px dashed var(--line);border-radius:6px;font-size:12px;color:var(--muted);text-align:center}
.dropnew.drop-on{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-wash)}
.search{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 8px;min-width:0;flex:1 1 160px;max-width:260px}
/* tags */
.tagpanel{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;margin-bottom:12px}
.tp-head{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tp-head b{font-size:12px;letter-spacing:.08em;color:var(--blue-ink)}
.tp-list{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow:auto}
.tp-on{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.tagchip{display:inline-flex;align-items:center;gap:2px}
.tagchip.on{background:var(--blue);color:var(--sheet);border-color:var(--blue)}
.tagchip .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:3px}
.tagchip.on .n{color:var(--sheet)}
.tagchip .x{border:0;background:transparent;color:inherit;padding:0 0 0 2px;font-size:12px;line-height:1;cursor:pointer}
.tagchip.new{border-style:dashed}
.tagb{border:0;background:transparent;color:var(--blue-ink);padding:0 2px;font-size:11px;cursor:pointer}
.tagb:hover{text-decoration:underline}
.tagedit{border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.card.editing .tagedit input{border:0;background:transparent;padding:2px 0}
.tagsug{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;color:var(--muted);max-height:96px;overflow:auto}

", \"title\": \"慰霊碑の名前\", \"role\": \"宇佐見の花の行き先。碑に彫られているのは宇佐見の名前\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"s3\"], \"plants\": [], \"pays\": [\"f2\"], \"chars\": \"三輪、宇佐見\", \"note\": \"\", \"cards\": [\"p1\", \"p2\", \"p5\", \"pl4\", \"e2\"], \"pageData\": [], \"text\": \"夕方、三輪は宇佐見を探した。\\n宇佐見は、サイトの中庭の慰霊碑の前にいた。殉職した職員の名前が、黒い石に刻まれている。白い菊は、そこに供えられていた。\\n\\n「三年前の今日な」と、宇佐見は言った。「相棒が死んだんだ。佐伯っていう、俺より若いやつ」\\n低温収容棟の扉が凍りついて、二人で中に閉じこめられた。助けが来たとき、息をしていたのは宇佐見だけだった。\\n\\n「ほら」\\n宇佐見は碑のいちばん下の行を指さした。\\nそこには、宇佐見恭平、と刻まれていた。\\n\\n「笑えないだろ。手違いだってさ。何度言っても直らない。佐伯の名前はどこにもないのに、俺の名前だけ彫ってある」\\n宇佐見は、自分の名前の上に花を置いた。\\n「だから、ここに来るんだ。この下にいるのは、本当はあいつだからな」\\n\\n三輪は、自分が何をしたのかを、そのとき初めて全部知った。\\n三年前に死んだのは佐伯健吾だ。けれど書類の上では、宇佐見が死んで、佐伯は「退職」したことになった。佐伯の母親は、息子がどこで死んだのかも知らされていない。\\nそして今夜、書類のほうが正しくなろうとしている。\\n\\n「宇佐見さん」\\n「ん？」\\n「……明日の朝も、コーヒー、持ってきてください」\\n宇佐見は不思議そうに笑って、いいよ、と言った。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"16\", \"tt\": \"18:30\", \"tl\": \"\"}, {\"id\": \"s6\", \"title\": \"書類を組み上げる\", \"role\": \"原因から結果へ、宇佐見が生きている理由を積み上げる\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"s4\", \"s5\"], \"plants\": [], \"pays\": [\"f4\"], \"chars\": \"三輪、沖田\", \"note\": \"\", \"cards\": [\"p1\", \"p3\", \"pl3\", \"e1\", \"w2\"], \"pageData\": [], \"text\": \"夜十時。書庫の明かりをつけたのは、三輪ひとりだった。\\n\\n整合官が書き換えるのは、矛盾だけだ。だったら、宇佐見が生きていることのほうに、矛盾のない理由を積み上げればいい。\\n\\n一枚目。低温収容棟の入退室ログ。午前〇時四十二分、職員証が二枚通っている。0383と0388。二人とも中に入った記録はあった。\\n二枚目。医療部門の記録。医療部は番号ではなく名前で書く。「宇佐見恭平、凍傷、全治六週間」「佐伯健吾、死亡確認」。正しいことは、最初からここに書いてあった。\\n三枚目。遺体の処理記録。番号は0383。名前の欄は空白だった。誰かがおかしいと思いながら、空けたままにしていたのだ。\\n\\n一枚ずつ、原因から結果へ。三輪は付箋を並べ、線でつないでいく。\\n入室ログがあるから、二人がそこにいた。医療記録があるから、生きていたのは宇佐見だ。処理記録があるから、死んだのは佐伯だ。\\nだから、事故報告書の0388は、0383の誤り。\\n\\n午前三時。改訂報告の下書きができた。佐伯の母親への通知書も添えた。慰霊碑の名前の訂正願いも添えた。\\n課長承認の欄に、いつのまにか電子印が押されていた。沖田礼子。押された時刻は、午前二時五十八分。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"16\", \"tt\": \"22:00\", \"tl\": \"\"}, {\"id\": \"s7\", \"title\": \"最後の矛盾\", \"role\": \"矛盾が三輪自身に移る。整合官が「作成者なし」を差し出す\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"s6\"], \"plants\": [], \"pays\": [], \"chars\": \"三輪、葉山\", \"note\": \"\", \"cards\": [\"p1\", \"p4\", \"i1\"], \"pageData\": [], \"text\": \"午前四時十分。三輪は最後の確認をしていた。\\n\\n改訂の規則には、一行だけ見落としていた条文があった。\\n――誤記による改訂は、誤記を行った作成者の記録を添えること。\\n\\n事故報告書81K1-114の作成者は、三輪栞だ。三年前の三輪は「死亡者は宇佐見」と書いた。今夜の三輪は「死亡者は佐伯」と書く。\\n同じ作成者が、同じ事故について、正反対のことを言っている。\\n矛盾は、もう宇佐見の上にはなかった。三輪の上に移っていた。\\n\\n画面の中で、カーソルが勝手に動いた。\\n改訂報告の下書きのいちばん下に、一行が足されていく。三輪の打ったものではない。見たことのない、几帳面な筆跡の文字だった。\\n\\n〈最も簡単な整合：作成者　該当者なし〉\\n\\n作成者がいなければ、三年前の報告書は、誰も書かなかった書類になる。誰も書かなかった書類は、何も主張しない。宇佐見は生き、佐伯は正しく死ぬ。矛盾はどこにも残らない。\\nただ、三輪栞という職員が、最初からいなかったことになるだけだ。\\n\\n三輪は、名簿の空き番号を思い出した。0412と0413。\\n欠番よ。気にしなくていいの。\\n\\n三輪は、長いあいだ画面を見ていた。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"17\", \"tt\": \"04:10\", \"tl\": \"\"}, {\"id\": \"s8\", \"title\": \"署名\", \"role\": \"消えることを選び、名前を書いてから送る\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"s7\"], \"plants\": [], \"pays\": [], \"chars\": \"三輪\", \"note\": \"\", \"cards\": [\"p1\", \"pl2\"], \"pageData\": [], \"text\": \"午前四時五十五分。日の出まで、あと七分。\\n\\n三輪は、整合官の書いた一行を消さなかった。その下に、自分の手で一行を足した。\\n\\n〈作成者　研究員補　三輪栞　81K1-0411〉\\n〈備考：本件の矛盾は、作成者が引き受けます。宇佐見恭平は生きています〉\\n\\n消えるなら、名前を書いてから消えたかった。誰も書かなかった書類ではなく、三輪栞が間違えて、三輪栞が直した書類として残したかった。\\n送信のボタンを押す。受付番号が返ってくる。\\n\\n書庫の蛍光灯が、一度だけまたたいた。\\n地上のどこかで、日が昇ったのだと思った。\\n\\n誰もいないはずの記録管理室で、プリンターが動きだした。紙が一枚だけ、ゆっくりと出てくる。\\n三輪は、それを取りに行く力が残っていなかった。机に頭をのせて、目を閉じた。\\n最後に考えたのは、明日の朝、缶コーヒーが一本余ってしまうな、ということだった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"17\", \"tt\": \"04:55\", \"tl\": \"\"}, {\"id\": \"s9\", \"title\": \"欠番\", \"role\": \"宇佐見は生き、三輪は記録から消える。それでもコーヒーは二本届く\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"s8\"], \"plants\": [], \"pays\": [\"f1\", \"f3\"], \"chars\": \"三輪、宇佐見、沖田、葉山\", \"note\": \"\", \"cards\": [\"p1\", \"p2\", \"p3\", \"p4\", \"i2\", \"i3\", \"pl4\"], \"pageData\": [], \"text\": \"目を覚ますと、八時だった。三輪は記録管理室の机にいた。消えてはいなかった。\\n\\nプリンターの紙を手に取る。\\n改訂報告　受理。事故報告書81K1-114、死亡者を81K1-0383　佐伯健吾に訂正。\\n作成者の欄は、黒く塗りつぶされていた。その横に、あの几帳面な筆跡で、二文字だけ書いてあった。\\n\\n〈欠番〉\\n\\nその下に、もう一行。\\n〈整合官補に任ず〉\\n\\n廊下で、沖田とすれ違った。\\n「おはようございます、課長」\\n沖田は立ち止まって、三輪の顔を少し見た。それから、知らない人に会釈するように軽く頭を下げて、行ってしまった。\\n三輪は自分の職員証を見た。名前の欄は白く抜けて、番号だけが残っていた。81K1-0411。名簿をめくると、その行には「欠番」とあった。\\n名簿のいちばん最初のページ。主任整合官　葉山。そのすぐ下に、昨日まではなかった行がある。整合官補――名前はない。\\n\\n八時半。廊下の向こうから靴音が来る。\\n「おはよう、三輪さん」\\n宇佐見が、缶コーヒーを二本持って立っていた。\\n「聞いてくれよ。慰霊碑の名前、直ってたんだ。佐伯って、ちゃんと彫ってあった。朝一番に見てきた」\\n宇佐見はうれしそうに一本を差し出した。三輪の名前を、当たり前のように呼んで。\\n\\n三輪は缶を受け取った。まだ温かかった。\\n財団のどの記録にも、三輪栞の名前はもうない。\\nそれでも毎朝八時半に、缶コーヒーが二本届く。それが、彼女に残ったたった一つの記録だった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"17\", \"tt\": \"08:30\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"f1\", \"name\": \"葉山の昇進\"}, {\"id\": \"f2\", \"name\": \"宇佐見の白い菊\"}, {\"id\": \"f3\", \"name\": \"名簿の空き番号\"}, {\"id\": \"f4\", \"name\": \"にじんだ数字\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}], \"cards\": [{\"id\": \"p1\", \"type\": \"person\", \"title\": \"三輪\", \"body\": \"三輪栞。記録管理課の研究員補で、職員番号は81K1-0411。毎朝、決まった書類を読み返していた。事件のあと「欠番」になり、整合官補として窓際の机に座っている。物には触れるが、眠気も空腹もない。致命傷を受けても、次の日の出に窓際の席で目を覚ます。痛みは感じる。\", \"tags\": \"記録管理課、欠番、26歳\", \"gender\": \"female\", \"work\": {\"place\": \"pl2\", \"text\": \"\"}, \"orgs\": [{\"card\": \"o2\", \"name\": \"\", \"role\": \"研究員補\"}], \"friends\": [{\"card\": \"p2\", \"name\": \"\", \"role\": \"毎朝コーヒーをもらう\"}], \"birthY\": \"2000\", \"statusNote\": \"「落とし主」では欠番（目には見えるが覚えていられない）\"}, {\"id\": \"p2\", \"type\": \"person\", \"title\": \"宇佐見\", \"body\": \"宇佐見恭平。41歳。保安部門の警備員で、職員番号は81K1-0388。三年前の収容違反をただ一人生き延びた。毎朝八時半に缶コーヒーを持ってくる。\", \"tags\": \"保安部門、警備員、41歳\", \"gender\": \"male\", \"orgs\": [{\"card\": \"o3\", \"name\": \"\", \"role\": \"警備員\"}], \"friends\": [{\"card\": \"p5\", \"name\": \"\", \"role\": \"相棒\"}, {\"card\": \"p1\", \"name\": \"\", \"role\": \"毎朝コーヒーを手渡す\"}], \"birthY\": \"1985\"}, {\"id\": \"p3\", \"type\": \"person\", \"title\": \"沖田\", \"body\": \"沖田礼子。54歳。記録管理課の課長。覚えていることは信用せず、自分の挨拶まで手帳に書く。「私たちは記録する部署よ」が口ぐせ。整合官のことを、同僚のように話す。\", \"tags\": \"記録管理課、課長、手帳\", \"gender\": \"female\", \"orgs\": [{\"card\": \"o2\", \"name\": \"\", \"role\": \"課長\"}], \"birthY\": \"1972\", \"friends\": [{\"card\": \"p6\", \"name\": \"\", \"role\": \"元上司\"}, {\"card\": \"p1\", \"name\": \"\", \"role\": \"部下\"}, {\"card\": \"p9\", \"name\": \"\", \"role\": \"同期\"}]}, {\"id\": \"p4\", \"type\": \"person\", \"title\": \"葉山\", \"body\": \"SCP-XXXX-JP「整合官」。もとは1978年の記録管理課の記録係で、現実改変のノートSCP-TTTT-JPの係だった。記録取扱規程第一条を起案。ノートのページが破れ、いるともいないとも書かれない初めての欠番になり、整合官補に任じられた。改訂報告を見て、夜のうちにノートを直している。職員番号の制度ができる前だったので、番号の欄は空いている。几帳面な字を書く。1996年に整合官に上がってからは、毎年四月一日に一段ずつ昇進し、2027年には統括整合官。\", \"tags\": \"SCP、整合官、異常\", \"gender\": \"\", \"orgs\": [{\"card\": \"o1\", \"name\": \"\", \"role\": \"主任整合官\"}]}, {\"id\": \"p5\", \"type\": \"person\", \"title\": \"佐伯\", \"body\": \"佐伯健吾。保安部門の警備員で、職員番号は81K1-0383。2023年11月16日、第3収容室で亡くなった。宇佐見に上着をかけ、そのあと朝まで黙っていたらしい。29歳。母はパンを焼くのが上手。\", \"tags\": \"保安部門、警備員\", \"gender\": \"male\", \"orgs\": [{\"card\": \"o3\", \"name\": \"\", \"role\": \"警備員\"}], \"family\": [{\"card\": \"p7\", \"name\": \"\", \"role\": \"弟\"}, {\"card\": \"\", \"name\": \"小池澄江\", \"role\": \"母\"}], \"statusNote\": \"三年前の収容違反で死亡（記録上は退職）\", \"status\": \"dead\", \"statusScene\": \"\"}, {\"id\": \"pl1\", \"type\": \"place\", \"title\": \"サイト-81K1\", \"body\": \"財団の日本支部の研究・収容サイト。地上は普通の研究所に見える。\", \"tags\": \"財団、サイト\", \"country\": \"日本\"}, {\"id\": \"pl2\", \"type\": \"place\", \"title\": \"記録管理室\", \"body\": \"地下二階の窓のない部屋。灰色の棚が奥まで並び、プリンターが一台ある。北の壁沿いの机は三輪の席。ある人たちには、その北の壁に窓が見えるという。\", \"tags\": \"記録管理課、地下\", \"facility\": true, \"loc\": {\"place\": \"pl1\", \"text\": \"地下二階\"}, \"env\": \"地下\"}, {\"id\": \"pl3\", \"type\": \"place\", \"title\": \"書庫\", \"body\": \"記録管理室の奥にある書庫。鍵は課長が持っている。\", \"tags\": \"記録管理課、地下\", \"facility\": true, \"loc\": {\"place\": \"pl1\", \"text\": \"地下二階の奥\"}, \"env\": \"地下\"}, {\"id\": \"pl4\", \"type\": \"place\", \"title\": \"慰霊碑\", \"body\": \"中庭にある黒い石の碑。殉職した職員の名前が刻まれている。名前は事故報告書をもとに彫られる。\", \"tags\": \"中庭、殉職\", \"facility\": true, \"loc\": {\"place\": \"pl1\", \"text\": \"中庭\"}, \"env\": \"\"}, {\"id\": \"pl5\", \"type\": \"place\", \"title\": \"低温収容棟\", \"body\": \"地下二階の低温収容棟。第3収容室はSCP-WWWW-JP「霜の部屋」で、話した言葉が霜の文字として壁に残る。2023年11月16日、ここで佐伯が亡くなった。のちに「原本室」になる。\", \"tags\": \"収容棟、地下、SCP-WWWW-JP\", \"facility\": true, \"loc\": {\"place\": \"pl1\", \"text\": \"B2\"}, \"env\": \"地下、低温\"}, {\"id\": \"o1\", \"type\": \"org\", \"title\": \"SCP財団\", \"body\": \"異常な物品・存在を確保し、収容し、保護する組織。\", \"tags\": \"財団\", \"base\": {\"place\": \"pl1\", \"text\": \"\"}, \"orgRels\": [], \"ranks\": [\"主任整合官\", \"整合官\", \"整合官補\"]}, {\"id\": \"o2\", \"type\": \"org\", \"title\": \"記録管理課\", \"body\": \"サイト-81K1の文書を管理する部署。文書の矛盾の報告と、SCP-YYYY-JPの記録を担当する。\", \"tags\": \"記録管理課\", \"base\": {\"place\": \"pl2\", \"text\": \"\"}, \"orgRels\": [{\"org\": \"o1\", \"kind\": \"sub\", \"note\": \"\"}], \"ranks\": [\"課長\", \"元課長\", \"研究員\", \"研究員補\"]}, {\"id\": \"o3\", \"type\": \"org\", \"title\": \"保安部門\", \"body\": \"サイトの警備を担当する部門。\", \"tags\": \"保安部門\", \"base\": {\"place\": \"pl1\", \"text\": \"\"}, \"orgRels\": [{\"org\": \"o1\", \"kind\": \"sub\", \"note\": \"\"}], \"ranks\": [\"主任\", \"警備員\"]}, {\"id\": \"i1\", \"type\": \"item\", \"title\": \"事故報告書81K1-114\", \"body\": \"三年前の収容違反の報告書とされていた文書。死亡者の欄に81K1-0388（宇佐見）、作成者は三輪。番号114は2026年11月の番号。\", \"tags\": \"書類、誤記、伏線\"}, {\"id\": \"i2\", \"type\": \"item\", \"title\": \"職員名簿\", \"body\": \"サイト-81K1の名簿。81K1-0411の次が0414に飛んでいる。\", \"tags\": \"書類、欠番、伏線\"}, {\"id\": \"i3\", \"type\": \"item\", \"title\": \"缶コーヒー\", \"body\": \"宇佐見が毎朝八時半に持ってくる二本。一本は三輪の分。\", \"tags\": \"宇佐見、三輪、日常\"}, {\"id\": \"w1\", \"type\": \"world\", \"title\": \"整合の優先順位\", \"body\": \"財団の記録とSCP-TTTT-JP（ノート）が食い違うときは記録を正とし、整合官がノートを直す。記録どうしが食い違うときは、クリアランスの高い記録、古い記録を正とする。もとは1978年の記録取扱規程第一条。\", \"tags\": \"整合官、ルール\"}, {\"id\": \"w2\", \"type\": \"world\", \"title\": \"改訂申請の手続き\", \"body\": \"文書の誤りは改訂申請で直す。起案・証拠照合・課長承認・保安確認・原本照合・受理の六段階で、各段階の担当者が読んで確認者の欄に名前を書く。ふつうは三週間かかる。2027年2月から、緊急時は一日にできるが、必ず人が読む。\", \"tags\": \"書類、ルール\"}, {\"id\": \"e1\", \"type\": \"episode\", \"title\": \"低温収容棟の収容違反\", \"body\": \"扉が凍りつき、宇佐見と佐伯が閉じこめられる。眠らないように話しつづけるほど部屋は冷えた。佐伯は宇佐見に上着をかけ、そのあと朝まで黙っていたらしい。最後の言葉は残っていない。\", \"tags\": \"過去、事故、佐伯、宇佐見\", \"ty\": \"2023\", \"tm\": \"11\", \"td\": \"16\", \"tt\": \"00:42\", \"tl\": \"三年前\"}, {\"id\": \"e2\", \"type\": \"episode\", \"title\": \"自分の名前に花を置く\", \"body\": \"慰霊碑には宇佐見の名前が彫られている。宇佐見は、その下に本当は佐伯がいると知っていて、自分の名前に花を供える。\", \"tags\": \"宇佐見、佐伯、慰霊碑\"}, {\"id\": \"m1\", \"type\": \"memo\", \"title\": \"出典とライセンス\", \"body\": \"このサンプル（「欠番」「落とし主」）は、SCP財団の設定をもとにした二次創作です。\\nSCP財団は、SCP Wiki とその多くの著者による共同創作プロジェクトです。\\n日本支部：http://scp-jp.wikidot.com/　本家：https://scpwiki.com/\\nSCP財団の作品は CC BY-SA 3.0 で公開されており、このサンプルも同じ CC BY-SA 3.0 で公開します。\\nhttps://creativecommons.org/licenses/by-sa/3.0/deed.ja\\n特定のSCP記事は使っていません。用語集「オブジェクトクラス」の説明は、SCP財団日本支部「オブジェクトクラス」（http://scp-jp.wikidot.com/object-classes）を参照しています。作中のSCP番号（SCP-XXXX-JP・SCP-YYYY-JP・SCP-ZZZZ-JP・SCP-WWWW-JP・SCP-VVVV-JP・SCP-TTTT-JP）・サイト番号・人物は架空のものです。\\n物語は「欠番」→「落とし主」→「窓際の席」→「一日だけの三年」→「読む人」→「霜の部屋」→「黒い傘」→「三週間」→「余白」の順（「余白」は1996年の話）→「最後の巻き手」→「戻る席」→「第一条」の順（「第一条」は1978年の話）。\", \"tags\": \"出典、ライセンス\"}, {\"id\": \"p6\", \"type\": \"person\", \"title\": \"真柴\", \"body\": \"真柴。1978年に記録管理課に入り、のちに課長。葉山の第一条の確認者で、葉山がいなくなった夜に立ち会った。毎朝書類を読み返すようになり、その役目を鳴瀬に教えた。落とし物台帳の「落とし主」欄に「不明」と書くきまりを作った。すでに退職している。\", \"tags\": \"記録管理課、過去\", \"gender\": \"female\", \"orgs\": [{\"card\": \"o2\", \"name\": \"\", \"role\": \"元課長\"}]}, {\"id\": \"p7\", \"type\": \"person\", \"title\": \"小池\", \"body\": \"小池健太。記録管理課の研究員。2024年着任。母方の姓を名乗っている。佐伯健吾の弟。処分のあと、改訂申請台帳の担当として、すべての申請を自分で読んでいる。\", \"tags\": \"記録管理課、研究員\", \"gender\": \"male\", \"orgs\": [{\"card\": \"o2\", \"name\": \"\", \"role\": \"研究員\"}], \"family\": [{\"card\": \"p5\", \"name\": \"\", \"role\": \"兄\"}, {\"card\": \"\", \"name\": \"小池澄江\", \"role\": \"母\"}, {\"card\": \"\", \"name\": \"佐伯康夫\", \"role\": \"父（2027年死亡）\"}]}, {\"id\": \"pl6\", \"type\": \"place\", \"title\": \"落とし物窓口の小部屋\", \"body\": \"記録管理室の隣の小部屋。古い木の窓口と保管棚がある。\", \"tags\": \"SCP-YYYY-JP、地下\", \"facility\": true, \"loc\": {\"place\": \"pl1\", \"text\": \"地下二階\"}, \"env\": \"地下\"}, {\"id\": \"i4\", \"type\": \"item\", \"title\": \"三輪の落とし物\", \"body\": \"カーディガン、噛み跡のあるボールペン、名前が白く抜けた名札、職員証81K1-0411、印鑑。荷札の拾得場所はどれも「記録管理室」。\", \"tags\": \"SCP-YYYY-JP-1、三輪、伏線\"}, {\"id\": \"i5\", \"type\": \"item\", \"title\": \"印鑑\", \"body\": \"印影は「三輪」。読めるのに、持ち主のことが頭に残らない。\", \"tags\": \"三輪、伏線\"}, {\"id\": \"i6\", \"type\": \"item\", \"title\": \"沖田の手帳\", \"body\": \"沖田が1996年6月14日からつけている手帳。三十二冊ある。挨拶も天気も時刻つきで書く。ただし毎年六月十三日のページだけが白い。財団の文書ではないので、整合官に書き換えられない。\", \"tags\": \"沖田、記録、伏線\"}, {\"id\": \"i7\", \"type\": \"item\", \"title\": \"黒い傘\", \"body\": \"1996年6月13日、北の壁沿いの机で拾われた黒い長傘。持ち手に81K1-0412のテープ。荷札は「返却不可」。2027年1月12日、原本室で落とし主の鳴瀬に返された。\", \"tags\": \"過去、欠番、SCP-YYYY-JP-1\"}, {\"id\": \"i8\", \"type\": \"item\", \"title\": \"落とし物台帳\", \"body\": \"SCP-YYYY-JP-1を記入する台帳。拾得日・拾得場所・品名・落とし主・拾得者・備考の欄がある。落とし主の欄は三十年間「不明」だけ。\", \"tags\": \"SCP-YYYY-JP、記録\"}, {\"id\": \"w3\", \"type\": \"world\", \"title\": \"SCP-YYYY-JPのきまり\", \"body\": \"落とし主を探すと、窓口は落とし主をもっと遠くへ運ぶ。落とし主の欄には「不明」と書く。\", \"tags\": \"SCP-YYYY-JP、ルール\"}, {\"id\": \"w4\", \"type\": \"world\", \"title\": \"名簿と台帳のちがい\", \"body\": \"名簿は人の記録、台帳は物の記録。「この番号の職員はいない」と「この印鑑は三輪のもの」は食い違わない。\", \"tags\": \"整合官、ルール\"}, {\"id\": \"e3\", \"type\": \"episode\", \"title\": \"傘を返そうとした朝\", \"body\": \"若い沖田が0412の傘を持ち主に返そうとして、翌朝「返却不可」の荷札で箱に戻ってくる。\", \"tags\": \"過去、沖田、真柴\"}, {\"id\": \"e4\", \"type\": \"episode\", \"title\": \"缶コーヒーが三本\", \"body\": \"宇佐見が、三輪の分と自分の分に加えて、沖田の分も持ってくる。\", \"tags\": \"宇佐見、三輪、沖田\"}, {\"id\": \"p8\", \"type\": \"person\", \"title\": \"鷺沼\", \"body\": \"鷺沼博士。対抗ミーム部門の研究員。宇佐見の面談と処置を担当する。規則には厳しいが、記録のすき間に気づける人。\", \"tags\": \"対抗ミーム部門、博士\", \"gender\": \"female\", \"orgs\": [{\"card\": \"o4\", \"name\": \"\", \"role\": \"博士\"}]}, {\"id\": \"o4\", \"type\": \"org\", \"title\": \"対抗ミーム部門\", \"body\": \"ミーム汚染への対処と、対抗ミームの開発・提示を担当する部門。\", \"tags\": \"対抗ミーム、部門\", \"base\": {\"place\": \"pl1\", \"text\": \"\"}, \"orgRels\": [{\"org\": \"o1\", \"kind\": \"sub\", \"note\": \"\"}], \"ranks\": [\"博士\"]}, {\"id\": \"w5\", \"type\": \"world\", \"title\": \"SCP-ZZZZ-JPの汚染段階\", \"body\": \"段階1：「窓際」と書くようになる。段階2：北の壁に窓が見える。段階3：窓際の机の女性が見え、触れられる。段階4：記録がない（三輪によれば、窓の外へ行ってしまう）。\", \"tags\": \"ミーム汚染、ルール\"}, {\"id\": \"e5\", \"type\": \"episode\", \"title\": \"誰も触れない缶\", \"body\": \"監視カメラには誰も映らないのに、北の壁沿いの机に置かれた缶コーヒーは、毎朝空になっている。\", \"tags\": \"宇佐見、三輪、缶コーヒー\"}, {\"id\": \"i9\", \"type\": \"item\", \"title\": \"事故報告書81K1-097\", \"body\": \"2023年11月16日の収容違反の本物の報告書。死亡者は佐伯健吾、作成者は沖田。十一月十六日の日の出に書き換えで負け、落とし物窓口に落ちてきた。\", \"tags\": \"書類、原本、伏線\"}, {\"id\": \"w6\", \"type\": \"world\", \"title\": \"日の出ごとに一段\", \"body\": \"整合官は、日の出ごとに矛盾の訂正をする。ただし、ある行を直したせいで新たに生まれた食い違いは、次の日まで待たなければならない。だから食い違いの連鎖は、一度の日の出に一段ずつしか進まない。一段ずつなら何段でも積めるので、三年分の歴史でも一日で作れてしまう。書き換えで負けた文書は、落とし物窓口に落ちてくる。\", \"tags\": \"整合官、ルール\"}, {\"id\": \"i10\", \"type\": \"item\", \"title\": \"読み返しリスト\", \"body\": \"三輪が北の壁沿いの机の引き出しに残した青いバインダー。二百十二件の書類と、読み返した日付が並ぶ。日付は十一月十六日で止まっている。のちに「作成者：欠番」として当番表になる。\", \"tags\": \"三輪、書類、伏線\"}, {\"id\": \"i11\", \"type\": \"item\", \"title\": \"閲覧記録\", \"body\": \"書類を読んだ人が名前と時刻を書く帳面。記録に残る人が読んだ書類は、そこで止まる。\", \"tags\": \"記録、書類\"}, {\"id\": \"w7\", \"type\": \"world\", \"title\": \"読まれない書類は嘘になる\", \"body\": \"財団の書類は、誰かが読み返さなければ少しずつ別の言葉に変わっていく。ノートのおかしな行に引きずられるため。間違った記録を見本にすれば、ノートも間違ったほうへ直ってしまう。記録に残る人が読めば、書類はそこで止まる。\", \"tags\": \"ルール、書類\"}, {\"id\": \"w8\", \"type\": \"world\", \"title\": \"霜の部屋のきまり\", \"body\": \"零下30度以下で話した言葉は、霜の文字として壁に残る。霜は財団の文書ではないので、整合官にも書き換えられず、読まれなくても変わらないと考えられている。話すほど冷え、零下60度で扉が凍る。黙れば少しずつ戻る。なぜ言葉を残すのか、いちばん古い霜がいつのものかは分かっていない。\", \"tags\": \"SCP-WWWW-JP、ルール\"}, {\"id\": \"p9\", \"type\": \"person\", \"title\": \"鳴瀬\", \"body\": \"鳴瀬灯。沖田の同期で、職員番号は81K1-0412。毎朝決まった書類を読み返していた「読む係」。1996年6月13日、沖田の誤記を引き受けて欠番になり、整合官補に任じられた。北の壁沿いの机に三十年座り、三輪と席を替わって、今は窓の外を歩いている。右へ少し傾いた字を書く。\", \"tags\": \"欠番、整合官、黒い傘\", \"gender\": \"female\", \"orgs\": [{\"card\": \"o1\", \"name\": \"\", \"role\": \"整合官\"}, {\"card\": \"o2\", \"name\": \"\", \"role\": \"研究員（1996年まで）\"}], \"friends\": [{\"card\": \"p3\", \"name\": \"\", \"role\": \"同期\"}, {\"card\": \"p1\", \"name\": \"\", \"role\": \"席を替わった後輩\"}], \"birthY\": \"1972\"}, {\"id\": \"p10\", \"type\": \"person\", \"title\": \"0413\", \"body\": \"名簿の上では欠番。名前がない。2026年11月17日の夜から、改訂申請の証拠照合・保安確認・原本照合の欄に、夜中に判を押すようになった。細くて平たい字を書く。誰なのかは分かっていない。\", \"tags\": \"欠番、確認者、謎\", \"gender\": \"\", \"orgs\": [{\"card\": \"o1\", \"name\": \"\", \"role\": \"確認者\"}]}, {\"id\": \"i12\", \"type\": \"item\", \"title\": \"改訂申請台帳\", \"body\": \"改訂申請と、各段階の確認者を記録する台帳。2027年2月から小池が担当している。\", \"tags\": \"書類、改訂\"}, {\"id\": \"w9\", \"type\": \"world\", \"title\": \"余白で覚える\", \"body\": \"欠番になった人のことを書けば、人はその人を探してしまい、その人はもっと遠くへ行く。だから書かない。そのかわりほかのことを全部書けば、書いていないところだけが白く残り、そこに誰かがいたと分かる。\", \"tags\": \"沖田、鳴瀬、ルール\"}, {\"id\": \"i13\", \"type\": \"item\", \"title\": \"ゼンマイ人形\", \"body\": \"SCP-VVVV-JP。小太鼓を抱えた女の子のブリキ人形と、付いてきた小冊子「わたしのおにんぎょう」のセット。ゼンマイが止まると、最後に巻いた人が死ぬ。2027年3月4日、生きていない三輪が最後に巻いて止まり、Safeになった。落とし物窓口の保管棚の奥（黒い傘があった場所）に保管。巻かないこと。\", \"tags\": \"SCP-VVVV-JP、致死性、人形\"}, {\"id\": \"i14\", \"type\": \"item\", \"title\": \"小冊子「わたしのおにんぎょう」\", \"body\": \"SCP-VVVV-JPの一部で、人形に付いてきた子ども向けの手帳。人形の名前（とんこ）、思い出、「おともだち」の欄がある。巻いた人の名前は「おともだち」の欄にひとりでに書き加わり、いちばん下の人が最後の巻き手になる。何人分書かれても、いつも一行だけ空きが残る。いちばん下の名前は、丸い鉛筆の字の「三輪栞」。書き換えないこと。\", \"tags\": \"SCP-VVVV-JP、小冊子\"}, {\"id\": \"w10\", \"type\": \"world\", \"title\": \"最後の巻き手\", \"body\": \"SCP-VVVV-JPのゼンマイが止まると、小冊子の「おともだち」の欄のいちばん下の人が死ぬ。止まるまでの時間は巻くたびに縮む。最後の巻き手が死ぬと、約二十四時間かけてひとりでに巻き戻り、死んだ人にもっとも近しい人の名前が「おともだち」の欄に現れて、その人が新たな最後の巻き手になる。最後の巻き手が死ななければ、巻き戻りは起きない。\", \"tags\": \"SCP-VVVV-JP、ルール\"}, {\"id\": \"w11\", \"type\": \"world\", \"title\": \"欠番の状態\", \"body\": \"欠番になった人は、名簿にもなく、生きてもいないし死んでもいない。物には触れるが、おなかは空かず、眠くもならない。生きている人を対象にする異常の効果を受けない。致命傷を受けると、その死は記録できない矛盾になり、日の出に、ただ一つ記録されている場所へ戻される。痛みは感じる。それを前提に収容計画を立ててはならない。 欠番は1978年、ノートのページが破れて葉山について書かれた行がなくなったときに初めて生まれた。どこにも書かれていないので、ノートに書き換えられず、ノートを直すことができる。\", \"tags\": \"欠番、三輪、ルール\"}, {\"id\": \"w12\", \"type\": \"world\", \"title\": \"戻る場所\", \"body\": \"三輪が日の出に戻るのは、財団の記録の中でただ一つ、彼女の居場所として書かれた落とし物台帳の一行「記録管理課の窓際の机の人」があるから。第一条の四により、物の記録は人がいるかどうかの根拠にならないので、三輪は欠番のまま。けれど、どこにいるかの根拠にはなる。この行が消えれば、戻る場所がなくなる。台帳は課長室の鍵のかかる引き出しにしまわれている。\", \"tags\": \"三輪、欠番、ルール\"}, {\"id\": \"i15\", \"type\": \"item\", \"title\": \"記録取扱規程　第一条\", \"body\": \"一、財団の記録とSCP-TTTT-JPの記述が食い違うときは、記録を正とし、SCP-TTTT-JPを訂正する。二、記録どうしが食い違うときは、より上位の記録を、上位が等しいときはより古い記録を正とする。三、職員は記録を分担して読み合わせ、食い違いを見つけた者は改訂報告を提出する。四、人がいるか、いないかの根拠とする記録は、職員名簿と人事記録に限る。物の記録は、その根拠としない。起案：葉山、確認者：真柴。1978年2月21日施行。\", \"tags\": \"書類、規程、葉山\"}, {\"id\": \"i16\", \"type\": \"item\", \"title\": \"SCP-TTTT-JP（ノート）\", \"body\": \"表紙のない大学ノートほどの冊子。1977年、第3収容室の奥の氷の中から見つかった。サイト-81K1の身の回りのことが古い筆跡で書いてあり、現実はその記述のとおりになる。ときおり誰も書いていない行が現れ、次の日の出に現実がそのとおりに書き換わる。鉛筆で訂正すれば戻る。整合官が夜のうちに直している。現在の所在は[編集済]。\", \"tags\": \"現実改変、Keter、ノート\"}, {\"id\": \"w13\", \"type\": \"world\", \"title\": \"読み合わせと改訂報告\", \"body\": \"職員は記録を分担して読み合わせ、記録とノートの食い違いを見つけたら改訂報告を出す。整合官はそれを見て、夜のうちにノートを直し、日の出に現実が戻る。整合官補の仕事は、見ることと、印をつけて知らせること（1978年は葉山一人だったので自分で直した）。読み合わせは年月とともに形だけになり、実際に読んでいたのは、その時代の「読む係」一人だった（真柴→鳴瀬→三輪）。\", \"tags\": \"ルール、現実改変、整合官\"}], \"wiki\": [{\"id\": \"w1\", \"title\": \"整合官\", \"aliases\": \"SCP-XXXX-JP、葉山\", \"cat\": \"異常\", \"body\": \"財団の文書の矛盾を、日の出までに書き換える実体。名簿には「整合官　葉山」とある。\", \"cards\": [\"p4\"]}, {\"id\": \"w2\", \"title\": \"欠番\", \"aliases\": \"空き番号\", \"cat\": \"用語\", \"body\": \"名簿の上には存在するのに、対応する職員が見つからない職員番号。\", \"cards\": [\"i2\"]}, {\"id\": \"w3\", \"title\": \"改訂申請\", \"aliases\": \"改訂報告\", \"cat\": \"手続き\", \"body\": \"財団の文書の誤りを正式に直す手続き。証拠と課長の承認が必要。\", \"cards\": [\"w2\"]}, {\"id\": \"w4\", \"title\": \"セキュリティクリアランス\", \"aliases\": \"クリアランス\", \"cat\": \"用語\", \"body\": \"文書や情報に触れられる権限の段階。レベルが高い文書ほど、整合官に優先される。\", \"cards\": [\"w1\"]}, {\"id\": \"w5\", \"title\": \"オブジェクトクラス\", \"aliases\": \"Safe、Euclid、Keter\", \"cat\": \"用語\", \"body\": \"財団がアノマリーを、収容のしやすさで分けた分類。危険さの度合いを表すものではない。\\n・Safe：容易かつ安全に収容できるもの。研究が進んでいて収容に多くの資源が要らない、あるいは決まったきっかけがないと働かない、といった理由による。取り扱っても危険がない、という意味ではない。\\n・Euclid：完全な収容により多くの資源が要るもの、または収容が確実とは言えないもの。性質が解明しきれていないか、もともと予測できないことが多い。いちばん適用範囲の広いクラスで、自分で考えたり動いたりするもの（自律的・知性的なもの）は、ふつうここに入る。\\n・Keter：続けて、または確実に収容するのがきわめて難しいもの。収容手順は大がかりで複雑になりやすい。危険という意味ではなく、収容が非常に難しい、または費用がかかるということ。\\n作中では、自分で判断して文書を書き換える整合官（SCP-XXXX-JP）がEuclid、毎朝の手順を守れば収容できる落とし物窓口（SCP-YYYY-JP）がSafe。\\n参照：SCP財団日本支部「オブジェクトクラス」 http://scp-jp.wikidot.com/object-classes （CC BY-SA 3.0）\", \"cards\": [\"p4\", \"pl6\"]}, {\"id\": \"bw1\", \"title\": \"落とし物窓口\", \"aliases\": \"SCP-YYYY-JP、窓口\", \"cat\": \"異常\", \"body\": \"廃駅から回収された遺失物受付窓口。毎朝、記録と記憶から失われた人の持ち物が箱に現れる。\", \"cards\": [\"pl6\"]}, {\"id\": \"bw2\", \"title\": \"落とし物台帳\", \"aliases\": \"台帳\", \"cat\": \"用語\", \"body\": \"SCP-YYYY-JP-1を記入する台帳。落とし主の欄は、三十年間「不明」だった。\", \"cards\": [\"i8\"]}, {\"id\": \"cw1\", \"title\": \"ミーム汚染\", \"aliases\": \"汚染\", \"cat\": \"用語\", \"body\": \"情報（言葉・画像・文書など）を見聞きすることで、認識や行動が変わってしまう現象。SCP-ZZZZ-JPは「窓際の机」という記述を通して広がる。\", \"cards\": [\"w5\"]}, {\"id\": \"cw2\", \"title\": \"対抗ミーム\", \"aliases\": \"対抗ミーム処置\", \"cat\": \"用語\", \"body\": \"ミーム汚染を打ち消すための情報。SCP-ZZZZ-JPには「北の壁は壁である」が使われる。\", \"cards\": [\"o4\"]}, {\"id\": \"cw3\", \"title\": \"記憶処理\", \"aliases\": \"クラスA記憶処理\", \"cat\": \"用語\", \"body\": \"特定の記憶を消す処置。記憶は消せても、体に残った習慣までは消せない。\", \"cards\": []}, {\"id\": \"cw4\", \"title\": \"窓際の机\", \"aliases\": \"窓際の席\", \"cat\": \"異常\", \"body\": \"窓のない記録管理室の、北の壁沿いにある机。SCP-ZZZZ-JPの汚染を受けた人にだけ、窓と、そこに座る人が見える。\", \"cards\": [\"pl2\", \"p1\"]}, {\"id\": \"dw1\", \"title\": \"照合プログラム\", \"aliases\": \"照合\", \"cat\": \"手続き\", \"body\": \"名簿・給与記録・報告書などを突き合わせ、食い違いを見つけるプログラム。実行する日付を指定できる。\", \"cards\": []}, {\"id\": \"dw2\", \"title\": \"報告書番号\", \"aliases\": \"通し番号\", \"cat\": \"用語\", \"body\": \"サイト-81K1の事故報告書は、年をまたいで通し番号で振られる。2023年は090〜103、2026年11月14日時点の最新は113。\", \"cards\": [\"i1\", \"i9\"]}, {\"id\": \"ew1\", \"title\": \"要閲覧\", \"aliases\": \"要閲覧の印\", \"cat\": \"用語\", \"body\": \"ずれ始めた書類の右上に、鉛筆で書かれる三文字。整合官の字に似ているが、少し丸い。\", \"cards\": [\"p1\"]}, {\"id\": \"ew2\", \"title\": \"読み合わせ\", \"aliases\": \"読み返し当番\", \"cat\": \"手続き\", \"body\": \"読み返しリストの書類を、毎日分担して声に出して読み、閲覧記録に名前と時刻を書くこと。\", \"cards\": [\"i10\", \"i11\"]}, {\"id\": \"fw1\", \"title\": \"霜の部屋\", \"aliases\": \"SCP-WWWW-JP、第3収容室\", \"cat\": \"異常\", \"body\": \"低温収容棟の第3収容室。話した言葉が霜の文字として壁に残る。\", \"cards\": [\"pl5\", \"w8\"]}, {\"id\": \"fw2\", \"title\": \"原本室\", \"aliases\": \"\", \"cat\": \"手続き\", \"body\": \"霜の部屋を、書き換えられない記録の場所として使うこと。大事な文書の要点を、一回一、二分だけ声に出して読み、霜に残す。\", \"cards\": [\"pl5\"]}, {\"id\": \"fw3\", \"title\": \"解凍作業\", \"aliases\": \"\", \"cat\": \"手続き\", \"body\": \"霜の部屋の扉の縁の霜を取り除く作業。必ず二名で行う。\", \"cards\": [\"pl5\"]}, {\"id\": \"gw1\", \"title\": \"窓の外\", \"aliases\": \"白い雨\", \"cat\": \"異常\", \"body\": \"窓際の机の窓から見える、白い光の場所。記録からこぼれたものが雨のように降っていく。傘があれば、遠くまで拾いに行ける。拾われたものは落とし物窓口に届く。\", \"cards\": [\"p9\", \"i7\"]}, {\"id\": \"hw1\", \"title\": \"確認者\", \"aliases\": \"確認者の欄\", \"cat\": \"用語\", \"body\": \"改訂申請の各段階で、書類を読んだ人が名前と日時を書く欄。2027年2月から、人の名前の横に0413の判が押されることがある。消さないこと。\", \"cards\": [\"p10\", \"i12\"]}, {\"id\": \"iw1\", \"title\": \"余白\", \"aliases\": \"六月十三日\", \"cat\": \"用語\", \"body\": \"沖田の手帳で、毎年一日だけ何も書かれないページ。鳴瀬との約束で、その人のことだけは書かない。\", \"cards\": [\"i6\", \"w9\"]}, {\"id\": \"jw1\", \"title\": \"ゼンマイ人形\", \"aliases\": \"SCP-VVVV-JP\", \"cat\": \"異常\", \"body\": \"ゼンマイが止まると、最後に巻いた人が死ぬブリキ人形。今は止まったまま保管されている。\", \"cards\": [\"i13\"]}, {\"id\": \"jw2\", \"title\": \"おともだちの欄\", \"aliases\": \"最後の巻き手、わたしのおにんぎょう\", \"cat\": \"用語\", \"body\": \"ゼンマイ人形に付いてきた小冊子の欄。巻いた人の名前がひとりでに書き加わり、いちばん下の人が「最後の巻き手」になる。いつも一行だけ空きが残っている。\", \"cards\": [\"i14\", \"w10\"]}, {\"id\": \"kw1\", \"title\": \"戻る席\", \"aliases\": \"窓際の席に戻る\", \"cat\": \"用語\", \"body\": \"致命傷を受けた三輪が、次の日の出に目を覚ます場所。落とし物台帳の一行が、その場所を記録している。\", \"cards\": [\"w12\", \"p1\"]}, {\"id\": \"jw3\", \"title\": \"窓際の花\", \"aliases\": \"白い菊\", \"cat\": \"用語\", \"body\": \"小池が三輪に贈る花。最初は購買部に白い菊しかなく、「まだ死んでませんよ？」とからかわれた。それから週に一度、菊以外の花を一輪ずつ置いていく。窓際の空き缶に挿して飾られている。\", \"cards\": [\"p7\", \"p1\"]}, {\"id\": \"lw1\", \"title\": \"現実改変\", \"aliases\": \"書き換え、ノート\", \"cat\": \"用語\", \"body\": \"現実そのものを書き換える異常。SCP-TTTT-JPはノート型で、書かれた記述のとおりに現実が存在し、誰も書いていない行が増えると現実が変わる。\", \"cards\": [\"i16\"]}, {\"id\": \"lw2\", \"title\": \"第一条\", \"aliases\": \"記録取扱規程\", \"cat\": \"手続き\", \"body\": \"1978年、葉山が起案した規程。「財団の記録とノートが食い違うときは、記録を正とし、ノートを直す」。読み合わせと改訂報告もここから始まった。\", \"cards\": [\"i15\", \"w1\"]}], \"maps\": [], \"affinity\": [], \"cuts\": [], \"gpos\": {}, \"defImgs\": {}, \"worldLinks\": [{\"id\": \"wl1\", \"a\": \"p4\", \"b\": \"p1\", \"label\": \"見ている\"}, {\"id\": \"wl2\", \"a\": \"p2\", \"b\": \"p5\", \"label\": \"相棒\"}, {\"id\": \"wl3\", \"a\": \"p6\", \"b\": \"p3\", \"label\": \"「記録しなさい」と教えた\"}], \"links\": [{\"id\": \"wl1\", \"a\": \"p4\", \"b\": \"p1\", \"label\": \"見ている\"}, {\"id\": \"wl2\", \"a\": \"p2\", \"b\": \"p5\", \"label\": \"相棒\"}, {\"id\": \"wl3\", \"a\": \"p6\", \"b\": \"p3\", \"label\": \"「記録しなさい」と教えた\"}, {\"id\": \"l2\", \"a\": \"p1\", \"b\": \"p2\", \"label\": \"誤記で死なせた\", \"st\": \"stA\"}, {\"id\": \"l3\", \"a\": \"p3\", \"b\": \"p1\", \"label\": \"鍵だけ置いていく\", \"st\": \"stA\"}], \"curStory\": \"stA\", \"stories\": [{\"id\": \"stA\", \"links\": [{\"id\": \"l2\", \"a\": \"p1\", \"b\": \"p2\", \"label\": \"誤記で死なせた\", \"st\": \"stA\"}, {\"id\": \"l3\", \"a\": \"p3\", \"b\": \"p1\", \"label\": \"鍵だけ置いていく\", \"st\": \"stA\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}}}, {\"id\": \"stB\", \"links\": [{\"id\": \"lb1\", \"a\": \"p2\", \"b\": \"p3\", \"label\": \"三輪の名前を伝える\", \"st\": \"stB\"}, {\"id\": \"lb2\", \"a\": \"p3\", \"b\": \"p1\", \"label\": \"台帳で名前を呼ぶ\", \"st\": \"stB\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"落とし主\", \"ending\": \"沖田は思い出せない部下のために、落とし物台帳の「落とし主」欄へ三十年ぶりに名前を書き込み、覚えていられなくても台帳を開けば三輪の名前を呼べるようになる。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"b8\"}, \"scenes\": [{\"id\": \"b1\", \"title\": \"収容記録：SCP-YYYY-JP\", \"role\": \"財団の文書の形で、落とし物窓口と「落とし主を探さない」きまりを見せる\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [], \"pays\": [], \"chars\": \"沖田\", \"note\": \"\", \"cards\": [\"p3\", \"pl6\", \"i8\", \"w3\", \"o1\", \"pl1\"], \"pageData\": [], \"text\": \"アイテム番号：SCP-YYYY-JP\\nオブジェクトクラス：Safe\\n\\n特別収容プロトコル：SCP-YYYY-JPは、サイト-81K1地下二階、記録管理室の隣の小部屋に設置されています。毎朝9時、記録管理課の職員一名が受付台の箱を開け、中の物品（SCP-YYYY-JP-1）を落とし物台帳に記入したうえで、保管棚に収めてください。\\n台帳の「落とし主」の欄には、必ず「不明」と記入してください。落とし主を探す目的で、SCP-YYYY-JP-1を持ち出してはいけません。\\n\\n説明：SCP-YYYY-JPは、昭和の中ごろに廃止された地方駅から回収された、木製の遺失物受付窓口です。受付台、小窓、木箱、それに「お忘れ物はこちらへ」と書かれた札から成ります。\\n\\nSCP-YYYY-JPの箱には、毎朝、前日のうちに「失われた」物品が現れます。どの物品にも荷札が付いていて、拾得日と拾得場所が手書きで書かれています。\\n調査の結果、SCP-YYYY-JP-1の落とし主は、なんらかの理由で、すべての記録と記憶から失われた人物だと考えられています。落とし主の顔を見ても、名前を聞いても、その人物を覚えておくことはできません。\\n\\n補遺YYYY-JP-1：1996年、当時の職員がSCP-YYYY-JP-1を落とし主に返そうとしました。翌朝、その物品は荷札を「返却不可」に書き換えられた状態で、箱に戻っていました。この件以来、上の収容プロトコルが定められています。\\n\\n記録管理課課長　沖田礼子による注記：落とし主を探さないこと。私たちは記録する部署です。\", \"ty\": \"\", \"tm\": \"\", \"td\": \"\", \"tt\": \"\", \"tl\": \"作中資料\"}, {\"id\": \"b2\", \"title\": \"朝九時の箱\", \"role\": \"沖田の日常。箱から、自分の部署で落とされた物が出てくる\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"b1\"], \"plants\": [\"g3\"], \"pays\": [], \"chars\": \"沖田\", \"note\": \"\", \"cards\": [\"p3\", \"pl6\", \"i4\", \"i5\", \"i8\"], \"pageData\": [], \"text\": \"沖田礼子は、二十二年間、毎朝九時にこの箱を開けてきた。\\n\\n小部屋は、記録管理室の隣にある。古い木の窓口が一つ。「お忘れ物はこちらへ」という札は、日に焼けて字が薄くなっている。\\nたいていの朝、箱は空っぽだ。人が記録からも記憶からも消えることは、そう多くはない。\\n\\nけれど、その朝の箱は重かった。\\n\\n紺色のカーディガン。キャップの先を噛んだ跡のあるボールペン。机の上に置く名札は、名前の部分だけが白く抜けている。それから、職員証が一枚。番号は81K1-0411。名前の欄は、やはり白い。\\n最後に、小さな印鑑が出てきた。\\n\\n荷札には、どれも同じことが書いてあった。\\n拾得日：2026年11月17日。拾得場所：記録管理室。\\n\\n沖田は、印鑑を朱肉に押しつけて、台帳の余白に押してみた。\\n三輪。\\nその二文字を読んだ瞬間、何かが頭の中を通り過ぎた。すべって、どこかへ落ちていった。もう一度読む。三輪。何も残らない。名前は読めるのに、その名前の持ち主のことを、何ひとつ思い出せない。\\n\\n沖田はいつものように、台帳に一行ずつ書いた。\\nカーディガン、ボールペン、名札、職員証、印鑑（印影「三輪」）。\\n落とし主の欄には、「不明」。\\n\\n拾得場所が自分の部署なのは、二十二年で初めてのことだった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"18\", \"tt\": \"09:00\", \"tl\": \"\"}, {\"id\": \"b3\", \"title\": \"会釈の記録\", \"role\": \"覚えていないのに、記録の上では起きていることがある\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"b2\"], \"plants\": [\"g2\", \"g4\"], \"pays\": [], \"chars\": \"沖田、小池\", \"note\": \"\", \"cards\": [\"p3\", \"p7\", \"pl2\", \"i6\", \"o2\"], \"pageData\": [], \"text\": \"沖田は、なんでも手帳に書く。\\n会議の時間も、書類の番号も、自分がした挨拶も。覚えていられることは信用しない。それが、この仕事を三十年続けてきたやり方だった。\\n\\nその手帳を、昼休みにめくり直した。\\n\\n11月17日　08:02　記録管理室で、見覚えのない職員に会釈。\\n11月18日　08:02　記録管理室で、見覚えのない職員に会釈。\\n\\n二日続けて、同じ時刻。同じ場所。\\n沖田には、どちらも覚えがなかった。\\n\\n記録管理室を見回す。窓際の机が一つ、空いている。誰の席だったか、と若い研究員の小池に聞くと、小池は首をかしげた。\\n「あそこ、ずっと空いてますよ。僕が来たときから」\\nけれど、その机にはほこりが一つもなかった。椅子の背が、少しだけ引かれている。\\n\\nもう一つ、おかしな書類があった。\\n事故報告書81K1-114の改訂報告。三年前の収容違反で、死亡者の番号を訂正したものだ。課長承認の欄に、沖田の電子印が押されている。押された時刻は11月17日の午前二時五十八分。\\n沖田には、その夜、印を押した覚えがなかった。\\n作成者の欄は黒く塗りつぶされていて、横に几帳面な字で「欠番」とだけ書いてあった。\\n\\n沖田は手帳を閉じた。\\n覚えていないことが、記録の上ではいくつも起きている。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"18\", \"tt\": \"12:30\", \"tl\": \"\"}, {\"id\": \"b4\", \"title\": \"三十年前の傘\", \"role\": \"沖田の口ぐせの始まり。探すと、落とし主はもっと遠くなる\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"b1\"], \"plants\": [\"g1\"], \"pays\": [], \"chars\": \"沖田、真柴\", \"note\": \"\", \"cards\": [\"p3\", \"p6\", \"i7\", \"e3\"], \"pageData\": [], \"text\": \"三十年前の六月。沖田は二十四歳で、記録管理課に来て二年目だった。\\n\\nその朝、箱から黒い傘が一本出てきた。持ち手に、職員番号の書かれたテープが巻いてあった。81K1-0412。\\n名簿を引くと、0412は欠番だった。\\n\\n沖田は、傘を放っておけなかった。誰かが雨の日にこれを差していた。その誰かが、いなくなったまま誰にも気づかれずにいる。\\n沖田は傘を持って、サイトじゅうを歩いた。この傘に見覚えはありませんか。0412の席はどこでしたか。誰も知らなかった。\\n最後に、名簿の上で0412が並んでいるはずの棚の前に、傘を立てかけておいた。\\n\\n翌朝、傘は箱に戻っていた。\\n荷札の字が変わっていた。「返却不可」。\\n\\n「探すとね、窓口は落とし主をもっと遠くへ運ぶの」\\n当時の課長だった真柴は、傘を保管棚に戻しながら言った。\\n「あなたが探すほど、その人の痕跡はこの世から一つずつ消えていく。だから、私たちは探さない。記録するの。何が落ちていたか。いつ、どこで。それだけは、誰にも消せない」\\n\\n沖田は台帳を見た。拾得日、拾得場所、品名、落とし主。\\n落とし主の欄だけが、どのページもまっさらだった。\\n\\n「この欄は、何のためにあるんですか」\\n真柴は少し考えてから、言った。\\n「空けておくためよ。いつか、書いてもいい日が来るかもしれないから」\\n\\nそれから三十年、沖田はその欄に「不明」以外の字を書いたことがない。\", \"ty\": \"1996\", \"tm\": \"6\", \"td\": \"\", \"tt\": \"\", \"tl\": \"三十年前\"}, {\"id\": \"b5\", \"title\": \"宇佐見の証言\", \"role\": \"見えない誰かと、それを覚えている唯一の人。02:58の承認印のわけ\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"b3\"], \"plants\": [], \"pays\": [\"g4\"], \"chars\": \"沖田、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"p1\", \"pl2\", \"o3\"], \"pageData\": [], \"text\": \"次の朝、沖田は八時前から記録管理室にいた。\\n自分の目で見るためだった。見たものを、その場で手帳に書くためだった。\\n\\n八時二分。\\n沖田は、自分が誰かに会釈しているのに気づいた。窓際の机のほうへ、軽く頭を下げている。手帳を開いて、震える字で書いた。\\n\\n08:02　窓際の机。誰かいる。顔が思い出せない。今、書いている間にも、思い出せなくなっていく。\\n\\n八時半。廊下から靴音が来た。\\n保安部門の宇佐見が、缶コーヒーを二本持って入ってきた。宇佐見は窓際の机に一本を置いて、何か話しかけ、笑った。沖田の目には、宇佐見がひとりで笑っているようにしか見えなかった。\\n\\n「宇佐見さん」\\n沖田は、手帳とペンを持ったまま声をかけた。\\n「その席の人の名前を、教えてくれる？」\\n宇佐見は、驚いた顔をした。\\n「三輪さんですよ。三輪栞さん。課長の部下じゃないですか」\\n\\n沖田は、聞いたとおりに手帳に書いた。三輪栞。書いたそばから、その名前は頭の中ですべっていく。けれど、紙の上の字はすべらない。\\n宇佐見は、知っていることを全部話した。三年前の誤記のこと。三輪がひと晩で書類を組み上げたこと。宇佐見自身が、そのおかげで今ここに立っていること。\\n\\n「三輪さん、言ってましたよ」と、宇佐見は言った。\\n「承認の印は、課長が夜中に押してくれたって。何も言わずに」\\n\\n沖田は、手帳の最後のページを見た。02:58。あの電子印の時刻だった。\\n自分は、覚えていない誰かを、一度だけ助けていた。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"19\", \"tt\": \"08:00\", \"tl\": \"\"}, {\"id\": \"b6\", \"title\": \"空けておく欄\", \"role\": \"名簿ではなく、物の記録なら書ける。失敗すれば自分が欠番になる\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"b5\", \"b4\", \"b2\"], \"plants\": [], \"pays\": [], \"chars\": \"沖田\", \"note\": \"\", \"cards\": [\"p3\", \"p4\", \"i8\", \"w3\", \"w4\"], \"pageData\": [], \"text\": \"昼すぎ、沖田は小部屋で、台帳と収容プロトコルを並べて読んだ。\\n\\n落とし主の欄には、必ず「不明」と書くこと。\\nこのきまりを作ったのは真柴だ。そして三十年前、その理由を作ったのは沖田自身だった。\\n\\n落とし主を探すと、その人はもっと遠くへ運ばれる。\\nでは、探さずに、ただ書いたらどうなるのか。\\n\\n沖田は、書類のことならよく知っている。\\n三輪栞は「欠番」になった。整合官がそう決めた。欠番とは、名簿の上で「この番号の職員はいない」ということだ。もし名簿に三輪の名前を書き戻せば、整合官の決定と食い違う。日の出までに書き直されるだけだろう。悪ければ、書いた沖田のほうが欠番になる。\\n\\nけれど、落とし物台帳は名簿ではない。人の記録ではなく、物の記録だ。\\n「この印鑑の落とし主は三輪栞である」\\nその一行は、「81K1-0411という職員はいない」とは食い違わない。職員でなくても、落とし物はできる。\\n記録取扱規程の第一条にも、そう書いてある。人がいるか、いないかの根拠とする記録は、名簿と人事記録に限る。物の記録は、その根拠にしない。四十年以上前に、誰かが書いた一項だ。\\n\\n沖田は、自分の考えを三回読み直した。\\n穴があるかもしれない。整合官が、沖田の知らない理屈で矛盾を見つけるかもしれない。そうなれば、明日の朝、この台帳を開く職員は、もう沖田のことを覚えていない。\\n\\n窓際の机のほうから、ボールペンの音がした。\\n誰かが、仕事をしている。名前も顔も覚えられない誰かが、毎朝ここに来て、書類を読んでいる。\\n\\n――いつか、書いてもいい日が来るかもしれないから。\\n\\n沖田は手帳を閉じた。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"19\", \"tt\": \"13:00\", \"tl\": \"\"}, {\"id\": \"b7\", \"title\": \"落とし主\", \"role\": \"三十年白いままだった欄に、初めて名前を書く\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"b6\"], \"plants\": [], \"pays\": [\"g1\", \"g3\"], \"chars\": \"沖田、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"i4\", \"i8\", \"pl6\"], \"pageData\": [], \"text\": \"夜十一時。沖田は落とし物台帳を開いた。\\n三十年間、白いままだった欄の前で、ペンが一度止まった。\\n\\n品名：印鑑（印影「三輪」）\\n拾得日：2026年11月17日\\n拾得場所：記録管理室\\n落とし主：三輪栞　記録管理課の窓際の机の人\\n\\n職員番号は書かなかった。研究員補という肩書きも書かなかった。名簿と食い違うことは、一つも書かない。書くのは、この印鑑が誰のものかということだけだ。\\nカーディガンも、ボールペンも、名札も、職員証も、同じように一行ずつ書いていった。\\n\\n「立ち会いが要りますか」\\n戸口に、宇佐見が立っていた。昼のうちに沖田が頼んでおいたのだ。\\n「拾得者の欄に、名前を書いてほしいの。この人を覚えている人の名前が、ここに一つ要る」\\n\\n宇佐見は台帳をのぞきこんで、拾得者の欄に、大きな字で自分の名前を書いた。\\n「三輪さんの物を拾ったのは俺だって、そう書いておけばいいんですね」\\n「ええ。それで、記録はひとつながりになる」\\n\\n沖田は、最後の行の備考欄に一行だけ足した。\\n〈落とし主へ返却予定〉\\n\\nそれから、小部屋の明かりを消さずに、受付台の前の椅子に座った。\\n日の出まで、あと七時間。\\n手帳の新しいページに、日付と時刻を書いた。明日の朝の自分が、今夜のことを覚えていなくても読めるように。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"19\", \"tt\": \"23:00\", \"tl\": \"\"}, {\"id\": \"b8\", \"title\": \"返却\", \"role\": \"覚えていられなくても、台帳を開けば名前を呼べる\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"b7\"], \"plants\": [], \"pays\": [\"g2\"], \"chars\": \"沖田、三輪、宇佐見\", \"note\": \"\", \"cards\": [\"p3\", \"p2\", \"p1\", \"i4\", \"i6\", \"i7\", \"e4\"], \"pageData\": [], \"text\": \"椅子の上で目を覚ますと、七時五十分だった。\\n\\n沖田は真っ先に台帳を開いた。\\n昨夜書いた行は、全部残っていた。そのいちばん下に、几帳面な字が二行、増えていた。\\n\\n〈整合：矛盾なし〉\\n〈返却を認める〉\\n\\n保管棚を見る。カーディガンも、ボールペンも、名札も、職員証も、印鑑も、なくなっていた。荷札だけが一枚ずつ、棚の上にきちんと並べてあった。\\n三十年前の黒い傘は、まだ棚のいちばん奥にある。それを確かめてから、沖田は記録管理室へ向かった。\\n\\n八時二分。\\n窓際の机に、誰かが座っていた。紺のカーディガンを着ている。机の上には、名前の入った名札と、ボールペンと、印鑑。\\n「おはようございます、課長」\\n沖田には、その顔に見覚えがなかった。名前も出てこなかった。\\n\\nだから、手に持っていた台帳を開いた。\\n落とし主の欄に、自分の字で書いてある。\\n\\n「……三輪さんね」\\n\\n三輪は、息を止めたように沖田を見た。\\n「落とし物、預かっていたわ。返しておいたけど、足りないものはない？」\\n三輪は首を振った。何か言おうとして、言葉にならないまま、両手で顔をおおった。\\n\\n八時半。廊下から靴音が来る。缶コーヒーは、二本ではなく三本だった。\\n「課長の分も」と、宇佐見は笑った。\\n\\n沖田は、手帳に書いた。\\n08:02　三輪さんに挨拶。台帳を見て、名前を呼んだ。\\n\\n明日の朝も、自分はこの人を覚えていないだろう。それでも、台帳を開けば名前は書いてある。\\n覚えていられなくても、記録することはできる。私たちは、記録する部署だ。\\n――ときどきは、記録で助けることもできる。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"20\", \"tt\": \"08:02\", \"tl\": \"\"}], \"foreshadows\": [{\"id\": \"g1\", \"name\": \"空けておく欄\"}, {\"id\": \"g2\", \"name\": \"08:02の会釈\"}, {\"id\": \"g3\", \"name\": \"印影「三輪」\"}, {\"id\": \"g4\", \"name\": \"02:58の承認印\"}], \"templates\": [{\"id\": \"kishou\", \"name\": \"起承転結\", \"beats\": [{\"id\": \"k1\", \"name\": \"起\", \"pos\": 0, \"desc\": \"主人公と世界、日常を見せる。\"}, {\"id\": \"k2\", \"name\": \"承\", \"pos\": 20, \"desc\": \"事件が動き出し、状況が広がる。\"}, {\"id\": \"k3\", \"name\": \"転\", \"pos\": 55, \"desc\": \"予想外の出来事で局面が大きく変わる。\"}, {\"id\": \"k4\", \"name\": \"結\", \"pos\": 82, \"desc\": \"決着と、その後の主人公の変化。\"}]}]}, {\"id\": \"stC\", \"links\": [{\"id\": \"lc1\", \"a\": \"p2\", \"b\": \"p1\", \"label\": \"毎朝コーヒーを手渡す\", \"st\": \"stC\"}, {\"id\": \"lc2\", \"a\": \"p8\", \"b\": \"p2\", \"label\": \"処置を担当\", \"st\": \"stC\"}], \"hide\": [], \"status\": {\"p5\": {\"status\": \"dead\", \"statusScene\": \"\"}, \"p1\": {\"status\": \"gone\", \"statusScene\": \"\"}}, \"story\": {\"title\": \"窓際の席\", \"ending\": \"宇佐見は三輪を忘れる処置を受け入れるが、名前も窓も書かずに缶コーヒーを二本買う習慣だけを残し、誰も触れない窓際の缶は毎朝空になりつづける。\", \"totalPages\": 32, \"templateId\": \"kishou\", \"firstSingle\": true, \"endingSceneId\": \"c8\"}, \"scenes\": [{\"id\": \"c1\", \"title\": \"収容記録：SCP-ZZZZ-JP\", \"role\": \"窓のない部屋の「窓際の机」が、文書から広がるミーム汚染として収容されている\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [], \"plants\": [\"h1\", \"h3\"], \"pays\": [], \"chars\": \"宇佐見\", \"note\": \"\", \"cards\": [\"p2\", \"pl2\", \"o1\", \"w5\"], \"pageData\": [], \"text\": \"アイテム番号：SCP-ZZZZ-JP\\nオブジェクトクラス：Euclid\\n\\n特別収容プロトコル：「窓際の机」「窓際の席」およびこれに類する記述を含む、サイト-81K1地下二階・記録管理室に関する文書は、発見しだい該当箇所を黒塗りにしてください。黒塗りの作業は、対抗ミーム処置を受けた職員だけが行います。\\n段階2以上の汚染が確認された職員には、対抗ミーム「北の壁は壁である」の提示と、クラスA記憶処理を行います。\\n記録管理室の北の壁に向かって物品を置く行為は、禁止されています。\\n\\n説明：SCP-ZZZZ-JPは、記録管理室にまつわる文書を介して広がるミーム汚染です。\\n記録管理室は地下二階にあり、窓はありません。しかし2026年11月以降、同室に関する複数の文書に「窓際の机」という記述が現れています。最初の記述は、記録管理課の落とし物台帳への記入（2026年11月19日）で確認されました。\\n\\nこの記述を読んだ職員の一部には、次の段階で影響が現れます。\\n段階1：同室について書くとき、「窓際」という語を使うようになる。\\n段階2：同室の北の壁に、窓を知覚するようになる。窓の外には、朝の光が見えると報告される。\\n段階3：窓際の机に座る女性（SCP-ZZZZ-JP-1）を知覚し、会話や接触ができるようになる。\\n\\n現在、段階3に至った職員は一名です（保安部門・宇佐見恭平）。宇佐見警備員は、毎朝SCP-ZZZZ-JP-1に缶コーヒーを手渡していると証言しています。監視カメラには、宇佐見警備員が北の壁沿いの机に缶を置く様子だけが記録されています。\\n\\nSCP-ZZZZ-JP-1に対応する人事記録は存在しません。\", \"ty\": \"\", \"tm\": \"\", \"td\": \"\", \"tt\": \"\", \"tl\": \"作中資料\"}, {\"id\": \"c2\", \"title\": \"窓のある朝\", \"role\": \"宇佐見にだけ見える窓と三輪。缶を渡す手が触れる\", \"beatId\": \"k1\", \"pages\": 4, \"causes\": [\"c1\"], \"plants\": [\"h2\"], \"pays\": [], \"chars\": \"宇佐見、三輪、小池\", \"note\": \"\", \"cards\": [\"p2\", \"p1\", \"p7\", \"pl2\", \"i3\"], \"pageData\": [], \"text\": \"八時半。缶コーヒーを二本持って、宇佐見恭平は地下二階の廊下を歩いた。\\n\\n記録管理室の扉を開けると、朝の光が目に入る。北の壁の大きな窓から、斜めに差しこむ光だ。地下二階に、光が差すはずはない。宇佐見はそれを知っている。それでも、毎朝この光を見ると、少しほっとする。\\n\\n窓際の机に、三輪栞が座っている。\\n「おはよう、三輪さん」\\n「おはようございます、宇佐見さん」\\n\\n缶を差し出すと、三輪の指が宇佐見の指に触れた。温かかった。缶を開ける音も、ちゃんと聞こえた。\\n「今日もいい天気だな」\\n宇佐見は窓の外を見た。白い光のほかには、何も見えない。空なのか、海なのか、いつも分からない。\\n\\n「宇佐見さん」と三輪が言った。「ここ、本当は窓なんてないんですよ」\\n「知ってる。図面にもないって言われた」\\n「それでも、見えるんですか」\\n「見えるよ。三輪さんが座ってる」\\n\\n三輪は、少し困ったように笑った。\\n廊下を若い研究員の小池が通りかかって、ちらりと部屋をのぞいた。小池の目は、宇佐見のほうだけを見ていた。北の壁に向かって、ひとりでしゃべっている警備員を。\\n\\nその日の昼、宇佐見のもとに一枚の通知が届いた。\\n対抗ミーム部門、面談のお知らせ。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"24\", \"tt\": \"08:30\", \"tl\": \"\"}, {\"id\": \"c3\", \"title\": \"面談記録\", \"role\": \"宇佐見は段階3と判定され、記憶処理が決まる。段階4は「記録がない」\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"c2\"], \"plants\": [], \"pays\": [], \"chars\": \"宇佐見、鷺沼\", \"note\": \"\", \"cards\": [\"p2\", \"p8\", \"o4\", \"w5\"], \"pageData\": [], \"text\": \"面談記録ZZZZ-JP-1\\n\\n対象：宇佐見恭平（保安部門・警備員）\\n面談者：鷺沼博士（対抗ミーム部門）\\n\\n〈記録開始〉\\n\\n鷺沼博士：記録管理室の図面です。北の壁を見てください。\\n宇佐見：壁ですね。\\n鷺沼博士：窓は描いてありません。\\n宇佐見：ええ。でも、行けばあるんです。\\n鷺沼博士：あなたが毎朝、缶を手渡している相手について話してください。\\n宇佐見：三輪栞さん。記録管理課の研究員補です。\\n鷺沼博士：その名前の職員は、名簿にいません。\\n宇佐見：知ってます。欠番なんでしょう。\\n鷺沼博士：監視カメラには、あなたが壁際の机に缶を置くところしか映っていません。翌朝、その缶は空になっています。誰が飲んでいるのか、私たちは確認できていません。\\n宇佐見：三輪さんが飲んでるんですよ。\\n鷺沼博士：宇佐見さん。あなたが見ているものは、文書から広がったミームです。あなたは毎朝コーヒーを置くことで、それに形を与えています。\\n宇佐見：……形を与えてるなら、それでいいじゃないですか。\\n鷺沼博士：段階3のまま放置された職員は、いずれ段階4に進むと考えられています。\\n宇佐見：段階4って何です。\\n鷺沼博士：まだ、記録がありません。段階4に進んだ職員は、誰も記録を残していないからです。\\n\\n〈記録終了〉\\n\\n結論：対象は段階3。11月26日10時、対抗ミームの提示とクラスA記憶処理を行う。処置後、対象はSCP-ZZZZ-JP-1に関する記憶をすべて失う見込み。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"24\", \"tt\": \"14:00\", \"tl\": \"\"}, {\"id\": \"c4\", \"title\": \"黒塗りの台帳\", \"role\": \"汚染の始まりは沖田の台帳の一行。沖田はもう見えない\", \"beatId\": \"k2\", \"pages\": 4, \"causes\": [\"c3\", \"c1\"], \"plants\": [], \"pays\": [\"h1\"], \"chars\": \"宇佐見、沖田\", \"note\": \"\", \"cards\": [\"p2\", \"p3\", \"i8\", \"pl2\"], \"pageData\": [], \"text\": \"夕方、宇佐見は記録管理課の課長室をたずねた。\\n沖田礼子は、落とし物台帳を机に広げていた。最初の「窓際の机」が書かれた台帳だ。いくつかの行は、もう黒く塗りつぶされていた。\\n\\n「私が書いたのよ」と沖田は言った。「落とし主の欄に。記録管理課の窓際の机の人、って」\\n沖田は、黒塗りの行を指でなぞった。\\n「書いたときは、ちゃんと窓があった気がしたの。だから、そう書いた。今はもう、思い出せない」\\n\\n管理職は、汚染の疑いが出た時点で対抗ミーム処置を受ける決まりになっている。沖田は三日前にそれを受けていた。手帳の「08:02」の行は、そこで途切れていた。\\n「私にはもう、北の壁は壁にしか見えない。台帳を開いても、名前を読んでも、何も感じない。あの人は、宇佐見さんの中にしかいないの」\\n\\n宇佐見は、拳をにぎった。\\n「処置を受けたら、俺も忘れるんですよね」\\n「ええ」\\n「そうしたら、三輪さんは」\\n沖田は、少し黙ってから言った。\\n「分からない。見る人がいなくなった窓が、どうなるのか。誰も記録していないから」\\n\\n帰りぎわ、沖田は宇佐見を呼び止めた。\\n「宇佐見さん。あの人に聞いてみて。窓の外に、何が見えるのか」\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"24\", \"tt\": \"17:30\", \"tl\": \"\"}, {\"id\": \"c5\", \"title\": \"窓の外\", \"role\": \"窓の外は記録からこぼれたものが流れていく場所。三輪は処置を受けるよう頼む\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"c4\"], \"plants\": [], \"pays\": [\"h3\"], \"chars\": \"宇佐見、三輪\", \"note\": \"\", \"cards\": [\"p2\", \"p1\", \"pl2\", \"i7\"], \"pageData\": [], \"text\": \"その夜、宇佐見は警備の巡回を少しだけ外れて、記録管理室に入った。\\n真夜中なのに、窓の外はうっすらと明るかった。三輪は、窓際の机にいた。\\n\\n「眠らないのか」\\n「ここでは、眠くならないんです」\\n\\n宇佐見は、窓の前に立った。白い光の奥で、何かがゆっくりと流れていくのが見えた。名札。手紙。傘。誰かの名前を書いた紙。\\n「あれは何だ」\\n「記録からこぼれたものです」と三輪は言った。「書かれなかったこと。消されたこと。誰にも覚えられなかった人。全部、あそこを流れていくんです」\\n\\n三輪は、窓の外を見たまま言った。\\n「整合官補の仕事って、何かを直すことじゃなかったんです。ここに座って、流れていくものを見ていること。誰か一人でも見ていれば、それは、まったくなかったことにはならないから」\\n\\nそれから、宇佐見のほうを向いた。\\n「段階4のこと、聞きましたよね」\\n「記録がないって」\\n「私は知っています。窓の外に、行ってしまうんです。見ているうちに、だんだん向こう側に近づいて、最後は流れていくものの一つになる」\\n\\n三輪は、宇佐見の手を取った。指は、やはり温かかった。\\n「宇佐見さんまで、こっちに来ないでください。処置を受けてください」\\n「そうしたら、俺は三輪さんを忘れる」\\n「はい」\\n「それでいいのか」\\n三輪は答えなかった。窓の外で、黒い傘が一本、ゆっくりと流れていった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"25\", \"tt\": \"00:30\", \"tl\": \"\"}, {\"id\": \"c6\", \"title\": \"書かずに残すもの\", \"role\": \"名前も窓も書かない。残すのは、缶コーヒーを二本買う習慣だけ\", \"beatId\": \"k3\", \"pages\": 4, \"causes\": [\"c5\", \"c3\"], \"plants\": [], \"pays\": [], \"chars\": \"宇佐見、鷺沼\", \"note\": \"\", \"cards\": [\"p2\", \"p8\", \"pl4\", \"p5\"], \"pageData\": [], \"text\": \"処置の前日、宇佐見は鷺沼博士にもう一度会った。\\n\\n「忘れたあとも、残せるものはありますか」\\n鷺沼博士は首を振った。\\n「書いたものは黒塗りになります。録音も同じです。三輪栞という名前も、窓のことも、文書には残せません。残せば、次の誰かが汚染されます」\\n「名前も、窓も、書かなければいいんですね」\\n「……何をするつもりですか」\\n「何も書きません」と宇佐見は言った。「毎朝、缶コーヒーを二本買う。それだけです。それは、ミームじゃないでしょう」\\n\\n鷺沼博士は、しばらく宇佐見を見ていた。それから、手元の書類に何かを書きこんだ。\\n「習慣までは、記憶処理では消えません。何のための習慣だったかは、忘れますが」\\n「それで十分です」\\n\\nその夜、宇佐見は購買部で缶コーヒーを二本買った。\\n帰り道、慰霊碑の前を通った。佐伯の名前が、ちゃんと彫ってある。三輪が取り戻してくれた名前だ。\\n宇佐見は、碑の前でしばらく立ち止まってから、言った。\\n「明日から、たぶん俺は、おまえの話をしても三輪さんの話はできなくなる。悪いな」\\nもちろん、返事はなかった。\", \"ty\": \"2026\", \"tm\": \"11\", \"td\": \"25\", \"tt\": \"13:00\", \"tl\": \"\"}, {\"id\": \"c7\", \"title\": \"最後の二本\", \"role\": \"処置の前の朝。「毎朝、窓を開けておきます」\", \"beatId\": \"k4\", \"pages\": 4, \"causes\": [\"c6\"], \"plants\": [], \"pays\": [], \"chars\": \"宇佐見、三輪\", \"note\": \"\", \"cards\": [\"p2\", \"p1\", \"i3\", \"pl2\"], \"pageData\": [], \"text\": \"十一月二十六日、八時半。\\n処置は十時からだった。\\n\\n記録管理室の窓は、いつもより明るかった。三輪は窓際の机で、宇佐見を待っていた。\\n「おは
