<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ストーリーカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* 原稿用紙の作業机：ノンフォトブルーの罫線とインクの黒。左＝シーン一覧、中央＝作業面、右＝選択中のシーン */
:root{
  --paper:#f7f9fb; --sheet:#ffffff; --ink:#15181d; --muted:#5d6874; --line:#d2e1eb; --line-soft:#e6eff5;
  --blue:#4fa3d9; --blue-ink:#1b6595; --blue-wash:#e7f2f9;
  --err:#bf3a27; --err-wash:#fbe8e4; --warn:#a96600; --warn-wash:#fbf0db; --ok:#2b7a53; --info-wash:#eef1f4;
  --c-person:#b04a72; --c-place:#2f7d5c; --c-item:#9c6a12; --c-world:#6555b0; --c-episode:#1b6595; --c-memo:#66717d; --c-org:#8a5634;
  --m-paper:#efe9da; --m-sea:#c9dfec; --m-land:#e7dfc3; --m-forest:#b5d0a0; --m-mount:#cbbca2; --m-water:#98c3de; --m-desert:#ead6a0; --m-snow:#f3f6f8; --m-city:#e2c6bc; --m-road:#8a6a50; --m-river:#3f86bb; --m-border:#7a5591; --m-rail:#3d3d3d; --m-roadfill:#f6eedc; --m-floor:#f4f1ea; --m-wall:#3b3f46; --m-tatami:#d9d6a4; --m-wood:#b98d5f; --m-door:#8a6a50; --m-glass:#9fd0ea; --m-bldg:#cfc6ba; --m-railw:#ffffff;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161b; --sheet:#171d23; --ink:#e5eaef; --muted:#8e99a5; --line:#2b3742; --line-soft:#212b34;
  --blue:#6ab4e4; --blue-ink:#8ccaf0; --blue-wash:#18303f;
  --err:#ef7d6a; --err-wash:#3a1f1b; --warn:#e3a94a; --warn-wash:#352a15; --ok:#6cc79a; --info-wash:#1d242b;
  --c-person:#e88aae; --c-place:#6fc79f; --c-item:#e0b25a; --c-world:#a89cf0; --c-episode:#8ccaf0; --c-memo:#9aa5b1; --c-org:#d9a27c; --m-paper:#2a2923; --m-sea:#18303d; --m-land:#3a3727; --m-forest:#2b4027; --m-mount:#4a4033; --m-water:#245470; --m-desert:#4c4127; --m-snow:#3b4247; --m-city:#4a3530; --m-road:#c9a688; --m-river:#6db2e0; --m-border:#bb97cf; --m-rail:#cfcfcf; --m-roadfill:#5c4f40; --m-floor:#2c2e32; --m-wall:#c9ced6; --m-tatami:#5a5838; --m-wood:#8a6a48; --m-door:#d2b49a; --m-glass:#4f8fb3; --m-bldg:#55504a; --m-railw:#2a2c30; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161b; --sheet:#171d23; --ink:#e5eaef; --muted:#8e99a5; --line:#2b3742; --line-soft:#212b34;
  --blue:#6ab4e4; --blue-ink:#8ccaf0; --blue-wash:#18303f;
  --err:#ef7d6a; --err-wash:#3a1f1b; --warn:#e3a94a; --warn-wash:#352a15; --ok:#6cc79a; --info-wash:#1d242b;
  --c-person:#e88aae; --c-place:#6fc79f; --c-item:#e0b25a; --c-world:#a89cf0; --c-episode:#8ccaf0; --c-memo:#9aa5b1; --c-org:#d9a27c; --m-paper:#2a2923; --m-sea:#18303d; --m-land:#3a3727; --m-forest:#2b4027; --m-mount:#4a4033; --m-water:#245470; --m-desert:#4c4127; --m-snow:#3b4247; --m-city:#4a3530; --m-road:#c9a688; --m-river:#6db2e0; --m-border:#bb97cf; --m-rail:#cfcfcf; --m-roadfill:#5c4f40; --m-floor:#2c2e32; --m-wall:#c9ced6; --m-tatami:#5a5838; --m-wood:#8a6a48; --m-door:#d2b49a; --m-glass:#4f8fb3; --m-bldg:#55504a; --m-railw:#2a2c30; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:24px 24px;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1560px;margin:0 auto}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.story-title{flex:1 1 220px;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:18px;font-weight:700;padding:4px 2px}
.top-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);font-size:12px;white-space:nowrap}
.pill.err{border-color:var(--err);color:var(--err);background:var(--err-wash)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-wash)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
button.pill{cursor:pointer}
.ending-line{display:flex;gap:10px;align-items:baseline;margin:12px 0 0;flex-wrap:wrap}
.ending-line label{font-size:11px;letter-spacing:.1em;color:var(--blue-ink);font-weight:700;white-space:nowrap}
.ending-line input{flex:1 1 300px;min-width:0;border:1px solid var(--line);background:var(--sheet);padding:6px 10px;border-radius:4px}

/* tabs */
.stickyhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);box-shadow:0 0 0 100vmax var(--paper);clip-path:inset(0 -100vmax -12px -100vmax);margin-top:-16px;padding-top:16px}
.stickyhead.stuck{box-shadow:0 0 0 100vmax var(--paper),0 6px 10px -8px rgba(0,0,0,.35)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--paper)}
@media (max-width:760px){.stickyhead{position:static;margin-top:0;padding-top:0;clip-path:none;box-shadow:none}.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper)}}
.tabs{display:flex;gap:2px;margin:16px 0 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 14px;border-radius:6px 6px 0 0;white-space:nowrap;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink);margin-bottom:-1px;font-weight:700}
.tabs-sep{flex:1 0 16px}
.tabs-lab{align-self:center;font-size:10px;letter-spacing:.14em;color:var(--muted);padding:0 4px;white-space:nowrap}
.tabs button.subtab{font-size:12px;padding:6px 10px}
.treedir{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;background:var(--sheet)}
.treedir button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--ink)}
.treedir button+button{border-left:1px solid var(--line)}
.treedir button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.dead-tag{display:inline-block;margin:6px 0 0 4px;font-size:11px;color:var(--warn);font-weight:700}
.seeds{margin-top:18px;border-top:2px solid var(--ink);padding-top:10px}
.seeds h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0 0 8px}
.seeds ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seeds li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:4px;background:var(--blue-wash);font-size:13px}
@media (max-width:560px){.seeds li{grid-template-columns:minmax(0,1fr) auto}.seeds li .seed-t{grid-column:1 / -1}}
.seed-t{font-size:11px;font-weight:700;color:var(--blue-ink);letter-spacing:.06em}
.btn:disabled{opacity:.4;cursor:default}

.grid.wide{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:760px){.grid.wide{grid-template-columns:minmax(0,1fr)}}
.zpct{font-size:11px;color:var(--muted);min-width:38px;text-align:right}
.zsvg{display:block;width:100%;height:auto;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.zsvg.msvg{touch-action:none}
.zsvg.panning{cursor:grabbing}
.fn rect{fill:var(--sheet);stroke:var(--ct);stroke-width:1.6}
.fn rect.s{fill:var(--ct);stroke:none}
.fn text{fill:var(--ink);font-size:13px;font-family:var(--f-body)}
.fn.virt rect{stroke:var(--muted);stroke-dasharray:4 3;fill:var(--paper)}
.fn.virt text{fill:var(--muted)}
.fn{cursor:pointer}
.fn[data-act]:hover rect:first-of-type{stroke-width:3}
.fn text.fl-role{font-size:10px;fill:var(--muted)}
.fl-pc,.fl-sib{fill:none;stroke:var(--ink);stroke-width:1.5}
.fl-sib{stroke-dasharray:2 3}
.fl-sp{stroke:var(--ink);stroke-width:1.5}
.fl-other{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.fl-rel{font-size:11px;font-weight:700;fill:var(--blue-ink);font-family:var(--f-body);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.fl-lab{font-size:10px;fill:var(--muted);font-family:var(--f-body);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.oc-l{fill:none;stroke:var(--ink);stroke-width:1.4}
.oc-sub{stroke:var(--c-org);stroke-dasharray:6 3}
.oc-p rect{fill:var(--sheet);stroke:var(--ct);stroke-width:1.4}.oc-p rect.s{fill:var(--ct);stroke:none}
.oc-o rect{fill:var(--ct);stroke:none}
.oc-oname{fill:var(--sheet);font-weight:700;font-size:15px;font-family:var(--f-body)}
.oc-o .oc-role{fill:var(--sheet);opacity:.85}
.oc-name{fill:var(--ink);font-size:13px;font-weight:500;font-family:var(--f-body)}
.oc-role{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.oc-p,.oc-o{cursor:pointer}.oc-p:hover rect:first-of-type{stroke-width:3}
.maptabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.mapgrid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.mapwrap{flex:1 1 460px;min-width:0}
.mside{flex:1 1 240px;max-width:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
.mpanel{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mpanel h4,.mpanel summary{margin:0;font-size:12px;letter-spacing:.08em;color:var(--blue-ink);font-weight:700}
.mpanel summary{cursor:pointer}
.fld2{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.fld2>span{font-size:11px;color:var(--muted)}
.fld2 input[type=text],.fld2 select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:5px 8px;width:100%;min-width:0;color:var(--ink)}
.fld2 input[type=file]{font-size:12px;max-width:100%}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mplaces{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.mplaces li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 6px;border-radius:4px;border:1px solid var(--line-soft);font-size:13px}
.mplaces li.on{border-color:var(--blue);background:var(--blue-wash)}
.mp-acts{display:flex;gap:4px}
.m-bg.bg-sea{fill:var(--m-sea)}.m-bg.bg-paper{fill:var(--m-paper)}.m-bg.bg-plain{fill:var(--sheet)}
.m-gridline{fill:none;stroke:var(--ink);stroke-opacity:.07;stroke-width:1}
.m-area{stroke:var(--ink);stroke-opacity:.3;stroke-width:1.5}
.ter-land{fill:var(--m-land)}.ter-forest{fill:var(--m-forest)}.ter-mountain{fill:var(--m-mount)}.ter-water{fill:var(--m-water)}.ter-desert{fill:var(--m-desert)}.ter-snow{fill:var(--m-snow)}.ter-city{fill:var(--m-city)}
.legend i.ter-sw{border:1px solid var(--line)}
.m-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ls-road{stroke:var(--m-road);stroke-width:4;stroke-dasharray:10 5}
.ls-river{stroke:var(--m-river)}
.ls-border{stroke:var(--m-border)}
.ls-rail{stroke:var(--m-rail);stroke-linecap:butt!important}
.ls-rail-w{fill:none;stroke:var(--m-railw);stroke-linecap:butt}
.m-station{fill:var(--sheet);stroke:var(--m-rail);stroke-width:2.2}
.mi.msel .m-station{stroke:var(--blue);stroke-width:3}
.m-slabel{font-family:var(--f-body);font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.m-hit{fill:none;stroke:var(--blue);stroke-opacity:0;stroke-width:16}
.m-pin{fill:var(--c-place);stroke:var(--sheet);stroke-width:2.5}
.m-pin.fac{fill:var(--c-org)}
.m-pin-dot{fill:var(--sheet)}
.m-plabel,.m-alabel,.m-llabel{font-family:var(--f-body);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round;font-weight:700}
.m-alabel{font-size:15px;letter-spacing:.1em}
.m-llabel{font-size:12px;font-weight:500}
.mi{cursor:move}
.msvg.mtool-pin,.msvg.mtool-area,.msvg.mtool-line,.msvg.mtool-pin .mi,.msvg.mtool-area .mi,.msvg.mtool-line .mi{cursor:crosshair}
.mi.msel .m-area{stroke:var(--blue);stroke-opacity:1;stroke-width:3;stroke-dasharray:7 4}
.mi.msel .m-pin{stroke:var(--blue);stroke-width:4}
.mi.msel .m-hit{stroke-opacity:.25}
.m-handle{fill:var(--sheet);stroke:var(--blue);stroke-width:2;cursor:nwse-resize}
.m-temp{fill:var(--blue);fill-opacity:.12;stroke:var(--blue);stroke-dasharray:6 4}
.m-rubber{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.m-drawing,.m-vtx{pointer-events:none}
.m-vtx{fill:var(--sheet);stroke:var(--blue);stroke-width:2}
.m-compass{pointer-events:none}
.m-compass circle{fill:var(--sheet);fill-opacity:.8;stroke:var(--ink);stroke-opacity:.4}
.m-compass path{fill:var(--muted)}.m-compass path.n{fill:var(--err)}
.m-compass text{font-family:var(--f-mono);font-size:12px;fill:var(--ink);font-weight:700}

.m-road-case{fill:none;stroke:var(--m-road);stroke-linecap:round;stroke-linejoin:round}
.m-road-fill{fill:none;stroke:var(--m-roadfill);stroke-linecap:round;stroke-linejoin:round}
.m-road-case.sel{stroke:var(--blue)}
.m-railing{fill:none;stroke:var(--m-wall);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.m-bridge-shadow{fill:none;stroke:#000;stroke-opacity:.18;stroke-linecap:butt}
.m-roth{fill:var(--sheet);stroke:var(--blue);stroke-width:2;cursor:grab}
.m-rotline{stroke:var(--blue);stroke-width:1.2;stroke-dasharray:3 3;pointer-events:none}
.tfbar{display:flex;flex-wrap:wrap;gap:4px}
.viewbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
.viewbar label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.viewbar .gmode button{padding:5px 12px}
.b3-side,.b3-top{stroke:var(--ink);stroke-opacity:.35;stroke-width:1;stroke-linejoin:round}
.b3-side{stroke-opacity:.08;stroke-width:.8}
.b3-shade{fill:#000;stroke:none;pointer-events:none}
.b3-wall{fill:var(--m-wall)}
.b3-side.b3-wall,.b3-top.b3-wall{stroke:var(--ink);stroke-opacity:.5}
.b3-top.b3-wall{fill:color-mix(in srgb,var(--m-wall) 80%,var(--sheet))}
.b3-lab,.b3-tlab,.b3-plab{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.b3-lab{font-size:13px}.b3-tlab{font-size:15px}.b3-plab{font-size:12px}
.b3-mini{font-size:9px;fill:var(--muted);font-family:var(--f-body)}
.b3-stem{stroke:var(--ink);stroke-width:1.5}
.m3d{background:var(--paper)}
.floorbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.floorchip{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 14px;font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--ink)}
.floorchip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.fg-cell{fill:var(--muted);fill-opacity:.16}
.fg-wall{stroke:var(--muted);stroke-opacity:.55;stroke-width:3;stroke-dasharray:6 4;stroke-linecap:square}
.fg-stairs{fill:none;stroke-width:2.5}
.fg-stairs.down{stroke:var(--warn);fill:var(--warn);fill-opacity:.18}
.fg-stairs.up{stroke:var(--c-world);stroke-dasharray:4 3;fill:var(--c-world);fill-opacity:.08}
.fg-st-lab{font-size:10px;font-weight:700;font-family:var(--f-body);paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.fg-st-lab.down{fill:var(--warn)}.fg-st-lab.up{fill:var(--c-world)}
.ab-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 92px 24px;gap:6px;align-items:center}
.card.editing .ab-row input,.card.editing .ab-row select{background:var(--sheet);width:100%;padding:4px 6px;font-size:13px}
.aff-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto 76px 24px;gap:6px;align-items:center}
.aff-row input,.aff-row select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 6px;min-width:0;width:100%;color:var(--ink);font-size:13px}
.aff-w{font-size:13px;color:var(--muted)}
@media (max-width:560px){.aff-row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.aff-row select{grid-column:1 / 3}}
.absum{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);font-size:13px;margin-bottom:6px}
.absum b{font-size:11px;color:var(--blue-ink);letter-spacing:.06em;margin-right:6px}
.abh{font-family:var(--f-display);font-weight:400;font-size:15px;margin:18px 0 8px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrow{border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.mhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mlab{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.mlab.g2,.mtx td.g2{color:var(--ok)}.mlab.g1,.mtx td.g1{color:var(--ok);opacity:.85}.mlab.g0,.mtx td.g0{color:var(--muted)}.mlab.b1,.mtx td.b1{color:var(--warn)}.mlab.b2,.mtx td.b2{color:var(--err)}
.mbar{position:relative;width:120px;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.mbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--muted)}
.mbar i{position:absolute;top:0;bottom:0}.mbar i.pos{background:var(--ok)}.mbar i.neg{background:var(--err)}
.mwhy{font-size:12px;margin-top:4px;line-height:1.6}
.mwhy.pos{color:var(--ok)}.mwhy.neg{color:var(--err)}.mwhy.tip{color:var(--blue-ink);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mtx{font-size:12px}.mtx th,.mtx td{text-align:center;white-space:nowrap;border:1px solid var(--line-soft);padding:4px 6px}
.mtx td{font-weight:700}.mtx td.self{color:var(--line)}
.mtx td.g2{background:color-mix(in srgb,var(--ok) 14%,transparent)}.mtx td.b2{background:color-mix(in srgb,var(--err) 14%,transparent)}
.filebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.filecol{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--paper)}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.fprev{font-size:18px;padding:6px 10px;border:1px dashed var(--line);border-radius:4px;background:var(--paper);overflow-wrap:anywhere}
.m-road-center{fill:none;stroke:var(--m-road);stroke-width:1.2;stroke-dasharray:8 6;stroke-linecap:round}
.ter-floor{fill:var(--m-floor)}
.ter-building{fill:var(--m-bldg)}
.m-area.ter-building{stroke-opacity:.65;stroke-width:1.8}
.m-guide{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:4 4;pointer-events:none}
.m-snapw{fill:none;stroke:var(--blue);stroke-width:2.5;pointer-events:none}
.m-area.ter-floor{stroke-opacity:.5}
.m-vh{fill:var(--sheet);stroke:var(--blue);stroke-width:2;cursor:move}
.m-mid{fill:var(--blue);fill-opacity:.35;stroke:var(--blue);stroke-width:1;cursor:copy}
.m-drawpoly{fill:var(--blue);fill-opacity:.1;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.m-tlabel{font-family:var(--f-display);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round;letter-spacing:.06em}
.m-tsel{fill:none;stroke:var(--blue);stroke-dasharray:4 3}
.m-gridline.strong{stroke-opacity:.16}
.msvg.mtool-paint,.msvg.mtool-erase,.msvg.mtool-wall,.msvg.mtool-text,.msvg.mtool-poly,.msvg.mtool-paint .mi,.msvg.mtool-erase .mi,.msvg.mtool-wall .mi,.msvg.mtool-text .mi,.msvg.mtool-poly .mi{cursor:crosshair}
.m-wall{stroke:var(--m-wall);stroke-linecap:square;fill:none}
.m-wall.prev{stroke:var(--blue);stroke-opacity:.8}
.m-snap{fill:var(--blue);pointer-events:none}
.tl-floor{fill:var(--m-floor);stroke:var(--line);stroke-width:.5}
.tl-wall{fill:var(--m-wall)}
.tl-door{fill:none;stroke:var(--m-door);stroke-width:1.5}
.tl-doorleaf{stroke:var(--m-door);stroke-width:2.5}
.tl-window{fill:var(--m-glass);stroke:var(--m-wall);stroke-width:1}
.tl-step{stroke:var(--muted);stroke-width:1.2}
.tl-arrow{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tl-tatami{fill:var(--m-tatami);stroke:var(--m-wood);stroke-width:1}
.tl-tline{stroke:var(--m-wood);stroke-width:.8;opacity:.6}
.tl-table{fill:var(--m-wood);stroke:var(--m-wall);stroke-width:.8}
.tl-water{fill:var(--m-water)}
.tl-wave{fill:none;stroke:var(--sheet);stroke-width:1.2;opacity:.8}
.tl-grass{fill:var(--m-forest)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 2px;font-size:11px;color:var(--ink)}
.pal.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-wash);background:var(--sheet);font-weight:700}
.pal svg{border:1px solid var(--line)}
.mtools{flex-wrap:wrap}
.legend svg{vertical-align:middle}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;margin-left:4px;color:var(--err)}

/* layout */
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:220px minmax(0,1fr)}.editor{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.side,.editor{position:sticky;top:calc(var(--headh,0px) + 12px);max-height:calc(100vh - var(--headh,0px) - 24px);overflow:auto}
@media (max-width:1180px){.editor{position:static;max-height:none}}
@media (max-width:760px){.side{position:static;max-height:340px}}
.box-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--blue-ink)}
.main{min-width:0}
.sec{padding:16px}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:65ch;font-size:13px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--sheet);padding:5px 10px;border-radius:4px;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);color:var(--sheet);border-color:var(--err)}
.btn.sm{padding:2px 7px;font-size:11px}
.ibtn{border:0;background:transparent;padding:2px 5px;color:var(--muted);border-radius:3px}
.ibtn:hover{background:var(--blue-wash);color:var(--ink)}

/* scene list */
.scenes{list-style:none;margin:0;padding:6px}
.sc{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 6px;align-items:start;padding:7px 6px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
.sc:hover{background:var(--blue-wash)}
.sc.sel{background:var(--blue-wash);border-left-color:var(--blue)}
.sc .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.sc .t{font-weight:500;overflow-wrap:anywhere;line-height:1.4}
.sc .m{grid-column:2;font-size:11px;color:var(--muted)}
.sc .mv{grid-row:1 / span 2;grid-column:3;display:flex;flex-direction:column}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.tag-end{font-size:10px;padding:0 5px;border:1px solid var(--ink);border-radius:2px;margin-left:4px;font-weight:700}

/* editor */
.fld{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.fld>span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
.fld textarea{min-height:60px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 90px;gap:8px}
.checks{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto}
.checks label{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:2px 0}
.checks label .later{color:var(--warn);font-size:11px}
.fs-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.fs-row label{font-size:11px;display:flex;gap:3px;align-items:center;color:var(--muted)}
.inline{display:flex;gap:6px}
.inline input{flex:1;min-width:0}
.ed-acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.consq{font-size:12px;color:var(--muted)}

/* reverse tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:22px;padding-left:16px;border-left:2px dashed var(--line)}
.tree li{position:relative;padding-top:10px}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:30px;width:14px;border-top:2px dashed var(--line)}
.node{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;cursor:pointer;max-width:560px}
.node:hover{border-color:var(--blue)}
.node.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-wash)}
.node.end{border:2px solid var(--ink)}
.node-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node-top b{font-size:15px}
.node .role{font-size:13px;color:var(--muted);margin-top:2px}
.node-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.node-acts select{border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:12px;padding:3px 6px;max-width:100%}
.kicker{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--blue-ink)}
.root-tag{display:inline-block;margin:6px 0 0 4px;font-size:11px;color:var(--ok);font-weight:700}
.ref{font-size:12px;color:var(--muted);padding:8px 0 0 4px}
.orphans{margin-top:24px;padding:12px;border:1px dashed var(--warn);border-radius:6px;background:var(--warn-wash)}
.orphans b{color:var(--warn)}

/* structure */
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.ctrls label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.ctrls select,.ctrls input[type=number]{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 6px;color:var(--ink)}
.ctrls input[type=number]{width:70px}
.ruler-wrap{overflow-x:auto;padding-bottom:6px}
.ruler{position:relative;min-width:560px;height:150px;margin:0 4px}
.r-beat{position:absolute;top:0;bottom:44px;border-left:1px dashed var(--blue)}
.r-beat span{position:absolute;top:0;left:3px;font-size:11px;color:var(--blue-ink);white-space:nowrap;background:var(--sheet);padding:0 3px}
.r-beat:nth-child(even) span{top:18px}
.r-track{position:absolute;left:0;right:0;bottom:22px;height:40px;background:var(--paper);border:1px solid var(--line)}
.r-scene{position:absolute;top:0;bottom:0;border-right:2px solid var(--sheet);background:var(--blue-wash);color:var(--ink);font-size:11px;padding:2px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;line-height:1.3}
.r-scene.sel{background:var(--blue);color:var(--sheet)}
.r-scene.nob{background:var(--info-wash)}
.r-over{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--err-wash) 0 6px,transparent 6px 12px);border-left:2px solid var(--err)}
.r-ticks{position:absolute;left:0;right:0;bottom:0;height:20px}
.r-ticks span{position:absolute;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--f-mono)}
.tbl-wrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;border-bottom:1px solid var(--ink);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line-soft);padding:6px 8px;vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blue-wash)}
.drift-w{color:var(--warn);font-weight:700}

/* panels */
.spreads{display:flex;flex-direction:column;gap:18px}
.spread{display:flex;flex-direction:row-reverse;gap:0;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.spread>*{flex:1 1 0;min-width:0}
.spread>*+*{border-right:2px solid var(--ink)}
@media (max-width:900px){.spread{flex-direction:column}.spread>*+*{border-right:0;border-top:2px solid var(--ink)}}
.pg{padding:10px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;background:var(--sheet)}
.pg.ghost{background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;min-height:80px}
.pg-head{grid-column:1 / -1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pg-head .no{font-family:var(--f-mono);font-weight:500;font-size:15px}
.side-tag{font-size:11px;padding:0 6px;border-radius:2px;background:var(--info-wash);color:var(--muted)}
.side-tag.turn{background:var(--blue);color:var(--sheet)}
.side-tag.hook{background:var(--ink);color:var(--sheet)}
.thumb{aspect-ratio:1 / 1.414;width:84px;max-width:100%;border:1px solid var(--ink);background:var(--sheet);padding:4px;display:flex;flex-direction:column;gap:3px}
.thumb .tr{display:flex;flex-direction:row-reverse;gap:3px;min-height:0}
.thumb .tc{flex:1;border:1px solid var(--ink);font-family:var(--f-mono);font-size:8px;display:flex;align-items:flex-start;justify-content:flex-end;padding:1px 2px;min-width:0}
.thumb .empty{flex:1;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.plist li{display:grid;grid-template-columns:18px 50px minmax(0,1fr) 22px;gap:4px;align-items:center}
.plist .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.plist select,.plist input{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:3px 4px;font-size:12px;min-width:0;width:100%}
.pcount{font-size:11px;color:var(--muted);margin-left:auto}
.pcount.over{color:var(--warn);font-weight:700}

/* templates */
.tpl-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:700px){.tpl-grid{grid-template-columns:minmax(0,1fr)}}
.tpl-list{display:flex;flex-direction:column;gap:2px}
.tpl-list button{text-align:left;border:1px solid transparent;background:transparent;padding:7px 10px;border-radius:4px}
.tpl-list button.sel{background:var(--blue-wash);border-color:var(--line);font-weight:700}
.tpl-list .using{font-size:10px;color:var(--blue-ink);margin-left:4px}
.beatbar{position:relative;height:34px;border:1px solid var(--line);background:var(--paper);margin:10px 0 18px;min-width:0}
.beatbar i{position:absolute;top:-1px;bottom:-1px;border-left:2px solid var(--blue)}
.beatbar i b{position:absolute;top:100%;left:-3px;font-style:normal;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.btable input,.btable textarea{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:4px 6px;width:100%;min-width:0;font-size:13px}
.btable textarea{min-height:34px;resize:vertical}
.btable td:nth-child(2){width:80px}

/* check */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sum div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--sheet)}
.sum b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.1}
.sum span{font-size:12px;color:var(--muted)}
.sum .e b{color:var(--err)}.sum .w b{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:2px 10px;font-size:12px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issue{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:4px;border-left:4px solid var(--line);background:var(--info-wash)}
.issue.err{border-left-color:var(--err);background:var(--err-wash)}
.issue.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.issue .lv{font-size:11px;font-weight:700}
.issue.err .lv{color:var(--err)}.issue.warn .lv{color:var(--warn)}.issue.info .lv{color:var(--muted)}
.issue .cat{font-size:10px;color:var(--muted);display:block}
.ok-note{padding:16px;border:1px solid var(--ok);border-radius:6px;color:var(--ok)}

/* data dialog */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dialog{background:var(--sheet);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px}
.dialog h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400}
.dialog textarea{width:100%;min-height:220px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:99px;font-size:13px;z-index:30}
.empty-note{padding:24px;color:var(--muted);text-align:center}
/* cards */
.t-person{--ct:var(--c-person)}.t-place{--ct:var(--c-place)}.t-item{--ct:var(--c-item)}.t-world{--ct:var(--c-world)}.t-episode{--ct:var(--c-episode)}.t-memo{--ct:var(--c-memo)}.t-org{--ct:var(--c-org)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--ct);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;
  background-image:repeating-linear-gradient(transparent 0 23px,var(--line-soft) 23px 24px);background-origin:content-box}
.card:hover{box-shadow:0 2px 0 var(--line)}
.card.picked{box-shadow:0 0 0 2px var(--blue)}
.card.editing{grid-column:1 / -1;cursor:default;background-image:none;gap:8px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:24px}
.card.editing .card-top{padding-right:0}
.ctype{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ct)}
.pick{position:absolute;top:8px;right:8px;display:flex}
.card h3{margin:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.cbody{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.ctags{font-size:11px;color:var(--blue-ink);overflow-wrap:anywhere}
.cuse{font-size:11px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cuse.unused{color:var(--warn)}
.card.editing input,.card.editing textarea,.card.editing select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
.card.editing select{width:auto}
.card.editing .ctitle-in{font-size:16px;font-weight:700}
.card.editing textarea{min-height:90px;resize:vertical}
.card-acts{display:flex;gap:8px;flex-wrap:wrap}
.pickbar{position:sticky;top:calc(var(--headh,0px) + 8px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--ink);color:var(--sheet);border-radius:6px;margin-bottom:12px}
.pickbar .btn{background:var(--sheet);color:var(--ink);border-color:var(--sheet)}
.pickbar .btn.ghostb{background:transparent;color:var(--sheet)}
.cchips{display:flex;flex-wrap:wrap;gap:4px}
.cchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-left:3px solid var(--ct);border-radius:3px;background:var(--paper);font-size:12px;max-width:100%}
.cchip-b{border:0;background:transparent;padding:2px 6px;text-align:left;overflow-wrap:anywhere}
.node-cards{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.node-cards span{font-size:11px;border-left:3px solid var(--ct);padding:0 6px;background:var(--paper)}
.sc.drop-on{outline:2px dashed var(--blue);background:var(--blue-wash)}
.dropnew{margin:6px;padding:12px;border:2px dashed var(--line);border-radius:6px;font-size:12px;color:var(--muted);text-align:center}
.dropnew.drop-on{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-wash)}
.search{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 8px;min-width:0;flex:1 1 160px;max-width:260px}
/* tags */
.tagpanel{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;margin-bottom:12px}
.tp-head{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

/* reverse tree */
function treeNode(id,seen,depth,L){
 const s=sc(id);if(!s)return '';const i=idx(id);
 if(seen.has(id))return `<li><div class="ref">↺ ${esc(s.title)}（上で表示済み）</div></li>`;
 seen.add(id);
 const opts=S.scenes.filter(x=>x.id!==id&&!s.causes.includes(x.id)).map(x=>`<option value="${x.id}">${String(idx(x.id)+1).padStart(2,'0')} ${esc(x.title)}</option>`).join('');
 const kids=s.causes.map(c=>treeNode(c,seen,depth+1,L)).join('');
 const isEnd=depth===0;
 return `<li><div class="node ${UI.sel===id?'sel':''} ${isEnd?'end':''}" data-act="sel" data-id="${id}">
  ${isEnd?'<div class="kicker">結末</div>':''}
  <div class="node-top"><span class="mono muted">#${String(i+1).padStart(2,'0')}</span><b>${esc(s.title)||'（無題）'}</b></div>
  <div class="role">${s.role?esc(s.role):'役割が未記入です'}</div>
  ${(s.cards||[]).length?`<div class="node-cards">${s.cards.map(card).filter(Boolean).map(c=>`<span class="t-${c.type}">${esc(c.title)}</span>`).join('')}</div>`:''}
  <div class="node-acts"><button class="btn sm" data-act="addCause" data-id="${id}">＋このシーンの原因を作る</button>
   ${opts?`<select id="lc-${id}" data-act="linkCause" data-id="${id}" aria-label="既存シーンを原因にする"><option value="">既存シーンを原因にする…</option>${opts}</select>`:''}</div>
 </div>${kids?`<ul>${kids}</ul>`:'<div class="root-tag">● 起点（物語の発端）</div>'}</li>`;
}
function fwdNode(id,seen,depth,L,endId){
 const s=sc(id);if(!s)return '';const i=idx(id);
 if(seen.has(id))return `<li><div class="ref">↺ ${esc(s.title)}（上で表示済み）</div></li>`;
 seen.add(id);
 const kidsIds=S.scenes.filter(x=>x.causes.includes(id)).map(x=>x.id);
 const opts=S.scenes.filter(x=>x.id!==id&&!x.causes.includes(id)).map(x=>`<option value="${x.id}">${String(idx(x.id)+1).padStart(2,'0')} ${esc(x.title)}</option>`).join('');
 const kids=kidsIds.map(c=>fwdNode(c,seen,depth+1,L,endId)).join('');
 const isEnd=id===endId,isRoot=depth===0;
 return `<li><div class="node ${UI.sel===id?'sel':''} ${isEnd?'end':''}" data-act="sel" data-id="${id}">
  ${isRoot?'<div class="kicker" style="color:var(--ok)">起点</div>':''}${isEnd?'<div class="kicker">結末</div>':''}
  <div class="node-top"><span class="mono muted">#${String(i+1).padStart(2,'0')}</span><b>${esc(s.title)||'（無題）'}</b></div>
  <div class="role">${s.role?esc(s.role):'役割が未記入です'}</div>
  ${(s.cards||[]).length?`<div class="node-cards">${s.cards.map(card).filter(Boolean).map(c=>`<span class="t-${c.type}">${esc(c.title)}</span>`).join('')}</div>`:''}
  <div class="node-acts"><button class="btn sm" data-act="addEffect" data-id="${id}">＋このシーンの結果を作る</button>
   ${opts?`<select id="le-${id}" data-act="linkEffect" data-id="${id}" aria-label="既存シーンを結果にする"><option value="">既存シーンを結果にする…</option>${opts}</select>`:''}</div>
 </div>${kids?`<ul>${kids}</ul>`:(isEnd?'<div class="root-tag" style="color:var(--ink)">■ 物語の終わり</div>':'<div class="dead-tag">▲ ここで途切れています（結末につながっていません）</div>')}</li>`;
}
function reverseTab(){
 const end=sc(S.story.endingSceneId),L=layout();
 const sw=`<div class="treedir" role="group" aria-label="ツリーの向き"><button aria-pressed="${UI.treeDir==='back'}" data-act="treeDir" data-v="back">後ろから（結末 → 原因）</button><button aria-pressed="${UI.treeDir==='forward'}" data-act="treeDir" data-v="forward">前から（起点 → 結末）</button></div>`;
 const orph=end?S.scenes.filter(s=>!reach(end.id).has(s.id)):[];
 const orphHtml=orph.length?`<div class="orphans"><b>結末につながっていないシーン</b><p class="lead" style="margin:4px 0 8px">どこかのシーンの原因として結ぶか、不要なら削除します。</p>${orph.map(s=>`<button class="btn sm" data-act="sel" data-id="${s.id}" style="margin:0 6px 6px 0">${String(idx(s.id)+1).padStart(2,'0')} ${esc(s.title)}</button>`).join('')}</div>`:'';
 if(UI.treeDir==='forward'){
  let roots=S.scenes.filter(s=>!s.causes.length).map(s=>s.id);if(!roots.length&&S.scenes.length)roots=[S.scenes[0].id];
  const seen=new Set();let tree=roots.map(r=>fwdNode(r,seen,0,L,end&&end.id)).join('');
  const rest=S.scenes.filter(s=>!seen.has(s.id));rest.forEach(s=>{if(!seen.has(s.id))tree+=fwdNode(s.id,seen,0,L,end&&end.id);});
  return `<div class="sec"><h2>ツリー</h2>${sw}
  <p class="lead">一番上が物語の起点（原因のないシーン）です。「このシーンの結果を作る」で、その出来事から起きる次のシーンを後ろに追加していきます。結末にたどり着かない枝は「途切れています」と表示されます。</p>
  ${end?'':'<p class="lead" style="color:var(--warn)">結末シーンがまだ決まっていません。シーンを選び、編集欄の「結末に設定」を押してください。</p>'}
  <ul class="tree">${tree}</ul>${orphHtml}</div>`;
 }
 if(!end)return `<div class="sec"><h2>ツリー</h2>${sw}<p class="lead">結末シーンが決まっていません。左の一覧からシーンを選び、編集欄の「結末に設定」を押してください。「前から」に切り替えると、起点から組み立てることもできます。</p></div>`;
 const seen=new Set();const tree=treeNode(end.id,seen,0,L);
 return `<div class="sec"><h2>ツリー</h2>${sw}
 <p class="lead">一番上が結末です。「このシーンの原因を作る」で、その出来事が起きるために必要なシーンを手前に追加していきます。原因のないシーンは物語の起点になります。</p>
 <ul class="tree">${tree}</ul>
 ${orphHtml}
 </div>`;
}

 if(it.pts)it.pts=it.pts.map(q=>[Math.round(q[0]),Math.round(q[1])]);else{it.x=Math.round(it.x);it.y=Math.round(it.y);it.w=Math.round(it.w);it.h=Math.round(it.h);}

function downscaleImage(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);let url;try{url=cv.toDataURL('image/jpeg',0.82);}catch(e){url=fr.result;}cb(url);};img.onerror=()=>cb(null);img.src=fr.result;};fr.onerror=()=>cb(null);fr.readAsDataURL(file);}

function setField(el,live){
 const d=el.dataset;let v=el.type==='checkbox'?el.checked:el.value;
 switch(d.f){
  case 'story':if(d.k==='totalPages')v=Math.max(1,Math.min(999,parseInt(v)||1));S.story[d.k]=v;break;
  case 'sc':{const s=sc(d.id);if(!s)return;if(d.k==='pages'){v=Math.max(1,Math.min(200,parseInt(v)||1));}s[d.k]=v;if(d.k==='pages')ensurePages(s);break;}
  case 'pn':{const s=sc(d.id);const c=s&&s.pageData[+d.p]&&s.pageData[+d.p].panels[+d.c];if(!c)return;c[d.k]=v;break;}
  case 'bt':{const t=S.templates.find(x=>x.id===d.tid);const b=t&&t.beats.find(x=>x.id===d.bid);if(!b)return;if(d.k==='pos')v=Math.max(0,Math.min(100,Number(v)||0));b[d.k]=v;break;}
  case 'tpln':{const t=S.templates.find(x=>x.id===d.tid);if(t)t.name=v;break;}
  case 'fs':{const f=S.foreshadows.find(x=>x.id===d.fid);if(f)f.name=v;break;}
  case 'cd':{const c=card(d.cid);if(c)c[d.k]=v;break;}
  case 'floor':{const m=curMap();const f=m&&m.floors&&m.floors[m.fcur];if(!f)return;f[d.k]=v;if(live){const b=document.querySelector('.floorchip.on');if(b)b.textContent=v||'階';}break;}
  case 'mi':{const m=curMap();const it=m&&m.items.find(x=>x.id===UI.msel);if(!it)return;
   if(d.k==='shape'){const from=it.shape||'ellipse';if(v==='poly'&&from!=='poly'){if(from==='rect')it.pts=[[it.x,it.y],[it.x+it.w,it.y],[it.x+it.w,it.y+it.h],[it.x,it.y+it.h]];else{it.pts=[];for(let i=0;i<12;i++){const a=i/12*Math.PI*2;it.pts.push([Math.round(it.x+it.w/2+Math.cos(a)*it.w/2),Math.round(it.y+it.h/2+Math.sin(a)*it.h/2)]);}}}
    else if(v!=='poly'&&from==='poly'){const b=bboxOf(it.pts);Object.assign(it,{x:Math.round(b.x),y:Math.round(b.y),w:Math.max(20,Math.round(b.w)),h:Math.max(20,Math.round(b.h))});delete it.pts;}it.shape=v;break;}
   if(d.k==='height'){if(v===''||v==null)delete it.height;else it.height=Math.max(0,Math.min(40,Number(v)||0));break;}
   if(d.k==='width'||d.k==='size'){it[d.k]=Number(v);if(live){save();schedule();return;}break;}
   it[d.k]=v;if(!live&&['terrain','gap','place'].includes(d.k))enforceGap(m,it);break;}
  case 'map':{const m=curMap();if(!m)return;if(d.k==='wallH'){m.wallH=Math.max(1,Math.min(10,Number(v)||3));break;}if(d.k==='cols'||d.k==='rows'){m[d.k]=Math.max(5,Math.min(120,parseInt(v)||m[d.k]));m.w=m.cols*(m.cs||32);m.h=m.rows*(m.cs||32);delete UI.views['map:'+m.id];break;}if(d.k==='size'){const [w,h]=String(v).split('x').map(Number);if(w&&h){m.w=w;m.h=h;delete UI.views['map:'+m.id];}}else if(d.k==='imgOp')m.imgOp=Number(v)/100;else m[d.k]=v;break;}
  case 'lk':{const l=S.links.find(x=>x.id===d.lid);if(l)l.label=v;break;}
  case 'aff':{const r=(S.affinity||[])[+d.i];if(!r)return;r[d.k]=d.k==='v'?Number(v):v;break;}
  case 'edge':{const info=edgeInfo(UI.edEdge);if(!info)return;info.set(v);
   const t=document.querySelector('.gl.editing');if(t){const e=attrEdges().find(x=>x.a===UI.edEdge.a&&x.b===UI.edEdge.b&&x.src===UI.edEdge.src);t.textContent=UI.edEdge.kind==='man'?v:(e?e.label:v);}
   else if(live&&v){save();schedule();return;}
   break;}
  case 'cdp':{const c=card(d.cid);if(!c)return;c[d.k]=c[d.k]||{place:'',text:''};
   if(d.p==='place'&&v==='__new'){const t=(c[d.k].text||'').trim()||'新しい場所';const np={id:uid(),type:'place',title:t,body:'',tags:''};S.cards.push(np);c[d.k].place=np.id;if(c[d.k].text.trim()===t)c[d.k].text='';toast(`場所カード「${t}」を作りました`);}
   else c[d.k][d.p]=v;break;}
  case 'cdl':{const c=card(d.cid);const r=c&&c[d.k]&&c[d.k][+d.i];if(!r)return;
   if((d.p==='card'||d.p==='org')&&v==='__new'){const nt=d.nt||'person';const t=(r.name||'').trim()||(nt==='org'?'新しい組織':'新しい人物');const np={id:uid(),type:nt,title:t,body:'',tags:''};S.cards.push(np);r[d.p]=np.id;r.name='';toast(`${CT[nt]}カード「${t}」を作りました`);}
   else{r[d.p]=v;if(d.p==='role'){delete r.auto;delete r.base;}}break;}
  case 'cdv':{const c=card(d.cid);if(!c)return;c[d.k]=v;if(d.k==='gender'){const n=refreshAutoRoles(c.id);if(n)setTimeout(()=>toast(`ほかのカードの続柄を${n}件、性別に合わせて直しました`),10);}if(d.k==='facility'&&v&&!c.loc)c.loc={place:'',text:''};break;}
 }
 save();if(!live){snapshotNow();schedule();}
}

document.addEventListener('keydown',e=>{
